name: seatmap_checkin
description: Door scanner for Seatmap events — pair a device, scan tickets, work offline.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  # Camera and barcode decoding, with a software decoder so it works where the browser has no
  # native BarcodeDetector — which is most iPhones, and half of a venue's staff phones.
  mobile_scanner: ^7.4.0
  # The device token and the offline queue have to survive a reload; a door phone gets reloaded.
  shared_preferences: ^2.5.5
  http: ^1.6.0
  # Right-to-left layout and Material's own strings — a Persian door gets a Persian "Cancel" in
  # every dialog Flutter draws, which is not something this app's catalogue can reach.
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Roboto is bundled, not fetched. The engine downloads it from fonts.gstatic.com when the app
  # does not carry its own copy, and a scanner that needs Google's CDN before it can draw a word is
  # a scanner that shows a blank screen on a venue's guest wifi. Declaring the family here is also
  # what tells the engine to stop asking for it.
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Medium.ttf
          weight: 500
        - asset: fonts/Roboto-Bold.ttf
          weight: 700

    # Arabic script, for the Persian and Arabic doors. Roboto has none of it, and the engine's
    # answer to a glyph it does not have is to fetch a fallback from fonts.gstatic.com — which
    # --no-web-resources-cdn switches off and a venue's wifi would block anyway. Without this the
    # Persian screens render as rows of empty boxes: laid out correctly, and unreadable.
    #
    # Vazirmatn (SIL OFL, fonts/Vazirmatn-OFL.txt) rather than Noto Sans Arabic because it is drawn
    # for Persian UI at small sizes, which is what this is.
    - family: Vazirmatn
      fonts:
        - asset: fonts/Vazirmatn-Regular.ttf
        - asset: fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: fonts/Vazirmatn-Bold.ttf
          weight: 700

    Event:
      type: object
      properties:
        id: { type: string, format: uuid }
        public_id: { type: string }
        name: { type: string }
        image_url: { type: [string, "null"], format: uri, description: "The event's poster, shown on the hosted site and in listings." }
        category: { type: [string, "null"], description: "One word for the kind of evening this is — Concert, Theatre, Sport." }
        status: { type: string, enum: [draft, published, closed, cancelled] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        cancelled_at: { type: [string, "null"], format: date-time }
        cancellation_reason:
          type: [string, "null"]
          description: "Why the night is off, in the organiser's own words."
        rescheduled_from:
          type: [string, "null"]
          format: date-time
          description: "The date this used to be on, kept rather than overwritten."
        timezone: { type: string }
        currency: { type: string }
        currency_decimals:
          type: integer
          description: >
            Decimal places that currency has. Sent because the picker formats money in the browser,
            and a table of currency exponents copied into JavaScript is one that goes out of date
            somewhere nobody is looking.
        venue_id: { type: string, format: uuid }
        seat_map_version_id: { type: [string, "null"], format: uuid }
        waiting_room:
          type: boolean
          description: >-
            Whether a queue stands in front of this sale. Off on almost every night, and rightly: a
            room in front of a sale nobody is queueing for is a page between a buyer and their
            ticket for no reason. It guards the general sale — a presale is left alone.
        waiting_room_capacity:
          type: integer
          description: >-
            How many buyers may be choosing at once. Not how many seats there are: the room exists
            to keep a shop usable, and the two numbers have nothing to do with each other.
        waiting_room_minutes:
          type: integer
          description: "How long an admission lasts before the place is given away."
        hold_ttl_seconds: { type: integer }
        max_extends: { type: integer }
        max_seats_per_order:
          type: integer
          description: "How many places one basket may hold. On its own it stops nothing — see `max_per_buyer`."
        max_per_buyer:
          type: [integer, "null"]
          description: >-
            How many places one *person* may buy of this night, counted across everything that
            address already holds rather than per basket: four at a time, six times over, is
            twenty-four. Refunded tickets do not count — a limit that remembered a cancelled
            booking would tell somebody who gave their ticket back that they may not come at all.
            Null is no limit, which is the ordinary case.

            A person is an email address here, which is stated rather than implied: it is the only
            identity a ticket buyer has on this platform, and somebody determined can use a second
            one. This is the defence against the ordinary case, not against that.

            Checked before the money and never after it. A shop that registers its order before
            charging is held to the limit; one that sends no address until it confirms is not,
            because the only place left to refuse would be after the gateway settled — and one
            ticket over a limit is a smaller wrong than money taken for a booking that does not
            exist. The counter is exempt: the person is standing in front of the clerk.
        checkout_min_seconds:
          type: integer
          description: >-
            How long the hosted checkout form must have been on screen before it may be submitted.
            A person filling in a name and a card takes fifteen seconds; a script takes none. Zero,
            the default, asks nothing. Together with the hidden field the checkout form carries,
            this is the whole of the bot defence — no CAPTCHA, no third-party scoring, no cookie,
            and nothing that makes a blind buyer's evening worse than a sighted one's.
        refund_policy:
          type: string
          enum: [release, hold_back]
          description: "What the *seat* does on a refund: back on sale, or held out of it."
        refunds:
          type: string
          enum: [never, until, always]
          description: >-
            Whether a buyer may ask for their money back at all. `never` is the default because it
            is the answer an organiser has to opt out of.
        refund_window_hours:
          type: integer
          description: "How many hours before the doors, when `refunds` is `until`."
        refund_keeps_fee:
          type: boolean
          description: >-
            Whether the booking fee stays with the organiser. An organiser who paid to take the
            money does not get that back when they return it, and the buyer is told before they
            click rather than afterwards.
        exchanges:
          type: string
          enum: [never, until, always]
          description: >-
            Whether a buyer may move this booking to another night, in the same three words the
            refunds use. `never` is the default. An exchange is a refund taken as credit and spent
            in the same breath: the new seats are held first, and the old ones are only given back
            at the checkout.
        exchange_window_hours:
          type: integer
          description: "How many hours before the doors, when `exchanges` is `until`."
        exchange_fee_amount:
          type: integer
          description: >-
            Kept for the work of it, in minor units, and taken out of what the old seats are worth
            rather than charged separately — so moving from a €30 seat to a €30 seat with a €3 fee
            costs €3, not an invoice for €30 and a refund for €27.
        resale:
          type: boolean
          description: >-
            Whether a buyer may offer a seat they cannot use back to the public, at face value.
            While a listing is open the seat is offered without being taken away: the seller keeps
            it until somebody else actually pays.
        resale_pays:
          type: string
          enum: [credit, refund]
          description: >-
            How a seller is paid when their seat sells. `credit` by default, because a refund to a
            card charged eleven months ago fails often enough that promising it is dishonest.

    EventInput:
      type: object
      required: [name, venue_id, starts_at]
      properties:
        name: { type: string }
        image_url: { type: [string, "null"], format: uri, maxLength: 500, description: "Must be http or https." }
        category: { type: [string, "null"], maxLength: 40 }
        venue_id: { type: string, format: uuid }
        seat_map_id: { type: string, format: uuid }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        timezone: { type: string }
        currency: { type: string }
        status: { type: string, enum: [draft, published, closed, cancelled] }
        hold_ttl_seconds: { type: integer, minimum: 60, maximum: 3600 }
        max_extends: { type: integer, minimum: 0, maximum: 10 }
        refund_policy: { type: string, enum: [release, hold_back] }
        refunds: { type: string, enum: [never, until, always] }
        refund_window_hours: { type: integer, minimum: 0, maximum: 8760 }
        refund_keeps_fee: { type: boolean }
        exchanges: { type: string, enum: [never, until, always] }
        exchange_window_hours: { type: integer, minimum: 0, maximum: 8760 }
        exchange_fee_amount: { type: integer, minimum: 0 }
        resale: { type: boolean }
        resale_pays: { type: string, enum: [credit, refund] }


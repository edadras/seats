openapi: 3.1.0
info:
  title: Seatmap SaaS API
  version: "1.0.0"
  summary: Multi-tenant seating inventory, holds, allocations, ticketing and check-in.
  description: |
    The API owns venue seating inventory. It does **not** own carts, payments, tax or refunds —
    those stay in the tenant's own storefront (see `docs/adr/0001-saas-woocommerce-boundary.md`).

    ## Authentication
    Three separate schemes, deliberately not interchangeable:

    | Audience | Scheme | Notes |
    | --- | --- | --- |
    | Tenant panel / management API | `bearerAuth` (personal access token) | Scoped to the caller's tenant and role. |
    | Server-to-server (WordPress plugin) | `apiKeyAuth` + `hmacSignature` | All four `X-Seatmap-*` headers required. |
    | Embed widget (browser) | none | Public event id only; never carries a secret. |
    | Check-in device | `bearerAuth` (device token) | Scoped to named events. |

    ## HMAC signing
    `signature = hex(hmac_sha256(secret, METHOD + "\n" + PATH + "\n" + timestamp + "\n" + nonce + "\n" + hex(sha256(raw_body))))`

    `secret` is the value returned once when the key was created. The path is part of the signed
    string, so a captured signature cannot be redirected to another endpoint.

    Timestamps must be within ±300 s of server time; nonces may not repeat inside that window.
    Both conditions are enforced, so an accurate clock on the calling server is a requirement,
    not a nicety.

    ## Idempotency
    Every mutating endpoint accepts `Idempotency-Key`. The first request for a key is executed and
    its response stored; retries with the same key and the same body replay the stored response.
    A different body under the same key is rejected with `409 idempotency_key_reuse`.

    ## Errors
    All errors share one envelope with a stable machine-readable `code`.
servers:
  - url: https://api.seatmap.example/v1
    description: Production
  - url: http://localhost:8000/v1
    description: Local

tags:
  - name: Auth
  - name: Venues
  - name: Seat maps
  - name: Events
  - name: Embed
  - name: WooCommerce
  - name: Tickets
  - name: Orders
  - name: Discounts
  - name: Box office
  - name: Door
  - name: Waiting list
  - name: Customers
  - name: Notifications
  - name: Sites
  - name: Modules
  - name: Team
  - name: Audit
  - name: Check-in

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Exchange credentials for a personal access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string, default: api }
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  tenant: { $ref: "#/components/schemas/Tenant" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Revoke the current token
      responses:
        "204": { description: Revoked }

  /venues:
    get:
      operationId: listVenues
      tags: [Venues]
      summary: List venues
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Venue" }
    post:
      operationId: createVenue
      tags: [Venues]
      summary: Create a venue
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenueInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Venue" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /venues/{venue}:
    parameters: [ { $ref: "#/components/parameters/VenueId" } ]
    get:
      operationId: getVenue
      tags: [Venues]
      summary: Read a venue
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Venue" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateVenue
      tags: [Venues]
      summary: Update a venue
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenueInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Venue" }
    delete:
      operationId: deleteVenue
      tags: [Venues]
      summary: Delete a venue that has no events
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Conflict" }

  /seat-maps:
    get:
      operationId: listSeatMaps
      tags: [Seat maps]
      summary: List seat maps
      parameters:
        - name: venue_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/SeatMap" }
    post:
      operationId: createSeatMap
      tags: [Seat maps]
      summary: Create a seat map (starts with an empty draft version)
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [venue_id, name]
              properties:
                venue_id: { type: string, format: uuid }
                name: { type: string, maxLength: 160 }
                description: { type: [string, "null"] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeatMap" }

  /seat-maps/{map}:
    parameters: [ { $ref: "#/components/parameters/MapId" } ]
    get:
      operationId: getSeatMap
      tags: [Seat maps]
      summary: Read a seat map with its versions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeatMap" }
    patch:
      operationId: updateSeatMap
      tags: [Seat maps]
      summary: Rename a seat map
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: [string, "null"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeatMap" }

  /seat-maps/{map}/versions:
    parameters: [ { $ref: "#/components/parameters/MapId" } ]
    get:
      operationId: listSeatMapVersions
      tags: [Seat maps]
      summary: List versions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SeatMapVersion" }
    post:
      operationId: saveSeatMapDraft
      tags: [Seat maps]
      summary: Save the working draft geometry
      description: |
        Replaces the current draft's geometry. If the latest version is published, a new draft is
        forked from it. Published versions are immutable and are never modified by this call.
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [geometry]
              properties:
                geometry: { $ref: "#/components/schemas/Geometry" }
                notes: { type: [string, "null"] }
      responses:
        "201":
          description: Draft saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeatMapVersion" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /seat-maps/{map}/validate:
    parameters: [ { $ref: "#/components/parameters/MapId" } ]
    post:
      operationId: validateSeatMap
      tags: [Seat maps]
      summary: Validate geometry without saving
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [geometry]
              properties:
                geometry: { $ref: "#/components/schemas/Geometry" }
      responses:
        "200":
          description: Validation report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationReport" }

  /seat-maps/{map}/publish:
    parameters: [ { $ref: "#/components/parameters/MapId" } ]
    post:
      operationId: publishSeatMap
      tags: [Seat maps]
      summary: Publish the draft as an immutable version
      description: |
        Explodes geometry into normalised sections/rows/seats. Seat UUIDs are carried forward from
        the previous published version by `(section_key, row_key, seat_key)` so existing sales stay
        valid. Fails if validation reports errors, or if plan seat limits would be exceeded.
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeatMapVersion" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /events:
    get:
      operationId: listEvents
      tags: [Events]
      summary: List events
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: status
          in: query
          schema: { type: string, enum: [draft, published, closed, cancelled] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Event" }
    post:
      operationId: createEvent
      tags: [Events]
      summary: Create an event
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }

  /events/{event}:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: getEvent
      tags: [Events]
      summary: Read an event
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
    patch:
      operationId: updateEvent
      tags: [Events]
      summary: Update an event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }

  /events/{event}/repeat:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    post:
      operationId: repeatEvent
      tags: [Events]
      summary: Put the same production on again on other nights
      description: |
        Requires `events.manage`.

        A three-week run is twenty-one events, and it has to be: each night has its own hall, its
        own inventory and its own tickets, and pretending otherwise is how a seat sold on Tuesday
        turns up as sold on Wednesday. What nobody should type twenty-one times is the prices, the
        concessions and the two seats behind the pillar.

        So this copies everything that describes the *production* — price zones, ticket types,
        blocked seats and seat-level prices, the booking fee and the tax — and nothing that
        describes a *night*: no orders, no holds, no availability, and no note about a booking that
        has nothing to do with next Tuesday.

        The copies start as drafts. Being on sale is a decision somebody makes about a specific
        evening, not something that should happen by being copied.

        The original and its copies end up in one run, which is what lets a programme page show a
        three-week production as one card rather than as twenty-one identical ones. Repeating again
        joins the same run rather than starting a second.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dates]
              properties:
                dates:
                  type: array
                  minItems: 1
                  maxItems: 60
                  items: { type: string, format: date-time }
                series_name:
                  type: [string, "null"]
                  maxLength: 200
                  description: Only read the first time; afterwards the run already has a name.
      responses:
        "201":
          description: The nights created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The plan does not have room for that many events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /events/{event}/pricing:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    put:
      operationId: replaceEventPricing
      tags: [Events]
      summary: Replace price zones and seat overrides
      description: >
        Replaces the event's currency and its complete price list. Sending everything each time
        keeps the result unambiguous; partial edits across zones are where half a map ends up
        priced from last season.


        Seat overrides are replaced only when the `overrides` key is present. Omitting it leaves
        the existing overrides untouched — so a screen that edits prices and knows nothing about
        blocked seats cannot unblock them — while sending an empty array clears them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency, zones]
              properties:
                currency:
                  type: string
                  minLength: 3
                  maxLength: 3
                  pattern: "^[A-Za-z]{3}$"
                  description: >
                    ISO 4217 code, stored upper-case. Amounts everywhere are in this currency's
                    minor unit, which is not always hundredths: 500000 IRR is five hundred
                    thousand rials, and 1234 KWD is 1.234 dinars.
                  example: EUR
                zones:
                  type: array
                  items: { $ref: "#/components/schemas/PriceZone" }
                overrides:
                  type: array
                  description: Omit to leave existing overrides alone; send [] to clear them.
                  items: { $ref: "#/components/schemas/SeatOverride" }
                booking_fee_kind:
                  type: string
                  enum: [none, per_order, per_ticket]
                  description: Where the fixed part of the booking fee is applied.
                booking_fee_amount:
                  type: integer
                  minimum: 0
                  description: Minor units. Charged once per booking, or once per ticket.
                booking_fee_percent:
                  type: integer
                  minimum: 0
                  maximum: 100
                  description: Added on top of the fixed part, as a share of the ticket subtotal.
                booking_fee_label: { type: [string, "null"], maxLength: 60 }
                tax_rate:
                  type: integer
                  minimum: 0
                  maximum: 10000
                  description: >
                    Basis points, not per cent: 1900 is 19% and 875 is 8.75%. Rates with a fraction
                    are ordinary, and a whole-per-cent field is a field somebody rounds a tax rate
                    into.
                tax_included:
                  type: boolean
                  description: >
                    Whether the prices above already contain the tax. Most of Europe advertises
                    tax-inclusive prices and most of North America does not; getting it backwards
                    is a whole VAT rate of error in either direction, so it is asked rather than
                    assumed.
                tax_label: { type: [string, "null"], maxLength: 40 }
      responses:
        "200":
          description: Pricing replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }

  /events/{event}/ticket-types:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: listTicketTypes
      tags: [Events]
      summary: Who this event sells tickets to
      description: |
        Requires `events.view`. An empty list is an event that sells one kind of ticket, which is
        not a state to fix: nothing in the picker, the checkout or the ticket then mentions a type
        at all.

        `sold` counts tickets already issued at each type. It is the reason a row cannot be
        removed, said on the row rather than in an error afterwards.
      responses:
        "200":
          description: The types
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TicketType" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: replaceTicketTypes
      tags: [Events]
      summary: Replace the whole set of ticket types
      description: |
        Requires `pricing.manage`. Saved as a whole list, like the price zones it sits beside: a
        concession set is one decision about the event, and editing a row at a time is how an event
        ends up with a child rate from last season and a student rate from this one.

        A type is an adjustment to the seat's own price — `percent_off`, `amount_off`, or `fixed`
        for the flat rate that genuinely is one — so re-pricing a section re-prices every
        concession in it. `standard` is full price and ignores `value`.

        Exactly one type is the default whatever the caller sends: it is what a seat costs before
        the buyer chooses anything, and what an integration that has never heard of concessions
        sells at. A type that has sold a ticket cannot be left out of the list; hide it instead,
        or the order it paid for would describe a ticket nobody can explain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [types]
              properties:
                types:
                  type: array
                  maxItems: 20
                  items: { $ref: "#/components/schemas/TicketTypeWrite" }
      responses:
        "200":
          description: The types, as saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TicketType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A type that has been sold was left out of the list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/login:
    post:
      operationId: consoleLogin
      tags: [Console]
      summary: Sign in to the platform console
      security: []
      description: >
        A route of its own rather than a flag on the panel's login: the panel's asks which
        organiser somebody is a member of, and an operator is a member of none. One message for all
        three failures — no such user, wrong password, not an operator — so this cannot be used to
        find out who runs the platform. Signing in is itself recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Signed in, with a token that expires in four hours
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  level: { type: string, enum: [support, operator] }
                  name: { type: string }

  /admin/overview:
    get:
      operationId: consoleOverview
      tags: [Console]
      summary: The platform, in numbers
      description: >
        Takings are grouped by currency rather than added up. A platform serving Tehran and Berlin
        has no single number, and inventing one by summing rials into euros is worse than two rows.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenants: { type: object, additionalProperties: true }
                  sites: { type: object, additionalProperties: true }
                  selling: { type: object, additionalProperties: true }
                  takings_this_month:
                    type: array
                    items:
                      type: object
                      properties:
                        currency: { type: string }
                        total: { type: integer }
                        orders: { type: integer }

  /admin/tenants:
    get:
      operationId: consoleListTenants
      tags: [Console]
      summary: Every organiser on the platform
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, suspended, cancelled] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ConsoleTenant" }

  /admin/tenants/{tenant}:
    parameters:
      - name: tenant
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: consoleGetTenant
      tags: [Console]
      summary: One organiser, with its people and websites
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ConsoleTenant"
                  - type: object
                    properties:
                      members:
                        type: array
                        items: { type: object, additionalProperties: true }
                      websites:
                        type: array
                        items: { type: object, additionalProperties: true }
                      events: { type: integer }
                      tickets: { type: integer }
    patch:
      operationId: consoleUpdateTenant
      tags: [Console]
      summary: Suspend, reinstate, or move an organiser to another plan
      description: >
        An operator's power, not support's. Suspension is not a flag on a screen: the panel refuses
        the account and its websites stop serving.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [active, suspended, cancelled] }
                plan: { type: string }
                reason: { type: [string, 'null'], maxLength: 200 }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleTenant" }
        "403":
          description: A support account tried to change something
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/tenants/{tenant}/impersonate:
    parameters:
      - name: tenant
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: consoleImpersonate
      tags: [Console]
      summary: A token that acts as an organiser's owner, for an hour
      description: >
        Support needs to see what a customer sees; nobody should be able to do that quietly. The
        token expires by itself, and the fact is written to the platform's log *and* to the
        organiser's own audit log — it is their account that was entered.
      responses:
        "200":
          description: A time-boxed token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
                  as: { type: object, additionalProperties: true }
                  tenant: { type: object, additionalProperties: true }

  /admin/sites:
    get:
      operationId: consoleListSites
      tags: [Console]
      summary: Every website this platform serves
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }

  /admin/audit:
    get:
      operationId: consoleAudit
      tags: [Console]
      summary: What the people who run the platform did inside other people's accounts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }

  /admin/plans:
    get:
      operationId: consoleListPlans
      tags: [Console]
      summary: The tariffs, with how many organisers are on each
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ConsolePlan" }
                  limit_keys:
                    type: array
                    description: The limits the platform actually enforces.
                    items: { type: string }
    post:
      operationId: consoleCreatePlan
      tags: [Console]
      summary: Add a tariff
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsolePlan" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsolePlan" }

  /admin/plans/{plan}:
    parameters:
      - name: plan
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: consoleUpdatePlan
      tags: [Console]
      summary: Change a tariff
      description: >
        The key cannot be changed: a subscription points at it. Both the old and the new price are
        written to the operator log, because changing a price changes what existing subscribers pay
        at renewal.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsolePlan" }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsolePlan" }
    delete:
      operationId: consoleDeletePlan
      tags: [Console]
      summary: Delete a tariff nobody is on
      description: >
        A plan with subscribers is deactivated, not deleted — that takes it off the signup screen
        and leaves every organiser on it where they were.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        "409":
          description: Organisers are on it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /plans:
    get:
      operationId: listPlans
      tags: [Signup]
      summary: What somebody choosing a plan is choosing between
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        name: { type: string }
                        price_amount: { type: integer, description: In the currency's minor unit. }
                        currency: { type: string }
                        interval: { type: string, examples: [month, year] }
                        limits: { type: object, additionalProperties: true }

  /signup:
    post:
      operationId: signUp
      tags: [Signup]
      summary: Create an account
      security: []
      description: >
        One request makes the four things that have to exist before a venue can do anything: a
        person, an organiser, a subscription and a website. Four requests would be four ways to end
        up half signed up.


        The address is verified afterwards. An unverified account can build everything and cannot
        put a site on the public internet, which is the one thing an unverified address could be
        used to abuse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, organisation, email, password]
              properties:
                name: { type: string, maxLength: 120 }
                organisation: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
                locale: { type: string }
                timezone: { type: string }
                plan: { type: string }
      responses:
        "201":
          description: Created, with a token that already works
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  tenant: { type: object, additionalProperties: true }
                  role: { type: string }
                  site_id: { type: string, format: uuid }
                  email_verified: { type: boolean }
                  plan: { type: string }
        "409":
          description: That address already has an account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /signup/verify:
    post:
      operationId: verifyEmail
      tags: [Signup]
      summary: Type the code from the email
      security: []
      description: >
        Six digits, hashed at rest, good for a day, and capped at six attempts — the cap is what
        makes six digits not guessable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string }
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  email_verified: { type: boolean }
        "422":
          description: Wrong or expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /signup/resend:
    post:
      operationId: resendVerification
      tags: [Signup]
      summary: Send the code again
      security: []
      description: >
        Answers the same way whether or not the address has an account: this endpoint must not be
        usable to find out who has one, and it is throttled hard because it sends email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }

  /messaging/announcements:
    get:
      operationId: listAnnouncements
      tags: [Messaging]
      summary: What has been said to buyers, and how it went
      description: |
        Requires `messages.send` — writing to everybody who bought is a different act from
        configuring the platform, so a manager who runs the programme can do it without also being
        able to change the account's settings.

        `sent`, `failed` and `total` are counted from the deliveries themselves rather than kept on
        the announcement: there is one record of whether a message arrived, and it is the delivery
        log.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Announcement" }
                  channels:
                    type: array
                    items: { $ref: "#/components/schemas/MessageChannel" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: sendAnnouncement
      tags: [Messaging]
      summary: Say something to everybody who bought
      description: |
        The audience is resolved once, into queued deliveries, at the moment this is called —
        orders keep arriving while an announcement is going out, and re-resolving "everybody who
        bought" on each batch would send some people two copies and skip others.

        One message per person per channel, deduplicated by address: a buyer with four orders gets
        one email. Only orders where money actually arrived count. The first batch is sent inline,
        so a small announcement is finished by the time this responds; anything larger is finished
        by `messages:announce`, through the same code.

        `{buyer}`, `{event}` and `{site}` in the subject or body are substituted per recipient.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels, body]
              properties:
                event_id:
                  type: [string, "null"]
                  format: uuid
                  description: Buyers of one event. Omit for everybody who has bought.
                channels:
                  type: array
                  minItems: 1
                  items: { type: string }
                subject: { type: [string, "null"], maxLength: 200 }
                body: { type: string, maxLength: 2000 }
                locale: { type: string, maxLength: 12 }
      responses:
        "201":
          description: On its way
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Announcement" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /messaging/announcements/audience:
    get:
      operationId: announcementAudience
      tags: [Messaging]
      summary: How many people an announcement would reach
      description: >
        Counted without sending anything, so "everybody who bought" can be a number before it is a
        decision. `people` counts humans; `messages` counts what would actually be sent, which is
        higher when more than one channel is chosen and lower when people have no address for one.
      parameters:
        - name: event_id
          in: query
          schema: { type: string, format: uuid }
        - name: channels
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  people: { type: integer }
                  messages: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /notifications:
    get:
      operationId: listNotifications
      tags: [Notifications]
      summary: What the platform is telling this account
      description: |
        Refunds, messages a channel refused, announcements that finished, addresses that verified,
        nights that sold out. Each kind is governed by the permission that governs the thing it is
        about — a refund by `orders.view`, a failed message by `account.manage` — and that is
        applied on the way out rather than when the row was written, because roles change.

        `title` and `body` are composed here in the reader's own language from facts stored on the
        row. A notification stored as prose is a notification a colleague reads in a language they
        do not have.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
                  unread: { type: integer }

  /notifications/read:
    post:
      operationId: readNotifications
      tags: [Notifications]
      summary: Mark what this person can see as read
      description: >
        Everything currently visible to the caller, and nothing else: marking as read what somebody
        was never shown is how a notice disappears before anybody reads it. Read marks are per
        person — one colleague reading a notice does not read it for the rest of the account.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread: { type: integer }

  /messaging:
    get:
      operationId: getMessagingSettings
      tags: [Messaging]
      summary: What this account tells buyers, and on what
      description: >
        Every kind of message, the channels each goes out on, the languages available, and any
        wording the organiser has written. A kind with no template of its own uses the platform's,
        translated — so an account that has configured nothing still sends real messages.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  kinds:
                    type: array
                    items: { $ref: "#/components/schemas/MessageKind" }
                  channels:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, examples: [email, sms.kavenegar, telegram] }
                        name: { type: string }
                        address_kind: { type: string, enum: [email, phone, handle] }

  /messaging/log:
    get:
      operationId: listMessageDeliveries
      tags: [Messaging]
      summary: What was sent, and what happened to it
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [queued, sent, refused, unavailable] }
        - name: kind
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MessageDelivery" }

  /messaging/test:
    post:
      operationId: sendTestMessage
      tags: [Messaging]
      summary: Send the wording to somebody, with example values
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, channel, locale, to]
              properties:
                kind: { type: string }
                channel: { type: string }
                locale: { type: string }
                to: { type: string }
      responses:
        "200":
          description: Attempted — the status says whether it went
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [queued, sent, refused, unavailable] }
                  reason: { type: [string, 'null'] }
                  preview: { type: [string, 'null'] }

  /messaging/{kind}/channels/{channel}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string }
      - name: channel
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: setMessageChannel
      tags: [Messaging]
      summary: Turn a channel on or off for one kind of message
      description: >
        A buyer is entitled to be told their order was confirmed, so email cannot be switched off
        for the messages that are not optional. An organiser chooses how a buyer is told, not
        whether.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
        "422":
          description: That message cannot be switched off
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /messaging/{kind}/{channel}/{locale}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string }
      - name: channel
        in: path
        required: true
        schema: { type: string }
      - name: locale
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getMessageTemplate
      tags: [Messaging]
      summary: The wording that would be used right now
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageTemplate" }
    put:
      operationId: saveMessageTemplate
      tags: [Messaging]
      summary: Replace the wording
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                subject: { type: [string, 'null'], maxLength: 200 }
                body: { type: string, maxLength: 4000 }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
    delete:
      operationId: resetMessageTemplate
      tags: [Messaging]
      summary: Put the platform's wording back
      responses:
        "200":
          description: Reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  reset: { type: boolean }

  /reports/sources:
    get:
      operationId: listReportSources
      tags: [Reports]
      summary: The datasets you may build a report from
      description: >
        Each source declares its dimensions, measures and filters. The builder composes a query
        from identifiers the source declared — never from user text — which is why there is no
        query box and will not be one (ADR-0006). Only sources the caller's role may read are
        listed: `reports.orders.view` is not `reports.attendance.view`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ReportSource" }
                  max_rows: { type: integer }
                  max_export_rows: { type: integer }

  /reports/run:
    post:
      operationId: runReportDefinition
      tags: [Reports]
      summary: Run a definition that has not been saved
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, definition]
              properties:
                source: { type: string }
                definition: { $ref: "#/components/schemas/ReportDefinition" }
      responses:
        "200":
          description: Rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportResult" }
        "422":
          description: A field the source never declared, or nothing to measure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /reports:
    get:
      operationId: listReports
      tags: [Reports]
      summary: Saved report definitions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Report" }
    post:
      operationId: createReport
      tags: [Reports]
      summary: Save a definition
      description: The definition is validated against its source before it is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, source, definition]
              properties:
                name: { type: string, maxLength: 120 }
                source: { type: string }
                definition: { $ref: "#/components/schemas/ReportDefinition" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }

  /reports/{report}:
    parameters:
      - name: report
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getReport
      tags: [Reports]
      summary: One saved report
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
    patch:
      operationId: updateReport
      tags: [Reports]
      summary: Rename a report or change its definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                definition: { $ref: "#/components/schemas/ReportDefinition" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
    delete:
      operationId: deleteReport
      tags: [Reports]
      summary: Delete a saved report
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }

  /reports/{report}/run:
    parameters:
      - name: report
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: runReport
      tags: [Reports]
      summary: Run a saved report
      description: >
        Re-run on read, never a stored result — so a report cannot go stale and cannot become a
        copy of numbers that have since been corrected.
      responses:
        "200":
          description: Rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportResult" }

  /reports/{report}/export:
    parameters:
      - name: report
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: exportReport
      tags: [Reports]
      summary: The same definition, as a CSV
      description: >
        Streamed, with a higher row cap than the screen. The same runner and the same definition:
        two implementations of what a report means is how an export and its screen start
        disagreeing.
      responses:
        "200":
          description: A CSV file
          content:
            text/csv:
              schema: { type: string }

  /report-pages:
    get:
      operationId: listReportPages
      tags: [Reports]
      summary: Pages of report widgets
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ReportPage" }
    post:
      operationId: createReportPage
      tags: [Reports]
      summary: Create a page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                widgets:
                  type: array
                  items: { $ref: "#/components/schemas/ReportWidget" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportPage" }

  /report-pages/{page}:
    parameters:
      - name: page
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getReportPage
      tags: [Reports]
      summary: The page, with every widget already run
      description: >
        Each widget runs through its own report's source permission, so a page cannot become a way
        to see a report you may not read. A widget that is out of reach comes back with an `error`
        in place of its rows, so the rest of the page still renders.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  slug: { type: string }
                  widgets:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/ReportWidget"
                        - type: object
                          properties:
                            error: { type: string }
                            columns:
                              type: array
                              items: { $ref: "#/components/schemas/ReportColumn" }
                            rows:
                              type: array
                              items: { type: object, additionalProperties: true }
    patch:
      operationId: updateReportPage
      tags: [Reports]
      summary: Rename a page or rearrange its widgets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                widgets:
                  type: array
                  items: { $ref: "#/components/schemas/ReportWidget" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportPage" }
    delete:
      operationId: deleteReportPage
      tags: [Reports]
      summary: Delete a page
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }

  /themes:
    get:
      operationId: listCustomThemes
      tags: [Sites]
      summary: The themes available to this account
      description: >
        Ours, this account's own, and the token vocabulary the panel draws its controls from. A
        theme is tokens and a stylesheet, never code (ADR-0003), so nothing here can run.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CustomTheme" }
                  built_in:
                    type: array
                    items: { $ref: "#/components/schemas/SiteTheme" }
                  tokens:
                    type: array
                    description: Token definitions, including each choice's CSS value.
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        kind: { type: string, enum: [colour, choice] }
                        group: { type: string }
                        var: { type: string }
                        default: { type: string }
                  max_css_bytes: { type: integer }
    post:
      operationId: createSiteTheme
      tags: [Sites]
      summary: Start a theme from one of ours
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, base_key]
              properties:
                name: { type: string, maxLength: 80 }
                base_key:
                  type: string
                  description: The first-party theme to start from; its stylesheet stays linked.
                tokens: { type: object, additionalProperties: { type: string } }
                css: { type: [string, 'null'] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomTheme" }

  /themes/{theme}:
    parameters:
      - name: theme
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getSiteTheme
      tags: [Sites]
      summary: One theme, with its stylesheet and its history
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomTheme" }
    patch:
      operationId: updateSiteTheme
      tags: [Sites]
      summary: Change a theme
      description: >
        Every save keeps what it replaced, because a stylesheet is the one thing an organiser can
        change that breaks every page of a live site at once. `stylesheet_trimmed` says whether
        anything had to be taken out of the CSS — angle brackets, `@import`, `expression(` and the
        other ways a stylesheet was historically persuaded to run script.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                base_key: { type: string }
                tokens: { type: object, additionalProperties: { type: string } }
                css: { type: [string, 'null'] }
                note: { type: [string, 'null'], maxLength: 160 }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomTheme" }
    delete:
      operationId: deleteSiteTheme
      tags: [Sites]
      summary: Delete a theme nobody is wearing
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        "409":
          description: Some sites still wear it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /themes/{theme}/versions/{version}/revert:
    parameters:
      - name: theme
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: version
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: revertSiteTheme
      tags: [Sites]
      summary: Put a theme back the way it was
      responses:
        "200":
          description: Reverted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomTheme" }

  /events/{event}/seat-prices:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: listSeatPrices
      tags: [Events]
      summary: Every seat, with what it costs and why
      description: >
        The chart grouped by section and row — the way a hall is spoken about. Each seat carries
        the amount a buyer would be charged now, whether that amount is the seat's own or its
        zone's, and whether it is blocked or already sold.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  currency: { type: string }
                  zones:
                    type: array
                    items: { $ref: "#/components/schemas/PriceZone" }
                  sections:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        name: { type: string }
                        color: { type: [string, 'null'] }
                        rows:
                          type: array
                          items:
                            type: object
                            properties:
                              key: { type: string }
                              name: { type: string }
                              seats:
                                type: array
                                items: { $ref: "#/components/schemas/SeatPrice" }
    put:
      operationId: updateSeatPrices
      tags: [Events]
      summary: Price, move or block individual seats
      description: >
        Changes the seats named and leaves every other seat alone. A section called VIP is a name,
        not a price, so a seat may carry its own amount; the zone is what it falls back to.


        A seat with no amount, no zone of its own, not blocked and with nothing noted has its
        override deleted rather than stored as a row of nulls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seats]
              properties:
                seats:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items:
                    type: object
                    required: [seat_id, amount, zone_key]
                    properties:
                      seat_id: { type: string, format: uuid }
                      amount:
                        type: [integer, 'null']
                        minimum: 0
                        description: The seat's own price, in the event currency's minor unit.
                      zone_key:
                        type: [string, 'null']
                        description: >
                          Follow this price zone instead of the one the chart put the seat in.
                          Different from copying today's number onto the seat: the seat moves when
                          the zone is repriced.
                      blocked: { type: boolean }
                      note: { type: [string, 'null'], maxLength: 255 }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed: { type: integer }
                  cleared: { type: integer }
        "422":
          description: A seat is not in this event's map, or a zone does not exist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /events/{event}/stats:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: getEventStats
      tags: [Events]
      summary: Inventory, sales and check-in counters
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventStats" }

  /events/{event}/checkins:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: listEventCheckins
      tags: [Events]
      summary: Check-in log
      parameters:
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Checkin" }

  /embed/events/{public_id}:
    parameters: [ { $ref: "#/components/parameters/PublicId" } ]
    get:
      operationId: getEmbedEvent
      tags: [Embed]
      summary: Public event descriptor for the widget
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbedEvent" }
        "404": { $ref: "#/components/responses/NotFound" }

  /embed/events/{public_id}/seat-map:
    parameters: [ { $ref: "#/components/parameters/PublicId" } ]
    get:
      operationId: getEmbedSeatMap
      tags: [Embed]
      summary: Geometry of the event's published map version
      description: Cacheable and immutable; keyed by version id. Contains no availability data.
      security: []
      responses:
        "200":
          description: OK
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  seat_map_version_id: { type: string, format: uuid }
                  geometry: { $ref: "#/components/schemas/Geometry" }

  /embed/events/{public_id}/availability:
    parameters: [ { $ref: "#/components/parameters/PublicId" } ]
    get:
      operationId: getEmbedAvailability
      tags: [Embed]
      summary: Seat availability, optionally incremental
      security: []
      parameters:
        - name: since
          in: query
          description: Cursor from a previous response; returns only seats changed since then.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Availability" }

  /embed/events/{public_id}/holds:
    parameters: [ { $ref: "#/components/parameters/PublicId" } ]
    post:
      operationId: createHold
      tags: [Embed]
      summary: Hold seats for a bounded time
      security: []
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              description: At least one of `seat_ids` or `areas` must be present.
              properties:
                seat_ids:
                  type: array
                  maxItems: 20
                  items: { type: string, format: uuid }
                areas:
                  type: object
                  description: |
                    Standing room and whole tables, asked for by quantity: capacity object id to
                    number of places. Counted against the same per-order limit as named seats.
                  additionalProperties: { type: integer, minimum: 1 }
                seat_types:
                  type: object
                  description: |
                    Who each seat is for: seat id to ticket type id. Seats left out are sold at the
                    event's default type, so a caller that has never heard of concessions keeps
                    selling full-price tickets and does not have to be taught about them.

                    A type belonging to another event, or one that is hidden, is refused before any
                    seat is locked.
                  additionalProperties: { type: string, format: uuid }
                area_types:
                  type: object
                  description: |
                    The same for standing room, where a type is a share of an area's quantity:
                    capacity object id to (ticket type id to number of places). The server re-adds
                    the parts and checks the sum against what the area has left, so a request
                    cannot claim one number and mean another.
                  additionalProperties:
                    type: object
                    additionalProperties: { type: integer, minimum: 1 }
                session_id:
                  type: string
                  description: Opaque per-browser identifier, used for rate limiting and re-hold.
      responses:
        "201":
          description: Held
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Hold"
                  - type: object
                    properties:
                      cart_url:
                        type: [string, "null"]
                        description: |
                          Where to send the buyer to pay: the organiser's own hosted checkout,
                          carrying this hold's token and nothing else. It is null when the
                          organiser has no site on the internet yet — the seats are still held, and
                          a widget that has nowhere to send anybody says so rather than navigating
                          to nothing. A shop that made this hold has its own cart and ignores it.
        "409":
          description: One or more seats, or an area, are no longer available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeatUnavailableError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /embed/holds/{hold_token}:
    parameters: [ { $ref: "#/components/parameters/HoldToken" } ]
    delete:
      operationId: releaseHold
      tags: [Embed]
      summary: Release a hold
      security: []
      responses:
        "204": { description: Released }
        "404": { $ref: "#/components/responses/NotFound" }

  /embed/holds/{hold_token}/extend:
    parameters: [ { $ref: "#/components/parameters/HoldToken" } ]
    patch:
      operationId: extendHold
      tags: [Embed]
      summary: Extend a hold's TTL
      description: Bounded by `max_extends`; a hold cannot be extended after it has expired.
      security: []
      responses:
        "200":
          description: Extended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hold" }
        "409": { $ref: "#/components/responses/Conflict" }

  /embed/holds/{hold_token}/validate:
    parameters: [ { $ref: "#/components/parameters/HoldToken" } ]
    post:
      operationId: validateHold
      tags: [Embed]
      summary: Re-check a hold before an order is created
      security: []
      responses:
        "200":
          description: Hold state
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  reason:
                    type: [string, "null"]
                    enum: [expired, released, converted, unknown, null]
                  hold: { $ref: "#/components/schemas/Hold" }

  /integrations/woocommerce/orders:
    post:
      operationId: registerOrder
      tags: [WooCommerce]
      summary: Register a WooCommerce order against a hold
      security:
        - apiKeyAuth: []
          hmacSignature: []
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_order_id, hold_token]
              properties:
                external_order_id: { type: string, maxLength: 100 }
                hold_token: { type: string }
                buyer:
                  $ref: "#/components/schemas/Buyer"
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Already registered (idempotent replay)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalOrder" }
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalOrder" }
        "409": { $ref: "#/components/responses/Conflict" }

  /integrations/woocommerce/orders/{external_order_id}:
    parameters: [ { $ref: "#/components/parameters/ExternalOrderId" } ]
    get:
      operationId: getOrder
      tags: [WooCommerce]
      summary: Read the SaaS view of an order (used by reconciliation)
      security:
        - apiKeyAuth: []
          hmacSignature: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalOrder" }
        "404": { $ref: "#/components/responses/NotFound" }

  /integrations/woocommerce/orders/{external_order_id}/confirm:
    parameters: [ { $ref: "#/components/parameters/ExternalOrderId" } ]
    post:
      operationId: confirmOrder
      tags: [WooCommerce]
      summary: Convert the hold into allocations and issue tickets
      description: |
        Exactly-once. Retrying with the same `Idempotency-Key` — or simply calling again for an
        order already confirmed — returns the same allocations and tickets and creates nothing new.
      security:
        - apiKeyAuth: []
          hmacSignature: []
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                paid_at: { type: string, format: date-time }
                buyer: { $ref: "#/components/schemas/Buyer" }
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalOrder" }
        "409":
          description: Hold expired, or the order is in a state that cannot be confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /integrations/woocommerce/orders/{external_order_id}/cancel:
    parameters: [ { $ref: "#/components/parameters/ExternalOrderId" } ]
    post:
      operationId: cancelOrder
      tags: [WooCommerce]
      summary: Release the hold for a failed, cancelled or deleted order
      security:
        - apiKeyAuth: []
          hmacSignature: []
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, enum: [failed, cancelled, deleted, expired] }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalOrder" }

  /integrations/woocommerce/orders/{external_order_id}/refund:
    parameters: [ { $ref: "#/components/parameters/ExternalOrderId" } ]
    post:
      operationId: refundOrder
      tags: [WooCommerce]
      summary: Void tickets and apply the event's seat release policy
      security:
        - apiKeyAuth: []
          hmacSignature: []
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                seat_ids:
                  type: array
                  description: Omit for a full refund.
                  items: { type: string, format: uuid }
                reason: { type: string }
      responses:
        "200":
          description: Refunded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalOrder" }

  /tickets/{ticket}:
    parameters:
      - name: ticket
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getTicket
      tags: [Tickets]
      summary: Read a ticket
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "404": { $ref: "#/components/responses/NotFound" }

  /orders:
    get:
      operationId: listOrders
      tags: [Orders]
      summary: Every booking, however it was bought
      description: |
        The box office's own list. `q` searches the reference, the buyer's name and their email —
        the three things somebody at a window is holding.

        Requires `orders.view`. Refunding was reachable only over the signed integration API before
        this, which is the right answer for a shop that owns the money and no answer at all for an
        organiser selling from their own site.
      parameters:
        - name: event_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, cancelled, refunded, partially_refunded]
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PanelOrder" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /orders/{order}:
    parameters:
      - name: order
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getOrderFromPanel
      tags: [Orders]
      summary: One booking, with its seats and what the buyer was told
      description: >
        The seats and their tickets, and the delivery log for this order — because the question a
        box office is actually asked is "did they get it", and the answer is a row rather than an
        inference about whether a provider was up.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanelOrderDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /orders/{order}/refund:
    parameters:
      - name: order
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: refundOrderFromPanel
      tags: [Orders]
      summary: Refund all of a booking, or the seats named
      description: |
        Requires `orders.refund`. The seats go back on sale (or are held back, per the event's
        refund policy) and the tickets are voided.

        **This does not move money**, and does not pretend to: the organiser refunds where they
        took the payment. A platform that marked an order refunded while the card was never
        credited would be worse than one that says plainly which half it did.

        Omitting `seat_ids` refunds everything, which is also the only way to refund a standing
        place — those have no seat id to name.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                seat_ids:
                  type: array
                  items: { type: string, format: uuid }
                reason: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Refunded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanelOrder" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /orders/{order}/cancel:
    parameters:
      - name: order
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelOrderFromPanel
      tags: [Orders]
      summary: Cancel a booking nobody paid for
      description: >
        Requires `orders.refund`. Nothing was paid, so nothing is refunded: the held seats go back
        on sale. Calling it on an order that is already cancelled or refunded answers with its
        current state rather than failing.
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanelOrder" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /orders/{order}/resend:
    parameters:
      - name: order
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: resendOrderTickets
      tags: [Orders]
      summary: Send the buyer their tickets again
      description: |
        Requires `tickets.release`, because it necessarily kills the codes that were emailed — the
        platform keeps a hash of those and cannot hand them back — and that is the same power.

        Every ticket still `issued` gets a new code; used and voided ones are left alone. Audited
        as `order.tickets_resent`.
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: integer }
                  to: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /discounts:
    get:
      operationId: listDiscounts
      tags: [Discounts]
      summary: Every discount code this account has
      description: |
        Requires `discounts.manage`. `live` is computed, not stored: a code whose status says
        `active` but whose end date has passed takes nothing off anything, and reporting it as
        active is how an organiser spends an afternoon wondering why nobody can use it.
      parameters:
        - name: event_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [active, paused] }
        - name: q
          in: query
          description: Matches the code or its description.
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: The codes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/DiscountCode" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createDiscount
      tags: [Discounts]
      summary: Make a code
      description: |
        The code is normalised — trimmed and upper-cased — so `earlybird` and ` EarlyBird ` are one
        code and not three near-misses. A percentage above 100 and a fixed amount without a
        currency are both refused: the first is a payment to the buyer, the second would match
        every currency, and nothing in this system converts one currency into another.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscountCodeWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscountCode" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: An account already has a code with that name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /discounts/suggest:
    get:
      operationId: suggestDiscountCode
      tags: [Discounts]
      summary: A code nobody has to invent
      description: |
        Eight characters from an alphabet with no O and no I, checked against this account's
        existing codes. It is a suggestion, not a reservation: nothing is written.
      responses:
        "200":
          description: A free code
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }

  /discounts/{discount}:
    parameters:
      - name: discount
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getDiscount
      tags: [Discounts]
      summary: One code, and who has used it
      responses:
        "200":
          description: The code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscountCodeDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateDiscount
      tags: [Discounts]
      summary: Change a code, or pause it
      description: |
        `code` is ignored here. Renaming a code would break every poster it is printed on and leave
        its redemptions pointing at a name that never existed, so pausing is the way to stop one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscountCodeWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscountCode" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      operationId: deleteDiscount
      tags: [Discounts]
      summary: Delete a code that has never been used
      description: |
        A code that has paid for an order cannot be deleted — that order would be left at a price
        with no reason beside it. `discount_in_use` says so; pause it instead.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The code has been used
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /events/{event}/counter:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: getCounter
      tags: [Box office]
      summary: The hall as somebody at a window needs it
      description: |
        Requires `orders.sell`. Every seat in the published map, with what it costs and whether it
        can be sold right now. Seats already sold or in somebody's cart are returned too, marked as
        such: a clerk asked for "A5" needs to be told it has gone, not left to wonder why it is
        missing from a list.
      responses:
        "200":
          description: The hall
          content:
            application/json:
              schema:
                type: object
                properties:
                  currency: { type: string }
                  sections:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        name: { type: string }
                        rows:
                          type: array
                          items:
                            type: object
                            properties:
                              key: { type: string }
                              name: { type: string }
                              seats:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id: { type: string, format: uuid }
                                    label: { type: string }
                                    accessible: { type: boolean }
                                    state: { type: string }
                                    amount: { type: [integer, "null"] }
                  areas:
                    type: array
                    items: { type: object }
                  ticket_types:
                    type: array
                    items: { $ref: "#/components/schemas/TicketType" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /events/{event}/sell:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    post:
      operationId: sellAtCounter
      tags: [Box office]
      summary: Sell, reserve or give away seats at the window
      description: |
        Requires `orders.sell`.

        Not a second order path. The counter makes a hold through the same service — the same
        locking, the same price snapshot, the same refusal when somebody online got there first —
        and confirms it through the same order lifecycle, so a seat sold here is a seat sold, with
        a ticket, a QR code and a row in every report. What differs is only what is written down
        about the money.

        Held and confirmed in one step, because there is nobody to come back later: a window sale
        that left a hold behind would be a seat locked for ten minutes because the clerk was
        interrupted.

        `payment` says which of three things happened. `paid` means the money was taken elsewhere —
        cash, or the venue's own card terminal. `owed` means they will pay on the night, and the
        ticket is issued anyway because it is a reservation. `comp` means it is a gift and the
        order is worth nothing, because a report that counted free seats as revenue would overstate
        the evening by exactly the generosity of the house.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buyer, payment]
              properties:
                seat_ids:
                  type: array
                  items: { type: string, format: uuid }
                areas:
                  type: object
                  additionalProperties: { type: integer, minimum: 1 }
                seat_types:
                  type: object
                  additionalProperties: { type: string, format: uuid }
                area_types:
                  type: object
                  additionalProperties:
                    type: object
                    additionalProperties: { type: integer, minimum: 1 }
                buyer:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string, maxLength: 120 }
                    email: { type: [string, "null"], format: email }
                    phone: { type: [string, "null"] }
                payment: { type: string, enum: [paid, owed, comp] }
                note: { type: [string, "null"], maxLength: 200 }
                send_tickets:
                  type: boolean
                  description: Refused without an email address to send them to.
      responses:
        "201":
          description: Sold
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  reference: { type: string }
                  status: { type: string }
                  total_amount: { type: integer }
                  currency: { type: string }
                  payment: { type: string, enum: [paid, owed, comp] }
                  seats: { type: integer }
                  tickets_sent: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Somebody else took one of those seats first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /events/{event}/door-list:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: getDoorList
      tags: [Door]
      summary: Everybody expected tonight
      description: |
        Requires `checkins.view` and returns no money at all: the door needs names and seats, and a
        volunteer on the door does not need to know what the evening took.

        One row per ticket rather than per booking — a family of four arrives one at a time, and a
        list that could only tick off whole bookings would have somebody doing arithmetic at the
        door while a queue formed. Voided tickets are absent: somebody holding one is holding a
        ticket that was cancelled.

        `q` matches a name, an email, a booking reference or a seat like "Stalls A 5", because
        those are the four things somebody at a door is handed.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: state
          in: query
          description: "`out` for those not in yet, `in` for those already through."
          schema: { type: string, enum: [in, out] }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 10, maximum: 200, default: 50 }
      responses:
        "200":
          description: The list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DoorListRow" }
                  meta:
                    type: object
                    properties:
                      page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
                      last_page: { type: integer }
                      expected: { type: integer, description: "Tickets for tonight, whatever the filter." }
                      arrived: { type: integer }
                  event:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                      starts_at: { type: [string, "null"], format: date-time }
        "403": { $ref: "#/components/responses/Forbidden" }

  /events/{event}/door-list/export:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: exportDoorList
      tags: [Door]
      summary: The same list as a file
      description: |
        Requires `checkins.view`. Not paginated — a door list that stops at fifty is a door list
        that turns people away — and streamed in chunks, because a sold-out arena is twenty
        thousand rows and holding them in memory to write a file is how an export becomes an
        outage. The export is audited.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: state
          in: query
          schema: { type: string, enum: [in, out] }
      responses:
        "200":
          description: CSV, with a byte-order mark so a spreadsheet opens Persian headings as text
          content:
            text/csv:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }

  /events/{event}/waiting-list:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: getWaitingList
      tags: [Waiting list]
      summary: Who is waiting for a sold-out night
      description: |
        Requires `orders.view` — these are names and addresses of people who have bought nothing
        yet, which is customer data.

        `summary.free_places` is asked of the same code the site asks, so the number here and the
        number a buyer sees cannot disagree. `waiting_places` is what those people actually want,
        which is not the same as how many of them there are: eleven people wanting twenty-three
        places is the sentence an organiser is trying to form.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [waiting, notified, converted, left] }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 10, maximum: 200, default: 50 }
      responses:
        "200":
          description: The queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WaitingListEntry" }
                  meta:
                    type: object
                    properties:
                      page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
                      last_page: { type: integer }
                  summary:
                    type: object
                    properties:
                      waiting: { type: integer }
                      waiting_places: { type: integer }
                      notified: { type: integer }
                      left: { type: integer }
                      free_places: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

  /events/{event}/waiting-list/notify:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    post:
      operationId: notifyWaitingList
      tags: [Waiting list]
      summary: Tell the next people in line now
      description: |
        Requires `messages.send`, because it writes to people. For the organiser who has just
        released a block of house seats and does not want to wait for the scheduled round.

        Nobody is held a seat. The message says the sale is open again and it is first come first
        served — holding seats for somebody who may never open the email is how a sold-out night
        ends up half empty. Places already promised to somebody whose window is still open are
        subtracted first, so one returned seat is not offered to the whole queue at once.
      responses:
        "200":
          description: How many were told
          content:
            application/json:
              schema:
                type: object
                properties:
                  told: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: The account has no live website for the message to link to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /customers:
    get:
      operationId: listCustomers
      tags: [Customers]
      summary: Who has bought, and how much
      description: |
        Derived from the orders rather than from a customers table, so the list cannot drift from
        what was actually sold. A person is one email address, lowercased and trimmed; `id` is the
        SHA-256 of that address, because an email in a path is an email in an access log.

        Orders with no email address belong to nobody and are not listed. `meta.without_email`
        counts them, so a screen can say so instead of quietly disagreeing with the orders report.

        `spend` is every currency this person has paid in — there is no rate to add them with.
        `spend_in_currency` is the same figure in `meta.currency` alone, and it is what `sort=spend`
        orders by. Both count only orders where money arrived: confirmed and partly refunded.

        Requires `orders.view`.
      parameters:
        - name: q
          in: query
          description: Matches the buyer's name, email or phone, or the order reference.
          schema: { type: string, maxLength: 120 }
        - name: event_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, cancelled, refunded, partially_refunded]
        - name: currency
          in: query
          description: Which currency the sortable spend column is counted in.
          schema: { type: string, minLength: 3, maxLength: 3 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [recent, oldest, orders, spend, name]
            default: recent
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Customer" }
                  meta:
                    type: object
                    properties:
                      page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
                      last_page: { type: integer }
                      currency: { type: [string, "null"] }
                      currencies:
                        type: array
                        items: { type: string }
                      without_email: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /customers/export:
    get:
      operationId: exportCustomers
      tags: [Customers]
      summary: The customer list as a CSV
      description: |
        The same filters as the list, streamed as a file and capped at twenty thousand people.
        Audited as `customers.exported`: this is the one request that takes every buyer's address
        out of the platform at once, and who did that is a question an organiser may have to answer
        to somebody else.

        Requires `orders.view`.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: event_id
          in: query
          schema: { type: string, format: uuid }
        - name: currency
          in: query
          schema: { type: string, minLength: 3, maxLength: 3 }
      responses:
        "200":
          description: OK
          content:
            text/csv:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }

  /customers/{customer}:
    parameters:
      - name: customer
        in: path
        required: true
        description: The SHA-256 of the buyer's normalised email address.
        schema: { type: string, pattern: "^[0-9a-f]{64}$" }
    get:
      operationId: getCustomer
      tags: [Customers]
      summary: One buyer, and every order they placed
      description: |
        Their name, address and phone as of the most recent order that filled each one in, and up
        to five hundred orders with the seats or places on each. `checked_in` counts the allocations
        on that order whose ticket has been scanned.

        Requires `orders.view`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerProfile" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tickets:
    get:
      operationId: listTickets
      tags: [Tickets]
      summary: Every ticket for one event
      description: |
        The box-office lookup. `q` searches the holder's name, the buyer's name and email, the seat,
        the order reference and the *visible prefix* of the code.

        Searching by a whole ticket token is deliberately not offered: a token is a credential, and
        a search box that accepts one is a search box that logs one.
      parameters:
        - name: event_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: status
          in: query
          schema: { type: string, enum: [issued, used, void] }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Ticket" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /tickets/{ticket}/release:
    parameters:
      - $ref: "#/components/parameters/TicketId"
    post:
      operationId: releaseTicket
      tags: [Tickets]
      summary: Void a ticket and put its seat back on sale
      description: |
        Expressed as a partial refund of the order, because voiding the ticket and freeing the seat
        have to happen together.

        A ticket that has already been scanned cannot be released — the seat is occupied, and
        selling it again would send two people to one chair.
      responses:
        "200":
          description: Released
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "409":
          description: |
            `already_used` — someone has already come in on this ticket.
            `no_allocation` / `no_order` — the ticket is not attached to a seat or an order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /team:
    get:
      operationId: listTeam
      tags: [Team]
      summary: Who is in this account, who has been invited, and the roles available
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
                  invitations:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }
                  roles:
                    type: array
                    items: { $ref: "#/components/schemas/Role" }

  /team/members/{member}:
    parameters:
      - name: member
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateMember
      tags: [Team]
      summary: Change someone's role, or suspend and restore them
      description: |
        Two rules are enforced here and both exist because of a way an account can become unusable:

        - **Nobody changes their own membership.** Without it the permission system is advice —
          anyone with `team.manage` could hand themselves everything.
        - **An account keeps at least one owner who is not suspended.** Otherwise nobody can grant
          anything ever again, and the only way out is a support ticket and a database console.

        Suspension rather than deletion, so somebody who left keeps their name on what they did.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, description: A built-in role key or one this organiser invented. }
                suspended: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "403":
          description: "`cannot_change_own_role`, or the caller lacks `team.manage`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`last_owner`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /team/invitations:
    post:
      operationId: inviteMember
      tags: [Team]
      summary: Invite somebody to this account
      description: |
        The response carries `token` in plaintext **once**, so it can be put in an email or handed
        over in person. It is stored hashed and is never returned again: an invitation link is a way
        into an account, and a leaked database should not be a set of working ones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string }
      responses:
        "201":
          description: Invited
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Invitation"
                  - type: object
                    properties:
                      token:
                        type: string
                        description: Shown on this response and never again.
        "409":
          description: "`already_a_member`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /team/invitations/{invitation}:
    parameters:
      - name: invitation
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeInvitation
      tags: [Team]
      summary: Cancel an invitation
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }

  /roles:
    get:
      operationId: listRoles
      tags: [Team]
      summary: Every role, and the catalogue of permissions they are built from
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Role" }
                  permissions:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, examples: ["orders.view"] }
                        group: { type: string, examples: ["boxoffice"] }
                        label:
                          type: string
                          description: What somebody can *do*, translated — not what the code calls it.
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        label: { type: string }
    post:
      operationId: createRole
      tags: [Team]
      summary: Invent a role for a job this venue actually has
      description: |
        Permissions that are not in the catalogue are dropped rather than rejected, so a client
        sending a stale list still gets a working role. Reserved keys are refused outright: a
        custom role called `owner` holding five permissions would be the worst kind of surprise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, name, permissions]
              properties:
                key: { type: string, pattern: "^[a-z][a-z0-9_]*$" }
                name: { type: string, maxLength: 80 }
                permissions: { type: array, items: { type: string } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "409":
          description: "`role_exists`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`reserved_role`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /roles/{role}:
    parameters:
      - name: role
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateRole
      tags: [Team]
      summary: Rename a role or change what it holds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                permissions: { type: array, items: { type: string } }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
    delete:
      operationId: deleteRole
      tags: [Team]
      summary: Delete a role nobody holds
      description: Deleting a role somebody holds would leave them with nothing, silently.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        "409":
          description: "`role_in_use`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /overview:
    get:
      operationId: overview
      tags: [Audit]
      summary: What is selling, what is coming, and what changed
      description: |
        The panel's first screen, in one request: a screen that fanned out to six endpoints would
        settle in six stages.

        It is the only place where numbers governed by four different permissions meet, so each
        part is asked for separately rather than assembled and filtered afterwards. `money` is
        `null` without `reports.orders.view`, `door` without `checkins.view`, `activity` without
        `audit.view`, and `next[].gross_amount` follows `money`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }

  /audit:
    get:
      operationId: listAudit
      tags: [Audit]
      summary: Who changed what, when, and from where
      description: |
        Read-only, by construction. There is no endpoint that edits or deletes a row here and there
        will not be: an audit trail an administrator can edit is a diary, not a record.

        `changes` names the fields that moved and their before and after. Secrets never reach it —
        redaction walks the whole structure, including the `{from, to}` pair, because checking only
        the leaf would see two innocent words holding a credential.
      parameters:
        - { name: action, in: query, schema: { type: string }, description: Prefix match — `team.` finds every team action. }
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: subject_type, in: query, schema: { type: string } }
        - { name: subject_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AuditEntry" }

  /audit/facets:
    get:
      operationId: auditFacets
      tags: [Audit]
      summary: The actions and people present in this log, so filters offer real values
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions: { type: array, items: { type: string } }
                  actors:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        email: { type: string }

  /modules:
    get:
      operationId: listModules
      tags: [Modules]
      summary: Every module installed on this server, and whether this organiser has it on
      description: |
        Two different questions, and the response answers both. What is **installed** is a property
        of the deployment — an operator decides it by deploying. What is **enabled** is a property
        of this organiser.

        There is no install endpoint and there will not be one: an endpoint that changed which code
        runs would be a remote-code-execution feature (ADR-0004).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Module" }
                  points:
                    type: array
                    description: The extension points that exist. Adding one is a core change.
                    items: { type: string, enum: [payments, messaging, reports, blocks, themes, panel, events] }

  /modules/{key}:
    parameters:
      - $ref: "#/components/parameters/ModuleKey"
    get:
      operationId: getModule
      tags: [Modules]
      summary: One module, with its settings and its health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Module"
                  - type: object
                    properties:
                      health: { $ref: "#/components/schemas/ModuleHealth" }
        "404":
          description: "`module_not_installed` — not installed on this server."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      operationId: updateModule
      tags: [Modules]
      summary: Turn a module on or off, and save what it needs
      description: |
        One endpoint rather than three, because these are one decision: an organiser filling in an
        API key and switching a gateway on has done a single thing. Splitting it produces the state
        nobody wants — enabled and unconfigured, taking bookings it cannot settle.

        **Secrets.** A secret sent as the mask (`••••••••`) or as an empty string means "unchanged",
        so saving a form that displays a stored key does not wipe it. A secret is never returned;
        `values` reports the mask or null.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                settings:
                  type: object
                  additionalProperties: true
                  description: Keys the module's manifest declared. Anything else is ignored.
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Module"
                  - type: object
                    properties:
                      health: { $ref: "#/components/schemas/ModuleHealth" }
        "422":
          description: |
            `module_not_configured` — the module says it is missing something it needs, so it was
            left off rather than switched on and broken. `details.problems` says what.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`module_not_installed`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /site-themes:
    get:
      operationId: listSiteThemes
      tags: [Sites]
      summary: The themes, fonts, corner radii and block types a site can use
      description: |
        Everything the site editor needs to render its choices. The lists are closed: a theme key,
        font or block type that is not here is rejected on the way in.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  themes:
                    type: array
                    items: { $ref: "#/components/schemas/SiteTheme" }
                  fonts: { type: array, items: { type: string } }
                  radii: { type: array, items: { type: string } }
                  blocks:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string, enum: [heading, richText, image, buttons, eventList, eventDetail, faq, venueMap, divider, html] }
                        name: { type: string }
                        icon: { type: string }

  /sites:
    get:
      operationId: listSites
      tags: [Sites]
      summary: The organiser's hosted event sites
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Site" }
    post:
      operationId: createSite
      tags: [Sites]
      summary: Create a site
      description: |
        Creating a site provisions it: a home page, an event page, a "visiting us" page, a primary
        and a footer menu, and — if `SEATMAP_SITES_DOMAIN` is configured — a free subdomain, already
        verified. A new site is `draft` until a verified domain exists.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                theme_key: { type: string, maxLength: 40 }
                locale: { type: string, maxLength: 12 }
                timezone: { type: string }
                currency: { type: string, minLength: 3, maxLength: 3 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDetail" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /sites/{site}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      operationId: getSite
      tags: [Sites]
      summary: One site with its pages, menus and domains
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateSite
      tags: [Sites]
      summary: Rename, restyle, or publish a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                theme_key: { type: string, maxLength: 40 }
                locale: { type: string, maxLength: 12 }
                timezone: { type: string }
                currency: { type: string, minLength: 3, maxLength: 3 }
                status: { type: string, enum: [draft, live] }
                brand: { $ref: "#/components/schemas/SiteBrand" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDetail" }
        "409":
          description: "`no_verified_domain` — a site cannot go live with no address to visit."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`unknown_theme`, or an invalid field."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sites/{site}/pages:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      operationId: createSitePage
      tags: [Sites]
      summary: Add a page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, slug]
              properties:
                title: { type: string, maxLength: 160 }
                slug:
                  type: string
                  maxLength: 80
                  pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SitePage" }
        "409":
          description: "`slug_taken` — a page already uses that address."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`too_many_pages`, or an invalid slug."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sites/{site}/pages/{page}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/PageId"
    patch:
      operationId: updateSitePage
      tags: [Sites]
      summary: Edit a page's draft
      description: |
        Writes the draft only; the public site keeps showing the last published copy until
        `/publish` is called.

        Blocks are normalised here and nowhere else: unknown types are dropped, every string is
        length-capped, every URL is checked, and `html` blocks are refused unless the organiser has
        `allow_raw_html` turned on. Rendering re-validates nothing, so this is the boundary.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 160 }
                slug: { type: string, maxLength: 80 }
                blocks:
                  type: array
                  items: { $ref: "#/components/schemas/Block" }
                seo_title: { type: [string, "null"], maxLength: 160 }
                seo_description: { type: [string, "null"], maxLength: 320 }
                position: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SitePage" }
        "409":
          description: "`slug_taken`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`home_slug_fixed` — the home page lives at the root and cannot move."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteSitePage
      tags: [Sites]
      summary: Delete a page
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        "422":
          description: "`page_required` — the home and event pages are part of how the site works."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sites/{site}/pages/{page}/publish:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/PageId"
    post:
      operationId: publishSitePage
      tags: [Sites]
      summary: Copy the draft over the live page
      description: The same draft/published discipline the seat maps have — visitors never see a half-finished edit.
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SitePage" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sites/{site}/menus/{key}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - name: key
        in: path
        required: true
        schema: { type: string, examples: [primary, footer] }
    put:
      operationId: updateSiteMenu
      tags: [Sites]
      summary: Replace a menu's items
      description: |
        The whole menu is sent each time rather than diffed. A menu is short, and sending the
        intended order is the only version where two editors cannot interleave into a mess.

        Items pointing at a page or event that is not this tenant's are dropped, not rejected: a
        menu cannot be aimed at another organiser's event by guessing an id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 60
                  items:
                    type: object
                    required: [label, target_type]
                    properties:
                      label: { type: string, maxLength: 60 }
                      target_type: { type: string, enum: [page, event, url] }
                      site_page_id: { type: [string, "null"], format: uuid }
                      event_id: { type: [string, "null"], format: uuid }
                      url: { type: [string, "null"], maxLength: 400 }
                      new_tab: { type: boolean }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteMenu" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /sites/{site}/domains:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      operationId: addSiteDomain
      tags: [Sites]
      summary: Point a custom domain at the site
      description: |
        The hostname is claimed but not yet served. It becomes routable only once the TXT record in
        the response is published and verification passes — otherwise anyone could claim a hostname
        they do not own and receive its traffic.

        Uniqueness is checked across every tenant, because a hostname routes globally. The conflict
        never says who holds it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname]
              properties:
                hostname: { type: string, maxLength: 253, examples: ["tickets.northgate.example"] }
      responses:
        "201":
          description: Added, pending verification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDomain" }
        "409":
          description: "`hostname_taken`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`invalid_hostname`, or `too_many_domains`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sites/{site}/domains/{domain}/verify:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/DomainId"
    post:
      operationId: verifySiteDomain
      tags: [Sites]
      summary: Check the TXT record now
      description: Runs the DNS check immediately instead of waiting for the queued one. `last_error` says why a failure failed.
      responses:
        "200":
          description: Checked — read `verified`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDomain" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sites/{site}/domains/{domain}/primary:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/DomainId"
    post:
      operationId: makeSiteDomainPrimary
      tags: [Sites]
      summary: Make this the address the site calls its own
      description: The primary domain is what canonical URLs and ticket emails use. Every other verified domain still serves the site.
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDomain" }
        "409":
          description: "`domain_unverified`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sites/{site}/domains/{domain}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/DomainId"
    delete:
      operationId: deleteSiteDomain
      tags: [Sites]
      summary: Stop serving the site at this address
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        "409":
          description: "`primary_domain` — make another address the main one first."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /checkin/auth/token:
    post:
      operationId: pairCheckinDevice
      tags: [Check-in]
      summary: Exchange a device pairing code for a scoped scanner token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairing_code, device_name]
              properties:
                pairing_code: { type: string }
                device_name: { type: string }
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  device: { $ref: "#/components/schemas/CheckinDevice" }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/EmbedEvent" }

  /checkin/events:
    get:
      operationId: listCheckinEvents
      tags: [Check-in]
      summary: Events this device may scan
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EmbedEvent" }

  /checkin/scan:
    post:
      operationId: scanTicket
      tags: [Check-in]
      summary: Scan one QR token, atomically
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, event_id]
              properties:
                token: { type: string }
                event_id: { type: string, format: uuid }
                scanned_at: { type: string, format: date-time }
                client_scan_id: { type: string }
      responses:
        "200":
          description: Scan result — the HTTP status is 200 for every outcome; read `result`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanResult" }

  /checkin/sync:
    post:
      operationId: syncOfflineScans
      tags: [Check-in]
      summary: Upload a batch of offline scans
      description: |
        Idempotent per `(ticket, device, client_scan_id)`. Conflicts resolve to the earliest
        `scanned_at`; later scans of the same ticket come back as `already_used` with the winner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scans]
              properties:
                scans:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [token, event_id, scanned_at, client_scan_id]
                    properties:
                      token: { type: string }
                      event_id: { type: string, format: uuid }
                      scanned_at: { type: string, format: date-time }
                      client_scan_id: { type: string }
      responses:
        "200":
          description: Per-scan results in request order
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/ScanResult" }

  /checkin/events/{event}/stats:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: getCheckinStats
      tags: [Check-in]
      summary: Live door counters
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventStats" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Seatmap-Key
      description: Public key id of an API key. Never the secret.
    hmacSignature:
      type: apiKey
      in: header
      name: X-Seatmap-Signature
      description: |
        Requires `X-Seatmap-Timestamp` (unix seconds, ±300 s) and `X-Seatmap-Nonce`
        (unique within the window) alongside.

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 255 }
    VenueId:
      name: venue
      in: path
      required: true
      schema: { type: string, format: uuid }
    MapId:
      name: map
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventId:
      name: event
      in: path
      required: true
      schema: { type: string, format: uuid }
    PublicId:
      name: public_id
      in: path
      required: true
      schema: { type: string }
    HoldToken:
      name: hold_token
      in: path
      required: true
      schema: { type: string }
    ExternalOrderId:
      name: external_order_id
      in: path
      required: true
      schema: { type: string }
    TicketId:
      name: ticket
      in: path
      required: true
      schema: { type: string, format: uuid }
    SiteId:
      name: site
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageId:
      name: page
      in: path
      required: true
      schema: { type: string, format: uuid }
    DomainId:
      name: domain
      in: path
      required: true
      schema: { type: string, format: uuid }
    ModuleKey:
      name: key
      in: path
      required: true
      description: The module key with its slash written as a dot — `seatmap.offline-payments`. A slash inside a path segment is a fight with every router and proxy in between.
      schema: { type: string, pattern: "^[a-z0-9-]+\\.[a-z0-9-]+$" }

  responses:
    Forbidden:
      description: The caller's role does not carry the permission this needs
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found, or not visible to this tenant
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The request contradicts current state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Invalid payload
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable identifier.
              examples: [seat_unavailable, capacity_unavailable, hold_expired, invalid_signature, tenant_limit_reached]
            message: { type: string }
            details:
              type: object
              additionalProperties: true
            request_id: { type: string }

    SeatUnavailableError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            error:
              type: object
              properties:
                details:
                  type: object
                  properties:
                    unavailable_seat_ids:
                      type: array
                      items: { type: string, format: uuid }

    Paginated:
      type: object
      properties:
        data: { type: array, items: {} }
        meta:
          type: object
          properties:
            page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            last_page: { type: integer }

    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [active, suspended, cancelled] }
        timezone: { type: string }
        locale: { type: string }

    Venue:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: [string, "null"] }
        city: { type: [string, "null"] }
        country: { type: [string, "null"] }
        timezone: { type: string }
        created_at: { type: string, format: date-time }

    VenueInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 160 }
        address: { type: [string, "null"] }
        city: { type: [string, "null"] }
        country: { type: [string, "null"], maxLength: 2 }
        timezone: { type: string }

    SeatMap:
      type: object
      properties:
        id: { type: string, format: uuid }
        venue_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        published_version:
          oneOf:
            - $ref: "#/components/schemas/SeatMapVersion"
            - type: "null"
        draft_version:
          oneOf:
            - $ref: "#/components/schemas/SeatMapVersion"
            - type: "null"

    SeatMapVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
        seat_map_id: { type: string, format: uuid }
        version: { type: integer }
        status: { type: string, enum: [draft, published] }
        seat_count: { type: integer }
        published_at: { type: [string, "null"], format: date-time }
        geometry: { $ref: "#/components/schemas/Geometry" }

    Geometry:
      type: object
      description: |
        A chart: what a venue looks like. It says nothing about any event — whether a seat is free
        is derived per event from overrides, holds and allocations (ADR-0002).

        **A row does not store seat coordinates.** It stores an anchor, a rotation, a curve and a
        seat spacing, and positions follow from those. That is what makes "Number of seats",
        "Rotation", "Curve" and "Seat spacing" editable fields in the designer rather than
        read-outs. `curve` is the sagitta as a percentage of the row's chord, so the number means
        the same on a six-seat row and a sixty-seat one, and seats are spread evenly along the arc
        rather than by equal angle.

        **Keys are identity; labels are presentation.** Renumbering a row or renaming a section
        changes what is printed and never what a sold ticket points at.
      required: [version, floors]
      properties:
        version: { type: integer, const: 2 }
        name: { type: string }
        focalPoint:
          type: [object, "null"]
          description: The spot the venue faces, usually the middle of the stage. What "best available" sorts towards.
          properties:
            x: { type: number }
            y: { type: number }
        categories:
          type: array
          description: Price tiers. Every bookable object needs one before an event can be priced.
          items:
            type: object
            required: [key, label]
            properties:
              key: { type: string }
              label: { type: string }
              color: { type: string }
              accessible: { type: boolean, default: false }
        floors:
          type: array
          minItems: 1
          items:
            type: object
            required: [key, canvas, objects]
            properties:
              key: { type: string }
              name: { type: string }
              canvas:
                type: object
                properties:
                  width: { type: number, minimum: 100, maximum: 20000 }
                  height: { type: number, minimum: 100, maximum: 20000 }
                  background: { type: [string, "null"] }
              objects:
                type: array
                description: Ordered; the array order is the paint order.
                items: { $ref: "#/components/schemas/ChartObject" }

    ChartObject:
      type: object
      description: |
        One object on a floor, or inside a section. `type` decides which fields apply.

        `row`, `section`, `area`, `table` and `booth` carry bookable places. `shape`, `text`,
        `image` and `icon` are scenery and are placed on one of four layers.
      required: [type, key]
      properties:
        type:
          type: string
          enum: [row, section, area, table, booth, shape, text, image, icon]
        key:
          type: string
          description: Stable for the life of the map. Never reused — a sold seat points at it.
        layer:
          type: string
          enum: [surroundings, background, interactive, foreground]
          default: interactive
        categoryKey: { type: [string, "null"] }
        entrance: { type: [string, "null"] }
        labeling:
          type: object
          description: |
            How the object is labelled. `displayedLabel` overrides what a buyer sees; leave it null
            to show `label` itself. `locked` means the label comes from an automatic scheme.
          properties:
            enabled: { type: boolean }
            label: { type: string }
            displayedLabel: { type: [string, "null"] }
            position:
              type: string
              enum: [both, start, end, none]
              description: Which ends of a row show its label.
            displayedType: { type: string }
            visible: { type: boolean }
            fontSize: { type: number }
            positionX: { type: number }
            positionY: { type: number }
            locked: { type: boolean }
        x: { type: number, description: "row, table, text, icon: the anchor." }
        y: { type: number }
        rotation: { type: number }
        curve:
          type: number
          description: "row: the sagitta as a percentage of the chord. 0 is straight; the sign chooses the direction."
        seatSpacing:
          type: number
          description: "row: the gap between chairs, so the distance between centres is 18 + this."
        seats:
          type: array
          description: "row, table: the chairs, in order along the row or around the table."
          items:
            type: object
            required: [key, label]
            properties:
              key: { type: string }
              label: { type: string }
              type:
                type: string
                enum: [seat, empty]
                default: seat
                description: An `empty` placeholder holds a gap — a pillar, a camera position — without shifting the seats after it.
              categoryKey: { type: [string, "null"] }
              accessible: { type: boolean }
              entrance: { type: [string, "null"] }
              seat_id:
                type: [string, "null"]
                format: uuid
                description: |
                  Present on the embed seat-map response only. The stable id to send when holding
                  this seat, and the key to join availability on — never pair geometry with
                  availability by position.
        polygon:
          type: array
          description: "section: its outline. May be concave."
          items:
            type: array
            items: { type: number }
        objects:
          type: array
          description: "section: what is inside it."
          items: { $ref: "#/components/schemas/ChartObject" }
        shape:
          description: "area, booth: the drawn shape. On a table this is instead the word `round` or `rectangular`."
          oneOf:
            - type: string
              enum: [round, rectangular]
            - type: object
              properties:
                kind: { type: string, enum: [rect, ellipse, polygon] }
                x: { type: number }
                y: { type: number }
                width: { type: number }
                height: { type: number }
                rotation: { type: number }
                cornerRadius: { type: number }
                points:
                  type: [array, "null"]
                  items:
                    type: array
                    items: { type: number }
        capacity:
          type: object
          description: "area, booth: how many people it holds and whether they choose a spot."
          properties:
            type:
              type: string
              enum: [generalAdmission, fixed]
              description: General admission sells any quantity up to `places`; fixed sells the whole object at once.
            places: { type: integer, minimum: 1 }
        bookAs:
          type: string
          enum: [seat, table]
          description: "table: whether a buyer takes one chair or the whole table."
        capacity_object_id:
          type: [string, "null"]
          format: uuid
          description: Present on the embed seat-map response only, for areas, booths and whole tables.
        width: { type: number }
        height: { type: number }
        translucent: { type: boolean }
        scale: { type: number }
        kind: { type: string, description: "shape: stage, aisle, wall, entrance, exit, rect, ellipse, polygon or line." }
        fill: { type: [string, "null"] }
        label: { type: [string, "null"] }
        text: { type: string, description: "text: the words." }
        fontSize: { type: number }
        color: { type: [string, "null"] }
        href: { type: string, description: "image: usually a scanned floor plan being traced over." }
        opacity: { type: number }
        name: { type: string, description: "icon: wheelchair, toilets, bar, food, entrance, exit, stairs or lift." }
        size: { type: number }

    ValidationReport:
      type: object
      properties:
        valid:
          type: boolean
          description: False when there are errors. Warnings never make a chart invalid.
        seat_count:
          type: integer
          description: Named seats only — what the plan limit measures.
        places:
          type: integer
          description: Everything sellable, so seats plus the capacity of every area, booth and whole table.
        checks:
          type: array
          description: The checklist shown in the designer's chart panel.
          items:
            type: object
            properties:
              code:
                type: string
                enum: [no_duplicate_objects, all_labeled, all_categorized, one_category_per_type, focal_point]
              label: { type: string }
              ok: { type: boolean }
        errors:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }
              path: { type: string }
        warnings:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }
              path: { type: string }

    Announcement:
      type: object
      properties:
        id: { type: string, format: uuid }
        audience: { type: string, enum: [event, everyone] }
        event: { type: [string, "null"] }
        channels:
          type: array
          items: { type: string }
        subject: { type: [string, "null"] }
        body: { type: string }
        status: { type: string, enum: [draft, sending, sent] }
        recipients: { type: integer, description: "People, not messages." }
        sent: { type: integer }
        failed: { type: integer }
        total: { type: integer, description: Messages queued for it in all. }
        created_at: { type: string, format: date-time }

    MessageChannel:
      type: object
      properties:
        key: { type: string }
        name: { type: string }
        address_kind: { type: string, enum: [email, phone, handle] }

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        level: { type: string, enum: [info, warn, danger] }
        title: { type: string }
        body: { type: string }
        subject: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        read: { type: boolean }

    PanelOrder:
      type: object
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        status: { type: string, enum: [pending, confirmed, cancelled, refunded, partially_refunded] }
        currency: { type: string }
        total_amount: { type: integer }
        placed_at: { type: string, format: date-time }
        buyer_name: { type: [string, "null"] }
        buyer_email: { type: [string, "null"] }
        seats: { type: integer, description: "Places still held on this order." }
        event:
          type: [object, "null"]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            starts_at: { type: string, format: date-time }

    PanelOrderDetail:
      allOf:
        - $ref: "#/components/schemas/PanelOrder"
        - type: object
          properties:
            buyer:
              type: object
              properties:
                name: { type: [string, "null"] }
                email: { type: [string, "null"] }
                phone: { type: [string, "null"] }
            channel: { type: [string, "null"], description: "The shop or site it was sold through." }
            confirmed_at: { type: [string, "null"], format: date-time }
            cancelled_at: { type: [string, "null"], format: date-time }
            refunded_at: { type: [string, "null"], format: date-time }
            can_resend: { type: boolean }
            lines:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  seat_id: { type: [string, "null"], format: uuid }
                  section: { type: [string, "null"] }
                  row: { type: [string, "null"] }
                  seat: { type: [string, "null"] }
                  quantity: { type: integer }
                  amount: { type: integer }
                  status: { type: string, enum: [active, released, void] }
                  ticket_status: { type: [string, "null"], enum: [issued, used, void, null] }
                  used_at: { type: [string, "null"], format: date-time }
            messages:
              type: array
              items:
                type: object
                properties:
                  kind: { type: string }
                  channel: { type: string }
                  recipient: { type: string }
                  status: { type: string }
                  reason: { type: [string, "null"] }
                  created_at: { type: string, format: date-time }

    DiscountCode:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        description: { type: [string, "null"] }
        event_id: { type: [string, "null"], format: uuid }
        event_name: { type: [string, "null"] }
        kind: { type: string, enum: [percent, fixed] }
        value:
          type: integer
          description: "Per cent for `percent`; minor units for `fixed`."
        currency: { type: [string, "null"], description: "Set for `fixed` only." }
        starts_at: { type: [string, "null"], format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        max_uses: { type: [integer, "null"] }
        used_count: { type: integer }
        min_seats: { type: integer }
        status: { type: string, enum: [active, paused] }
        live:
          type: boolean
          description: "Switched on, started, not finished and not used up — computed, not stored."
        created_at: { type: string, format: date-time }

    DiscountCodeWrite:
      type: object
      properties:
        code: { type: string, maxLength: 40, description: "Create only; ignored on update." }
        description: { type: [string, "null"], maxLength: 160 }
        event_id: { type: [string, "null"], format: uuid, description: "Null means every event." }
        kind: { type: string, enum: [percent, fixed] }
        value: { type: integer, minimum: 1 }
        currency: { type: [string, "null"], minLength: 3, maxLength: 3 }
        starts_at: { type: [string, "null"], format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        max_uses: { type: [integer, "null"], minimum: 1 }
        min_seats: { type: [integer, "null"], minimum: 1 }
        status: { type: string, enum: [active, paused] }

    DiscountCodeDetail:
      allOf:
        - $ref: "#/components/schemas/DiscountCode"
        - type: object
          properties:
            redemptions:
              type: array
              description: The fifty most recent uses.
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  amount: { type: integer }
                  currency: { type: string }
                  at: { type: string, format: date-time }
                  order_id: { type: [string, "null"] }
                  order_status: { type: [string, "null"] }
                  buyer: { type: [string, "null"] }

    TicketType:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        kind: { type: string, enum: [standard, percent_off, amount_off, fixed] }
        value:
          type: integer
          description: "Per cent for `percent_off`; minor units for `amount_off` and `fixed`; ignored for `standard`."
        is_default: { type: boolean }
        min_per_order: { type: integer }
        max_per_order: { type: [integer, "null"] }
        proof_note:
          type: [string, "null"]
          description: "What the buyer must bring. Shown when they choose it and printed on the ticket."
        position: { type: integer }
        status: { type: string, enum: [active, hidden] }
        sold: { type: integer, description: "Tickets already issued at this type." }

    TicketTypeWrite:
      type: object
      required: [name, kind]
      properties:
        id:
          type: [string, "null"]
          format: uuid
          description: "Present to update an existing type; absent to create one."
        name: { type: string, maxLength: 80 }
        description: { type: [string, "null"], maxLength: 200 }
        kind: { type: string, enum: [standard, percent_off, amount_off, fixed] }
        value: { type: [integer, "null"], minimum: 0 }
        is_default: { type: boolean }
        min_per_order: { type: [integer, "null"], minimum: 0 }
        max_per_order: { type: [integer, "null"], minimum: 1 }
        proof_note: { type: [string, "null"], maxLength: 160 }
        status: { type: string, enum: [active, hidden] }

    DoorListRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        name:
          type: string
          description: >
            The name on the ticket where there is one — which is how a transferred ticket reads —
            and the buyer's otherwise. A door asks for a name and does not care which of the two
            it is.
        buyer_name: { type: string }
        email: { type: string }
        reference: { type: string }
        seat: { type: string }
        quantity: { type: integer, description: "More than one only for standing places." }
        ticket_type: { type: [string, "null"] }
        code: { type: string, description: "The ticket code's visible prefix, for reading aloud." }
        arrived: { type: boolean }
        arrived_at: { type: [string, "null"], format: date-time }

    WaitingListEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        phone: { type: [string, "null"] }
        quantity: { type: integer, description: "How many places they want." }
        status: { type: string, enum: [waiting, notified, converted, left] }
        joined_at: { type: string, format: date-time }
        notified_at: { type: [string, "null"], format: date-time }
        claiming:
          type: boolean
          description: >
            Told, and their window has not run out. "Notified" alone would be a half-truth an hour
            later, and an organiser deciding whether to release more seats needs to know which of
            the two it is.

    Money:
      type: object
      properties:
        currency: { type: string }
        amount: { type: integer, description: Minor units. }

    Customer:
      type: object
      properties:
        id: { type: string, description: SHA-256 of the normalised email. }
        name: { type: [string, "null"] }
        email: { type: string }
        phone: { type: [string, "null"] }
        orders_count: { type: integer }
        confirmed_count: { type: integer }
        events_count: { type: integer }
        seats_count: { type: integer }
        first_order_at: { type: string, format: date-time }
        last_order_at: { type: string, format: date-time }
        spend:
          type: array
          items: { $ref: "#/components/schemas/Money" }
        spend_in_currency:
          type: integer
          description: The same spend in `meta.currency` alone, in minor units.

    CustomerProfile:
      type: object
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        email: { type: string }
        phone: { type: [string, "null"] }
        orders_count: { type: integer }
        confirmed_count: { type: integer }
        events_count: { type: integer }
        seats_count: { type: integer }
        first_order_at: { type: string, format: date-time }
        last_order_at: { type: string, format: date-time }
        spend:
          type: array
          items: { $ref: "#/components/schemas/Money" }
        orders:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              reference: { type: string }
              status: { type: string }
              currency: { type: string }
              total_amount: { type: integer }
              placed_at: { type: string, format: date-time }
              checked_in: { type: integer }
              event:
                type: [object, "null"]
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  starts_at: { type: string, format: date-time }
              lines:
                type: array
                items:
                  type: object
                  properties:
                    section: { type: [string, "null"] }
                    row: { type: [string, "null"] }
                    seat:
                      type: [string, "null"]
                      description: Null for a standing place, which has a quantity instead.
                    quantity: { type: integer }
                    amount: { type: integer }
                    currency: { type: string }
                    status: { type: string }
                    used_at: { type: [string, "null"], format: date-time }

    Overview:
      type: object
      properties:
        events:
          type: object
          properties:
            on_sale: { type: integer }
            draft: { type: integer }
        seats:
          type: object
          properties:
            sold_this_month: { type: integer }
        money:
          type: [object, "null"]
          description: "Null unless the caller holds reports.orders.view."
          properties:
            this_month:
              type: array
              items:
                type: object
                properties:
                  currency: { type: string }
                  gross_amount: { type: integer }
        door:
          type: [object, "null"]
          description: "Null unless the caller holds checkins.view."
          properties:
            issued: { type: integer }
            checked_in: { type: integer }
            rate: { type: number }
        sites:
          type: object
          properties:
            live: { type: integer }
        next:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              public_id: { type: string }
              name: { type: string }
              starts_at: { type: [string, "null"], format: date-time }
              timezone: { type: string }
              venue: { type: [string, "null"] }
              seats_total: { type: integer }
              allocated: { type: integer }
              available: { type: integer }
              sold_ratio: { type: number }
              gross_amount: { type: [integer, "null"] }
              currency: { type: string }
        activity:
          type: [array, "null"]
          description: "Null unless the caller holds audit.view."
          items:
            type: object
            properties:
              action: { type: string }
              subject_label: { type: [string, "null"] }
              actor:
                type: object
                properties:
                  type: { type: string }
                  name: { type: [string, "null"] }
              created_at: { type: [string, "null"], format: date-time }

    Event:
      type: object
      properties:
        id: { type: string, format: uuid }
        public_id: { type: string }
        name: { type: string }
        image_url: { type: [string, "null"], format: uri, description: "The event's poster, shown on the hosted site and in listings." }
        category: { type: [string, "null"], description: "One word for the kind of evening this is — Concert, Theatre, Sport." }
        status: { type: string, enum: [draft, published, closed, cancelled] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        timezone: { type: string }
        currency: { type: string }
        currency_decimals:
          type: integer
          description: >
            Decimal places that currency has. Sent because the picker formats money in the browser,
            and a table of currency exponents copied into JavaScript is one that goes out of date
            somewhere nobody is looking.
        venue_id: { type: string, format: uuid }
        seat_map_version_id: { type: [string, "null"], format: uuid }
        hold_ttl_seconds: { type: integer }
        max_extends: { type: integer }
        refund_policy: { type: string, enum: [release, hold_back] }

    EventInput:
      type: object
      required: [name, venue_id, starts_at]
      properties:
        name: { type: string }
        image_url: { type: [string, "null"], format: uri, maxLength: 500, description: "Must be http or https." }
        category: { type: [string, "null"], maxLength: 40 }
        venue_id: { type: string, format: uuid }
        seat_map_id: { type: string, format: uuid }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        timezone: { type: string }
        currency: { type: string }
        status: { type: string, enum: [draft, published, closed, cancelled] }
        hold_ttl_seconds: { type: integer, minimum: 60, maximum: 3600 }
        max_extends: { type: integer, minimum: 0, maximum: 10 }
        refund_policy: { type: string, enum: [release, hold_back] }

    CustomTheme:
      type: object
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        base_key: { type: string }
        own_tokens:
          type: object
          description: Only what this theme overrides.
          additionalProperties: { type: string }
        tokens:
          type: object
          description: The resolved set — the base theme's, with this one's on top.
          additionalProperties: { type: string }
        token_css: { type: string }
        css: { type: string }
        css_bytes: { type: integer }
        sites_count: { type: integer }
        stylesheet_trimmed:
          type: boolean
          description: Present on a save that had to take something out of the stylesheet.
        versions:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              version: { type: integer }
              note: { type: [string, 'null'] }
              author: { type: [string, 'null'] }
              created_at: { type: string, format: date-time }

    SeatPrice:
      type: object
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        accessible: { type: boolean }
        zone_key: { type: [string, 'null'] }
        chart_zone_key:
          type: [string, 'null']
          description: The zone the published chart put this seat in.
        amount:
          type: [integer, 'null']
          description: What a buyer would be charged now, however that came about.
        own_amount:
          type: [integer, 'null']
          description: Set only when this seat carries its own price rather than its zone's.
        blocked: { type: boolean }
        note: { type: [string, 'null'] }
        sold:
          type: boolean
          description: >
            A sold seat keeps the price it was sold at; repricing it changes what the next buyer
            pays.

    PriceZone:
      type: object
      required: [key, name, amount]
      properties:
        key: { type: string }
        name: { type: string }
        amount:
          type: integer
          description: Minor units (e.g. cents) — never a float.
        color: { type: [string, "null"] }

    SeatOverride:
      type: object
      required: [seat_id]
      properties:
        seat_id: { type: string, format: uuid }
        blocked: { type: boolean, default: false }
        amount: { type: [integer, "null"] }
        zone_key: { type: [string, "null"] }
        note: { type: [string, "null"] }

    EmbedEvent:
      type: object
      properties:
        public_id: { type: string }
        name: { type: string }
        starts_at: { type: string, format: date-time }
        timezone: { type: string }
        currency: { type: string }
        status: { type: string }
        venue: { type: object, properties: { name: { type: string }, city: { type: string } } }
        seat_map_version_id: { type: string, format: uuid }
        hold_ttl_seconds: { type: integer }
        zones:
          type: array
          items: { $ref: "#/components/schemas/PriceZone" }

    Availability:
      type: object
      properties:
        cursor:
          type: string
          description: Pass back as `since` to receive only subsequent changes.
        full: { type: boolean, description: True when the payload is a complete snapshot. }
        seats:
          type: array
          items:
            type: object
            properties:
              seat_id: { type: string, format: uuid }
              state: { type: string, enum: [available, held, allocated, blocked] }
              amount: { type: [integer, "null"] }
              zone_key: { type: [string, "null"] }

    Hold:
      type: object
      properties:
        hold_token: { type: string }
        event_public_id: { type: string }
        expires_at: { type: string, format: date-time }
        extends_used: { type: integer }
        max_extends: { type: integer }
        currency: { type: string }
        total_amount: { type: integer }
        seat_map_version_id: { type: string, format: uuid }
        seats:
          type: array
          items:
            type: object
            properties:
              seat_id: { type: string, format: uuid }
              section: { type: string }
              row: { type: string }
              label: { type: string }
              amount: { type: integer }
              zone_key: { type: [string, "null"] }
        price_snapshot:
          type: object
          description: The signed payload the storefront must price the cart from.
          properties:
            payload: { type: string, description: Base64url of the canonical JSON. }
            signature: { type: string, description: HMAC-SHA256 hex over `payload`. }
            algorithm: { type: string, const: HMAC-SHA256 }

    Buyer:
      type: object
      properties:
        name: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"] }
        locale: { type: [string, "null"] }

    ExternalOrder:
      type: object
      properties:
        external_order_id: { type: string }
        status: { type: string, enum: [pending, confirmed, cancelled, refunded, partially_refunded] }
        event_public_id: { type: string }
        hold_token: { type: [string, "null"] }
        currency: { type: string }
        total_amount: { type: integer }
        confirmed_at: { type: [string, "null"], format: date-time }
        allocations:
          type: array
          items: { $ref: "#/components/schemas/Allocation" }
        tickets:
          type: array
          items: { $ref: "#/components/schemas/IssuedTicket" }

    Allocation:
      type: object
      properties:
        id: { type: string, format: uuid }
        seat_id: { type: string, format: uuid }
        section: { type: string }
        row: { type: string }
        label: { type: string }
        amount: { type: integer }
        status: { type: string, enum: [active, released, void] }

    Ticket:
      type: object
      description: |
        A ticket as the panel and the scanner see it.

        Note what is absent: the QR token. It is handed to the storefront once, on the response
        that issued it, and never readable again — so a panel session cannot be used to harvest
        working tickets. `token_prefix` is the short visible fragment printed on the ticket, which
        is what staff read out at a box office.
      properties:
        id: { type: string, format: uuid }
        allocation_id: { type: [string, "null"], format: uuid }
        event_id: { type: string, format: uuid }
        status: { type: string, enum: [issued, used, void] }
        holder_name: { type: [string, "null"] }
        token_prefix: { type: [string, "null"] }
        seat:
          type: object
          properties:
            section: { type: [string, "null"] }
            row: { type: [string, "null"] }
            label: { type: [string, "null"] }
            quantity: { type: [integer, "null"] }
        order:
          type: [object, "null"]
          properties:
            reference: { type: string }
            status: { type: string }
            buyer_name: { type: [string, "null"] }
            buyer_email: { type: [string, "null"] }
        issued_at: { type: [string, "null"], format: date-time }
        used_at: { type: [string, "null"], format: date-time }

    IssuedTicket:
      description: |
        The shape returned inside an order. `token` is present on exactly one response — the one
        that confirmed the order and issued the ticket — because the storefront needs it to draw
        the QR in the customer's email. Every later read of the same order omits it.
      type: object
      properties:
        id: { type: string, format: uuid }
        allocation_id: { type: string, format: uuid }
        status: { type: string, enum: [issued, used, void] }
        token: { type: string }
        seat:
          type: object
          properties:
            section: { type: string }
            row: { type: string }
            label: { type: string }
        issued_at: { type: string, format: date-time }
        used_at: { type: [string, "null"], format: date-time }

    ScannedTicket:
      description: What a scanner is told about the ticket it just read — enough to admit or refuse a person, and nothing else.
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [issued, used, void] }
        holder_name: { type: [string, "null"] }
        seat:
          type: object
          properties:
            section: { type: [string, "null"] }
            row: { type: [string, "null"] }
            label: { type: [string, "null"] }

    Member:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        role: { type: string }
        role_name: { type: string, description: Translated for built-in roles; the organiser's own wording otherwise. }
        suspended: { type: boolean }
        last_seen_at: { type: [string, "null"], format: date-time }

    Invitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string }
        invited_by: { type: [string, "null"] }
        expires_at: { type: string, format: date-time }
        expired: { type: boolean }

    Role:
      type: object
      properties:
        id:
          type: [string, "null"]
          format: uuid
          description: Null for a built-in role, which is code rather than a row.
        key: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        built_in: { type: boolean }
        permissions:
          type: array
          items: { type: string }

    AuditEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        action: { type: string, examples: ["event.updated"] }
        actor:
          type: object
          properties:
            type: { type: string, enum: [user, api_key, device, system] }
            id: { type: [string, "null"] }
            name:
              type: [string, "null"]
              description: Present for a person. An API key or a device has no name in `users`; `type` says which it was.
        subject:
          type: object
          properties:
            type: { type: [string, "null"] }
            id: { type: [string, "null"] }
            label:
              type: [string, "null"]
              description: Something a person can recognise, because a page of UUIDs is a page nobody reads.
        changes:
          type: [object, "null"]
          description: Field name to `{from, to}`, taken from what the database was actually told.
          additionalProperties: true
        context:
          type: [object, "null"]
          additionalProperties: true
        ip: { type: [string, "null"] }
        request_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    Module:
      type: object
      description: |
        A module as this organiser sees it. `enabled` is their answer; the module existing at all is
        the operator's.
      properties:
        key: { type: string, examples: ["seatmap/offline-payments"] }
        vendor: { type: string }
        version: { type: string }
        first_party: { type: boolean }
        name:
          type: string
          description: Already translated into the reader's language.
        description: { type: string }
        extends:
          type: array
          items: { type: string, enum: [payments, messaging, reports, blocks, themes, panel, events] }
        enabled: { type: boolean }
        auto_enabled:
          type: boolean
          description: On because it needs no configuration and this organiser has never said otherwise.
        disabled_reason:
          type: [string, "null"]
          description: Set when the platform switched it off itself, e.g. `repeated_failures`.
        settings:
          type: array
          items: { $ref: "#/components/schemas/ModuleSetting" }
        values:
          type: object
          additionalProperties: true
          description: |
            Current values. A secret is reported as the mask when set and null when not — never as
            itself. A gateway secret readable from a panel session is a gateway secret a stolen
            session has.

    ModuleSetting:
      type: object
      properties:
        key: { type: string }
        type: { type: string, enum: [string, secret, boolean, integer, url, select] }
        required: { type: boolean }
        label: { type: string }
        hint: { type: [string, "null"] }
        options:
          type: array
          description: Present for `select` only.
          items: { type: string }
        default: {}

    ModuleHealth:
      type: object
      description: |
        What has gone wrong lately. A module that throws is caught and skipped so a request survives;
        this is where that stops being silent.
      properties:
        failures: { type: integer }
        last_failure_at: { type: [string, "null"], format: date-time }
        last_message: { type: [string, "null"] }

    ConsoleTenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [active, suspended, cancelled] }
        locale: { type: string }
        timezone: { type: string }
        created_at: { type: string, format: date-time }
        plan: { type: [string, 'null'] }
        plan_name: { type: [string, 'null'] }
        subscription_status: { type: [string, 'null'] }
        people:
          type: integer
          description: How many — not who. The list of them is `members`.
        sites:
          type: integer
          description: How many — not which. The list of them is `websites`.

    ConsolePlan:
      type: object
      properties:
        id: { type: string, format: uuid }
        key:
          type: string
          description: Set once. A subscription points at it, so renaming would detach both.
        name: { type: string }
        price_amount: { type: integer, description: In the currency's minor unit. }
        currency: { type: string }
        interval: { type: string, enum: [month, year] }
        limits:
          type: object
          description: Only the keys the platform enforces; null means no limit.
          additionalProperties: { type: [integer, 'null'] }
        is_active: { type: boolean }
        subscribers: { type: integer }

    MessageKind:
      type: object
      properties:
        key: { type: string, examples: [order.confirmed, order.cancelled, event.reminder] }
        name: { type: string }
        description: { type: string }
        placeholders:
          type: array
          description: What a template may substitute. Anything else renders as itself.
          items: { type: string }
        optional:
          type: boolean
          description: False for messages a buyer is entitled to.
        channels:
          type: array
          items: { type: string }

    MessageTemplate:
      type: object
      properties:
        kind: { type: string }
        channel: { type: string }
        locale: { type: string }
        subject: { type: string }
        body: { type: string }
        is_default:
          type: boolean
          description: True when this is the platform's wording rather than the organiser's.
        placeholders:
          type: array
          items: { type: string }

    MessageDelivery:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        channel: { type: string }
        recipient: { type: string }
        status:
          type: string
          enum: [queued, sent, refused, unavailable]
          description: >
            `refused` is the provider saying no to this message and is never retried; `unavailable`
            is the provider being unreachable and always is.
        reason: { type: [string, 'null'] }
        preview: { type: [string, 'null'] }
        attempts: { type: integer }
        created_at: { type: string, format: date-time }

    ReportSource:
      type: object
      properties:
        key: { type: string, examples: [orders, seats_sold, tickets, checkins, events] }
        name: { type: string }
        description: { type: string }
        permission:
          type: string
          description: What a reader needs. A report inherits it, so sharing cannot widen it.
        dimensions:
          type: array
          items: { $ref: "#/components/schemas/ReportField" }
        measures:
          type: array
          items: { $ref: "#/components/schemas/ReportField" }
        filters:
          type: array
          items: { $ref: "#/components/schemas/ReportField" }

    ReportField:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        type: { type: string, examples: [string, date, datetime, number, boolean, enum, event] }
        aggregate: { type: string, examples: [count, count_distinct, sum, avg, min, max] }
        format: { type: string, examples: [money, number] }
        options:
          type: array
          items: { type: string }

    ReportDefinition:
      type: object
      description: >
        Field *keys*, never expressions. Anything not declared by the source is refused before a
        query is built.
      properties:
        dimensions:
          type: array
          items: { type: string }
        measures:
          type: array
          items: { type: string }
        filters:
          type: object
          additionalProperties: true
        sort:
          type: object
          properties:
            key:
              type: string
              description: A column alias — d0 for the first dimension, m0 for the first measure.
            direction: { type: string, enum: [asc, desc] }
        limit: { type: integer, minimum: 1 }

    ReportColumn:
      type: object
      properties:
        alias: { type: string, examples: [d0, m0] }
        key: { type: string }
        kind: { type: string, enum: [dimension, measure] }
        type: { type: string }
        format: { type: string }
        label: { type: string }

    ReportResult:
      type: object
      properties:
        columns:
          type: array
          items: { $ref: "#/components/schemas/ReportColumn" }
        rows:
          type: array
          description: Keyed by column alias.
          items: { type: object, additionalProperties: true }
        truncated:
          type: boolean
          description: There were more rows than the cap. Export for the rest.
        limit: { type: integer }

    Report:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        source: { type: string }
        definition: { $ref: "#/components/schemas/ReportDefinition" }
        author: { type: [string, 'null'] }
        updated_at: { type: string, format: date-time }

    ReportWidget:
      type: object
      description: >
        A card on a report page. Every type but `note` names a saved report and is run when the page
        is read; a `note` is the organiser's own words, carries `text` instead of `report_id`, and is
        stored as plain text because it is rendered inside the panel.
      properties:
        type: { type: string, enum: [table, bar, line, stat, note] }
        report_id: { type: string, format: uuid }
        title: { type: [string, 'null'] }
        text: { type: string, maxLength: 2000 }
        width: { type: string, enum: [third, half, full] }

    ReportPage:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        widgets:
          type: array
          items: { $ref: "#/components/schemas/ReportWidget" }
        updated_at: { type: string, format: date-time }

    SiteTheme:
      type: object
      properties:
        key: { type: string, examples: [aurora, noir, playbill, marquee, atrium, kiosk] }
        name: { type: string }
        description: { type: string }
        tokens:
          type: object
          description: The theme's resolved token set.
          additionalProperties: { type: string }

    SiteBrand:
      description: |
        The organiser's own look, inside bounds. Colours, fonts, radii and logo URLs are validated
        on the way in — a brand is a set of choices from closed lists, not arbitrary CSS, because
        this renders on a domain we serve.
      type: object
      properties:
        accent: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        heading_font: { type: string }
        body_font: { type: string }
        radius: { type: string }
        logo_url: { type: string, format: uri }
        tagline: { type: string, maxLength: 160 }
        gateways:
          type: array
          description: Payment drivers the storefront offers. Defaults to `offline` — pay at the box office.
          items: { type: string }

    Site:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        theme_key: { type: string }
        locale: { type: string }
        timezone: { type: string }
        currency: { type: string }
        brand: { $ref: "#/components/schemas/SiteBrand" }
        status: { type: string, enum: [draft, live] }
        url:
          type: [string, "null"]
          description: Canonical address, or null while no domain is verified.
        domains:
          type: array
          items: { $ref: "#/components/schemas/SiteDomain" }

    SiteDetail:
      allOf:
        - $ref: "#/components/schemas/Site"
        - type: object
          properties:
            pages:
              type: array
              items: { $ref: "#/components/schemas/SitePage" }
            menus:
              type: array
              items: { $ref: "#/components/schemas/SiteMenu" }

    SitePage:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        kind:
          type: string
          enum: [home, page, event]
          description: "`home` and `event` are structural: the site needs them, so they cannot be deleted and home cannot move off the root."
        path: { type: string }
        blocks:
          type: array
          description: The draft. What visitors see is the published copy, which this response does not carry.
          items: { $ref: "#/components/schemas/Block" }
        seo_title: { type: [string, "null"] }
        seo_description: { type: [string, "null"] }
        position: { type: integer }
        published_at: { type: [string, "null"], format: date-time }
        has_unpublished_changes: { type: boolean }

    Block:
      type: object
      description: |
        One piece of a page. `type` decides which other properties are meaningful; everything else
        is dropped on the way in, so a stored block only ever holds fields its type defines.
      required: [type]
      properties:
        id:
          type: string
          description: Stable across edits, so reordering one block does not break an anchor to another.
        type:
          type: string
          enum: [heading, richText, image, buttons, eventList, eventDetail, faq, venueMap, divider, html]
      additionalProperties: true

    SiteMenu:
      type: object
      properties:
        key: { type: string, examples: [primary, footer] }
        name: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              label: { type: string }
              target_type: { type: string, enum: [page, event, url] }
              site_page_id: { type: [string, "null"], format: uuid }
              event_id: { type: [string, "null"], format: uuid }
              url: { type: [string, "null"] }
              new_tab: { type: boolean }

    SiteDomain:
      type: object
      properties:
        id: { type: string, format: uuid }
        hostname: { type: string }
        is_primary: { type: boolean }
        verified:
          type: boolean
          description: Until this is true the hostname is claimed but not served.
        verified_at: { type: [string, "null"], format: date-time }
        last_checked_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        record:
          type: object
          description: The DNS record to publish before verification can pass.
          properties:
            type: { type: string, examples: [TXT] }
            name: { type: string }
            value: { type: string }

    CheckinDevice:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        event_ids:
          type: array
          items: { type: string, format: uuid }

    Checkin:
      type: object
      properties:
        id: { type: string, format: uuid }
        ticket_id: { type: string, format: uuid }
        result: { type: string }
        scanned_at: { type: string, format: date-time }
        device: { type: [string, "null"] }
        operator: { type: [string, "null"] }

    ScanResult:
      type: object
      required: [result]
      properties:
        result:
          type: string
          enum: [valid, already_used, cancelled, refunded, wrong_event, invalid]
        ticket:
          oneOf:
            - $ref: "#/components/schemas/ScannedTicket"
            - type: "null"
        first_scan:
          type: [object, "null"]
          description: Present when `result` is `already_used` — who admitted this ticket, and when.
          properties:
            scanned_at: { type: string, format: date-time }
            device: { type: [string, "null"] }
            operator: { type: [string, "null"] }

    EventStats:
      type: object
      properties:
        seats_total: { type: integer }
        available: { type: integer }
        held: { type: integer }
        allocated: { type: integer }
        blocked: { type: integer }
        gross_amount: { type: integer, description: "Indicative, from price snapshots." }
        currency: { type: string }
        checked_in: { type: integer }
        checkin_rate: { type: number }

openapi: 3.1.0
info:
  title: Seatmap SaaS API
  version: "1.0.0"
  summary: Multi-tenant seating inventory, holds, allocations, ticketing and check-in.
  description: |
    The API owns venue seating inventory. It does **not** own carts, payments, tax or refunds —
    those stay in the tenant's own storefront (see `docs/adr/0001-saas-woocommerce-boundary.md`).

    ## Authentication
    Three separate schemes, deliberately not interchangeable:

    | Audience | Scheme | Notes |
    | --- | --- | --- |
    | Tenant panel / management API | `bearerAuth` (personal access token) | Scoped to the caller's tenant and role. |
    | Server-to-server (WordPress plugin) | `apiKeyAuth` + `hmacSignature` | All four `X-Seatmap-*` headers required. |
    | Embed widget (browser) | none | Public event id only; never carries a secret. |
    | Check-in device | `bearerAuth` (device token) | Scoped to named events. |

    ## HMAC signing
    `signature = hex(hmac_sha256(secret, METHOD + "\n" + PATH + "\n" + timestamp + "\n" + nonce + "\n" + hex(sha256(raw_body))))`

    `secret` is the value returned once when the key was created. The path is part of the signed
    string, so a captured signature cannot be redirected to another endpoint.

    Timestamps must be within ±300 s of server time; nonces may not repeat inside that window.
    Both conditions are enforced, so an accurate clock on the calling server is a requirement,
    not a nicety.

    ## Idempotency
    Every mutating endpoint accepts `Idempotency-Key`. The first request for a key is executed and
    its response stored; retries with the same key and the same body replay the stored response.
    A different body under the same key is rejected with `409 idempotency_key_reuse`.

    ## Errors
    All errors share one envelope with a stable machine-readable `code`.
servers:
  - url: https://api.seatmap.example/v1
    description: Production
  - url: http://localhost:8000/v1
    description: Local

tags:
  - name: Auth
  - name: Security
  - name: Venues
  - name: Seat maps
  - name: Events
  - name: Embed
  - name: WooCommerce
  - name: Tickets
  - name: Wallet
  - name: Orders
  - name: Discounts
  - name: Access
  - name: Vouchers
  - name: Seasons
  - name: Baskets
  - name: Box office
  - name: Door
  - name: Waiting list
  - name: Settlement
  - name: Customers
  - name: Notifications
  - name: Sites
  - name: Modules
  - name: Connections
  - name: Localisation
  - name: Team
  - name: Audit
  - name: Check-in

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Exchange credentials for a personal access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string, default: api }
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  tenant: { $ref: "#/components/schemas/Tenant" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Revoke the current token
      responses:
        "204": { description: Revoked }

  /venues:
    get:
      operationId: listVenues
      tags: [Venues]
      summary: List venues
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Venue" }
    post:
      operationId: createVenue
      tags: [Venues]
      summary: Create a venue
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenueInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Venue" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /venues/{venue}:
    parameters: [ { $ref: "#/components/parameters/VenueId" } ]
    get:
      operationId: getVenue
      tags: [Venues]
      summary: Read a venue
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Venue" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateVenue
      tags: [Venues]
      summary: Update a venue
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenueInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Venue" }
    delete:
      operationId: deleteVenue
      tags: [Venues]
      summary: Delete a venue that has no events
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Conflict" }

  /seat-maps:
    get:
      operationId: listSeatMaps
      tags: [Seat maps]
      summary: List seat maps
      parameters:
        - name: venue_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/SeatMap" }
    post:
      operationId: createSeatMap
      tags: [Seat maps]
      summary: Create a seat map (starts with an empty draft version)
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [venue_id, name]
              properties:
                venue_id: { type: string, format: uuid }
                name: { type: string, maxLength: 160 }
                description: { type: [string, "null"] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeatMap" }

  /seat-maps/{map}:
    parameters: [ { $ref: "#/components/parameters/MapId" } ]
    get:
      operationId: getSeatMap
      tags: [Seat maps]
      summary: Read a seat map with its versions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeatMap" }
    patch:
      operationId: updateSeatMap
      tags: [Seat maps]
      summary: Rename a seat map
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: [string, "null"] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeatMap" }

  /seat-maps/{map}/versions:
    parameters: [ { $ref: "#/components/parameters/MapId" } ]
    get:
      operationId: listSeatMapVersions
      tags: [Seat maps]
      summary: List versions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SeatMapVersion" }
    post:
      operationId: saveSeatMapDraft
      tags: [Seat maps]
      summary: Save the working draft geometry
      description: |
        Replaces the current draft's geometry. If the latest version is published, a new draft is
        forked from it. Published versions are immutable and are never modified by this call.
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [geometry]
              properties:
                geometry: { $ref: "#/components/schemas/Geometry" }
                notes: { type: [string, "null"] }
      responses:
        "201":
          description: Draft saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeatMapVersion" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /seat-maps/{map}/validate:
    parameters: [ { $ref: "#/components/parameters/MapId" } ]
    post:
      operationId: validateSeatMap
      tags: [Seat maps]
      summary: Validate geometry without saving
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [geometry]
              properties:
                geometry: { $ref: "#/components/schemas/Geometry" }
      responses:
        "200":
          description: Validation report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationReport" }

  /seat-maps/{map}/publish:
    parameters: [ { $ref: "#/components/parameters/MapId" } ]
    post:
      operationId: publishSeatMap
      tags: [Seat maps]
      summary: Publish the draft as an immutable version
      description: |
        Explodes geometry into normalised sections/rows/seats. Seat UUIDs are carried forward from
        the previous published version by `(section_key, row_key, seat_key)` so existing sales stay
        valid. Fails if validation reports errors, or if plan seat limits would be exceeded.
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeatMapVersion" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /events:
    get:
      operationId: listEvents
      tags: [Events]
      summary: List events
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: status
          in: query
          schema: { type: string, enum: [draft, published, closed, cancelled] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Event" }
    post:
      operationId: createEvent
      tags: [Events]
      summary: Create an event
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }

  /events/{event}:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: getEvent
      tags: [Events]
      summary: Read an event
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
    patch:
      operationId: updateEvent
      tags: [Events]
      summary: Update an event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }

  /events/{event}/repeat:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    post:
      operationId: repeatEvent
      tags: [Events]
      summary: Put the same production on again on other nights
      description: |
        Requires `events.manage`.

        A three-week run is twenty-one events, and it has to be: each night has its own hall, its
        own inventory and its own tickets, and pretending otherwise is how a seat sold on Tuesday
        turns up as sold on Wednesday. What nobody should type twenty-one times is the prices, the
        concessions and the two seats behind the pillar.

        So this copies everything that describes the *production* — price zones, ticket types,
        blocked seats and seat-level prices, the booking fee and the tax — and nothing that
        describes a *night*: no orders, no holds, no availability, and no note about a booking that
        has nothing to do with next Tuesday.

        The copies start as drafts. Being on sale is a decision somebody makes about a specific
        evening, not something that should happen by being copied.

        The original and its copies end up in one run, which is what lets a programme page show a
        three-week production as one card rather than as twenty-one identical ones. Repeating again
        joins the same run rather than starting a second.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dates]
              properties:
                dates:
                  type: array
                  minItems: 1
                  maxItems: 60
                  items: { type: string, format: date-time }
                series_name:
                  type: [string, "null"]
                  maxLength: 200
                  description: Only read the first time; afterwards the run already has a name.
      responses:
        "201":
          description: The nights created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The plan does not have room for that many events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /orders/{order}/receipts:
    parameters:
      - { name: order, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: printOrderTickets
      tags: [Orders]
      summary: The whole booking, as a box office prints it
      description: >
        Behind `orders.sell` rather than a viewing permission, because printing re-mints the code:
        a stored ticket cannot reproduce its QR — the database keeps a hash, and nothing recovers
        the code from a hash — so the only honest answer is a new one, which necessarily stops any
        earlier copy working. At a counter that is exactly right, and it is the wrong thing for
        somebody who may only look at a booking to do by accident.


        Two representations of one list of lines. The default is JSON, which a panel lays out and
        prints through the browser and the operating system's own driver — the only way to print a
        Persian event name on hardware bought in Berlin. `format=escpos` is the byte stream a roll
        printer understands, for a local print agent to send straight at it.


        Refuses with `ticket_not_printable` when the booking has no live seat left to print.
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [json, escpos], default: json }
        - name: width
          in: query
          description: Roll width in millimetres. The two anybody buys.
          schema: { type: integer, enum: [58, 80], default: 80 }
        - name: cut
          in: query
          description: >
            Whether to cut between tickets. Only meaningful for `escpos`. Two seats left on one
            strip of paper is two people sharing a ticket at the door, so the default is to cut.
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: The tickets, as lines or as bytes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketReceipts" }
            application/octet-stream:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /allocations/{allocation}/receipt:
    parameters:
      - { name: allocation, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: printSeatTicket
      tags: [Orders]
      summary: One seat again, for the person who left theirs on the bus
      description: >
        The same as printing the booking, for a single seat. It re-mints that seat's code and no
        other, so the rest of a family's tickets keep working while the lost one stops.
      security: [ { bearerAuth: [] } ]
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [json, escpos], default: json }
        - name: width
          in: query
          schema: { type: integer, enum: [58, 80], default: 80 }
        - name: cut
          in: query
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: The ticket, as lines or as bytes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketReceipts" }
            application/octet-stream:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /orders/{order}/chargeback:
    parameters:
      - { name: order, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: recordChargeback
      tags: [Orders]
      summary: Record that the bank took the money back
      description: >
        Not a refund. A refund is the organiser deciding; a chargeback is the bank deciding, usually
        against them, generally with a fee, and always weeks later. Sharing a word would produce a
        settlement saying an organiser gave money back when in fact it was taken from them.


        What it does is not a policy: the seats are released and the tickets voided in one
        transaction, whatever the event's refund policy says, because a booking nobody paid for is
        not a booking — and the half a venue cares about on the night is that the code at the door
        goes red.


        Idempotent. The same dispute reported twice — by a gateway webhook and by somebody typing it
        in — is one chargeback, because the second must not release seats since sold to somebody
        else.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 190 }
                fee:
                  type: integer
                  minimum: 0
                  description: What the bank charged to handle it, in the event's minor unit.
                block:
                  type: boolean
                  description: >
                    Whether to bar this buyer. Never automatic: a disputed payment is sometimes a
                    stolen card and sometimes a buyer who could not reach anybody about a cancelled
                    train.
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  reference: { type: string }
                  status: { type: string, example: charged_back }
                  charged_back_at: { type: string, format: date-time }
                  chargeback_fee: { type: integer }
                  chargeback_reason: { type: [string, "null"] }
                  seats_released: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /blocked-buyers:
    get:
      operationId: listBlockedBuyers
      tags: [Orders]
      summary: Who may not buy from this organiser
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: The list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/BlockedBuyer" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: blockBuyer
      tags: [Orders]
      summary: Bar somebody from booking
      description: >
        An address or a telephone number, a reason, and optionally a date it lapses — a block with a
        date stops applying because the date passed, so most blocks can be six months rather than
        for ever. Blocking somebody already blocked moves the date rather than adding a second row:
        one person is one answer to whether they may buy.


        Checked where a booking is registered, so the refusal arrives before the money. The buyer is
        told to contact the box office; the reason stays inside, because it is somebody's note about
        a person rather than a message to them.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockedBuyer" }
      responses:
        "201":
          description: Blocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockedBuyer" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /blocked-buyers/{blockedBuyer}:
    parameters:
      - { name: blockedBuyer, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: unblockBuyer
      tags: [Orders]
      summary: Lift a block
      security: [ { bearerAuth: [] } ]
      responses:
        "204": { description: Lifted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /promoters:
    get:
      operationId: listPromoters
      tags: [Promoters]
      summary: Who sells on this organiser's behalf
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: The promoters
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Promoter" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createPromoter
      tags: [Promoters]
      summary: Add a promoter
      description: >
        A promoter is a person an organiser created deliberately, which is what makes it safe to pay
        against — unlike a `utm_source`, which anybody can type into a URL. The code goes in their
        link and is unique to the account rather than to the platform: two theatres may both have a
        Maria.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Promoter" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Promoter" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /promoters/performance:
    get:
      operationId: promoterPerformance
      tags: [Promoters]
      summary: What each of them has sold, and what is owed
      description: >
        Worked out from the bookings on every read rather than kept in a column: commission follows
        the tickets, so a refund takes it back without anything having to remember to. The name and
        the rate come off the booking, not off the promoter — an invoice for March is for whoever
        they were, and at whatever percentage they had agreed, in March.


        `campaigns` is the other half of the question: what arrived on a link that names nobody to
        pay — a newsletter, a listing site, a poster with a code on it.
      security: [ { bearerAuth: [] } ]
      parameters:
        - { name: event_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: The figures
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        promoter_id: { type: string, format: uuid }
                        name: { type: [string, "null"] }
                        code: { type: [string, "null"] }
                        orders: { type: integer }
                        tickets: { type: integer }
                        gross:
                          type: integer
                          description: What the tickets came to, in the event's minor unit.
                        commission: { type: integer }
                        currency: { type: string }
                  campaigns:
                    type: array
                    items:
                      type: object
                      properties:
                        source: { type: string }
                        campaign: { type: [string, "null"] }
                        orders: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

  /promoters/{promoter}:
    parameters:
      - { name: promoter, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updatePromoter
      tags: [Promoters]
      summary: Change a promoter
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Promoter" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Promoter" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      operationId: deletePromoter
      tags: [Promoters]
      summary: Remove a promoter
      description: >
        A promoter who has sold nothing is deleted. One who has sold something is switched off
        instead and answered with their row: the bookings keep their own copy of what happened
        either way, but a link that quietly starts working again because somebody recreated the code
        is worse than a promoter who is simply inactive.
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: Deactivated, because they have sold tickets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Promoter" }
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/price-tiers:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: listEventPriceTiers
      tags: [Events]
      summary: When this event's prices change
      description: >
        The windows in order, and which of them is charging money at this moment. `active` is
        derived from the clock on every read — there is no stored "current tier" and nothing runs
        at midnight to move one.
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: The schedule
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PriceTier" }
                  active:
                    oneOf:
                      - { $ref: "#/components/schemas/PriceTier" }
                      - { type: "null" }
                    description: The tier in force now, or null when the zone prices stand as written.
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: replaceEventPriceTiers
      tags: [Events]
      summary: Replace the price tiers
      description: >
        Wholesale, like the price list itself: an organiser moving a deadline expects the tier
        after it to have moved too, and three separate edits are three chances to leave a gap.


        A tier adjusts the **zone** prices, not a price typed against an individual seat — that
        number was a decision about that seat. Windows may not overlap, because two prices for one
        moment is two answers to what a ticket costs; the request is refused with
        `tier_windows_overlap` rather than one of them being picked by sort order.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tiers]
              properties:
                tiers:
                  type: array
                  maxItems: 20
                  items: { $ref: "#/components/schemas/PriceTier" }
      responses:
        "200":
          description: The saved schedule
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/PriceTier" }
                  active:
                    oneOf:
                      - { $ref: "#/components/schemas/PriceTier" }
                      - { type: "null" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /events/{event}/pricing:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    put:
      operationId: replaceEventPricing
      tags: [Events]
      summary: Replace price zones and seat overrides
      description: >
        Replaces the event's currency and its complete price list. Sending everything each time
        keeps the result unambiguous; partial edits across zones are where half a map ends up
        priced from last season.


        Seat overrides are replaced only when the `overrides` key is present. Omitting it leaves
        the existing overrides untouched — so a screen that edits prices and knows nothing about
        blocked seats cannot unblock them — while sending an empty array clears them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency, zones]
              properties:
                currency:
                  type: string
                  minLength: 3
                  maxLength: 3
                  pattern: "^[A-Za-z]{3}$"
                  description: >
                    ISO 4217 code, stored upper-case. Amounts everywhere are in this currency's
                    minor unit, which is not always hundredths: 500000 IRR is five hundred
                    thousand rials, and 1234 KWD is 1.234 dinars.
                  example: EUR
                zones:
                  type: array
                  items: { $ref: "#/components/schemas/PriceZone" }
                overrides:
                  type: array
                  description: Omit to leave existing overrides alone; send [] to clear them.
                  items: { $ref: "#/components/schemas/SeatOverride" }
                booking_fee_kind:
                  type: string
                  enum: [none, per_order, per_ticket]
                  description: Where the fixed part of the booking fee is applied.
                booking_fee_amount:
                  type: integer
                  minimum: 0
                  description: Minor units. Charged once per booking, or once per ticket.
                booking_fee_percent:
                  type: integer
                  minimum: 0
                  maximum: 100
                  description: Added on top of the fixed part, as a share of the ticket subtotal.
                booking_fee_label: { type: [string, "null"], maxLength: 60 }
                tax_rate:
                  type: integer
                  minimum: 0
                  maximum: 10000
                  description: >
                    Basis points, not per cent: 1900 is 19% and 875 is 8.75%. Rates with a fraction
                    are ordinary, and a whole-per-cent field is a field somebody rounds a tax rate
                    into.
                tax_included:
                  type: boolean
                  description: >
                    Whether the prices above already contain the tax. Most of Europe advertises
                    tax-inclusive prices and most of North America does not; getting it backwards
                    is a whole VAT rate of error in either direction, so it is asked rather than
                    assumed.
                tax_label: { type: [string, "null"], maxLength: 40 }
      responses:
        "200":
          description: Pricing replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }

  /auth/login/two-factor:
    post:
      operationId: loginTwoFactor
      tags: [Auth]
      summary: The second half of a sign-in
      security: []
      description: |
        `POST /auth/login` returns `two_factor_required` and a `challenge` instead of a token when
        the account has a second step. The password was right, so that is not a refusal — it is a
        half-finished sign-in, holding a handle that is worth nothing on its own.

        The challenge is a random value in a five-minute cache rather than anything derived from
        the account, and it is spent whatever the answer: a handle that survived a wrong guess
        would be a handle worth guessing against, and there is no cost to typing the password
        again. Either the code from the authenticator app or one of the recovery codes is accepted,
        and a recovery code is used up as it is used.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, code]
              properties:
                challenge: { type: string }
                code: { type: string, maxLength: 20 }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  role: { type: [string, "null"] }
                  two_factor: { type: boolean }
        "401":
          description: Wrong code, or a challenge that has been spent or has expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many attempts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/two-factor:
    get:
      operationId: getTwoFactor
      tags: [Security]
      summary: What the signed-in account has
      description: |
        Always the caller's own account. There is no way to set up, inspect or remove somebody
        else's second step — an administrator who could is an administrator who could sign in as
        them, which is the thing this exists to prevent. The secret never appears in a payload.
      responses:
        "200":
          description: The state
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  recovery_codes_left: { type: integer }
                  required_by_account: { type: boolean }
    post:
      operationId: beginTwoFactor
      tags: [Security]
      summary: Begin setting up a second step
      description: |
        Returns a secret, the `otpauth://` URI an authenticator app reads, and that URI as a QR
        code. Nothing is switched on here: an enrolment abandoned halfway leaves the account
        exactly as usable as it was.
      responses:
        "200":
          description: Something to scan
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  uri: { type: string }
                  qr: { type: string, description: "A data: URI." }
    delete:
      operationId: disableTwoFactor
      tags: [Security]
      summary: Turn the second step off
      description: |
        Takes a working code *and* the password: a borrowed tab is the case a second step defends
        against, and a borrowed tab has neither. Refused outright while the account requires it of
        everybody.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, password]
              properties:
                code: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Off
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
        "409":
          description: The account requires two-step sign-in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/two-factor/confirm:
    post:
      operationId: confirmTwoFactor
      tags: [Security]
      summary: Finish by proving the app works
      description: |
        The recovery codes come back here and nowhere else: they are hashed the moment they are
        made, so this is the only time they can be shown.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: On
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  recovery_codes:
                    type: array
                    items: { type: string }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/two-factor/recovery-codes:
    post:
      operationId: replaceRecoveryCodes
      tags: [Security]
      summary: A fresh set of recovery codes
      description: The old ones stop working the moment the new ones are made.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: The new codes, shown once
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_codes:
                    type: array
                    items: { type: string }
        "409":
          description: Two-step sign-in is not switched on
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /account/two-factor-requirement:
    post:
      operationId: requireTwoFactor
      tags: [Security]
      summary: Require a second step of everybody in the account
      description: |
        Requires `account.manage`, and refuses while the caller has not set up their own: an account
        that requires it of everybody but not of its owner locks its owner out on the next sign-in.

        People who have not set it up still get in — refusing would leave them no way to comply —
        and are told to finish, through `must_set_up_two_factor` on the sign-in response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [required]
              properties:
                required: { type: boolean }
      responses:
        "200":
          description: Set
          content:
            application/json:
              schema:
                type: object
                properties:
                  required_by_account: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The caller has not set up their own
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /events/{event}/questions:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: listEventQuestions
      tags: [Events]
      summary: What this event asks a buyer at checkout
      description: |
        Requires `events.view`. `answered` counts the answers already given, which is the reason a
        question cannot be removed — said on the row rather than in an error afterwards.
      responses:
        "200":
          description: The questions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EventQuestion" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: replaceEventQuestions
      tags: [Events]
      summary: Replace the whole set of checkout questions
      description: |
        Requires `events.manage`. Saved as a whole list, like the ticket types and the price zones:
        what a checkout asks is one decision about the event, and editing it a row at a time is how
        a form ends up with last season's question still on it.

        `scope` is the decision that matters. An `order` question is asked once of whoever is
        booking — "any access requirements" has one answer. A `ticket` question is asked of every
        place, because "what is this guest's name" has one answer per seat, and the door list reads
        it beside that seat.

        A question somebody has answered cannot be left out of the list: the answers point at it,
        and removing it would leave a door list full of answers to a question nobody can read. Hide
        it instead — that stops it being asked and leaves what people said intact.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questions]
              properties:
                questions:
                  type: array
                  maxItems: 20
                  items: { $ref: "#/components/schemas/EventQuestionWrite" }
      responses:
        "200":
          description: The questions, as saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EventQuestion" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A question somebody has answered was left out of the list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /refund-requests:
    get:
      operationId: listRefundRequests
      tags: [Orders]
      summary: Buyers waiting for an answer about their money
      description: |
        Requires `orders.refund`. Saying yes hands money back and saying no is the other half of
        the same decision, so somebody who may not do the first has no business doing the second.

        A request the terms granted the moment it was made appears here too, already answered. This
        is not only a queue of work; it is the record of who asked and what happened, which is the
        answer to "why is this booking refunded" three months later.

        Pending first, because the screen exists so that nobody is left waiting.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, declined] }
        - name: event_id
          in: query
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: The requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RefundRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /refund-requests/{refundRequest}/grant:
    parameters:
      - name: refundRequest
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: grantRefundRequest
      tags: [Orders]
      summary: Say yes
      description: >-
        Requires `orders.refund`. Refunds the seats the request named, or the whole booking where
        it named none, and records who decided and why. Already-answered requests are returned
        unchanged rather than refused, so a double-click cannot refund twice.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: [string, "null"], maxLength: 300 }
      responses:
        "200":
          description: The outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [approved] }
        "403": { $ref: "#/components/responses/Forbidden" }

  /refund-requests/{refundRequest}/decline:
    parameters:
      - name: refundRequest
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: declineRefundRequest
      tags: [Orders]
      summary: Say no, and why
      description: >-
        Requires `orders.refund`. The reason is required rather than optional: the buyer is owed
        one, and "declined" with nothing after it is the sentence that generates the telephone
        call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        "200":
          description: The outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [declined] }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /events/{event}/addons:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: listAddons
      tags: [Pricing]
      summary: What this event sells beside its tickets
      description: |
        Requires `events.view`. A programme, a glass of wine, a parking space — bought alongside the
        tickets and not a ticket itself: nothing here creates an allocation, a ticket, or a row on a
        door list, and the organiser hands it over at the counter.

        `remaining` is counted, not decremented. A cancelled booking gave its programmes back,
        because the organiser never handed one over.

        The donation prompt is returned beside them because it is edited on the same screen: "what
        else can somebody give you money for" is one question to an organiser, even though the two
        answers sit on different sides of the booking fee.
      responses:
        "200":
          description: What is on the counter
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Addon" }
                  donations: { $ref: "#/components/schemas/DonationPrompt" }
                  currency: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }

    put:
      operationId: replaceAddons
      tags: [Pricing]
      summary: Save the whole counter at once
      description: |
        Requires `pricing.manage`. The whole list, every time — the same contract the price zones
        and the ticket types are saved under, and for the same reason: what is on the counter is one
        decision, and editing a row at a time is how a venue ends up offering last season's
        programme next to this season's.

        Anything left out is removed. Something that has been bought cannot be removed — the
        booking still points at it — so the whole save is refused with `addon_sold` naming which,
        rather than half-applied. Hiding it is the way to take it off the counter.

        Every price is stored in the event's own currency whatever is sent: a euro programme against
        a rial event is a line nobody can add up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [addons]
              properties:
                addons:
                  type: array
                  maxItems: 30
                  items: { $ref: "#/components/schemas/AddonInput" }
                donations: { type: boolean }
                donation_prompt: { type: [string, "null"], maxLength: 200 }
                donation_suggested:
                  type: [integer, "null"]
                  description: "Minor units. A number the buyer may overwrite, not a price."
      responses:
        "200":
          description: The counter as it now stands
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Addon" }
                  donations: { $ref: "#/components/schemas/DonationPrompt" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Something on the list has been bought and cannot be removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /access-codes:
    get:
      operationId: listAccessCodes
      tags: [Access]
      summary: Codes that open a sale early
      description: |
        Requires `discounts.manage` — the same permission that owns the other kind of code, because
        both are "somebody may make a promise on this account's behalf" and splitting them would
        give a venue two permissions to reason about for one job.

        `used_count` is live uses, not presses. A basket somebody opened and abandoned gave its use
        back, so a screen that counted presses would report a presale full when it was not.
      parameters:
        - name: event_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [active, paused] }
        - name: q
          in: query
          description: Part of the code, or of the note written against it.
          schema: { type: string }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: The codes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AccessCode" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      operationId: createAccessCode
      tags: [Access]
      summary: Make a presale code
      description: >-
        Requires `discounts.manage`. The code is stored upper-cased and trimmed, so "members" and
        " Members " are one code rather than three near-misses somebody has to explain later.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessCodeInput" }
      responses:
        "201":
          description: The code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessCode" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A code of that name already exists on this account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /access-codes/suggest:
    get:
      operationId: suggestAccessCode
      tags: [Access]
      summary: A code nobody has to invent
      description: >-
        Requires `discounts.manage`. Drawn from an alphabet with no O against 0 and no I against 1,
        because this is printed on a flyer and typed by somebody who is not looking at the flyer
        while they type. Not reserved — it is a suggestion the form may overwrite.
      responses:
        "200":
          description: A code that is free on this account
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: KMPT4X9B }
        "403": { $ref: "#/components/responses/Forbidden" }

  /access-codes/{accessCode}:
    parameters:
      - name: accessCode
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAccessCode
      tags: [Access]
      summary: One code, and who has used it
      description: >-
        Requires `discounts.manage`. The uses are the answer to "who used the code I gave the radio
        station", which is the first thing an organiser asks about one.
      responses:
        "200":
          description: The code
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AccessCode"
                  - type: object
                    properties:
                      uses:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            seats: { type: integer }
                            at: { type: string, format: date-time }
                            order_id: { type: [string, "null"] }
                            order_status: { type: [string, "null"] }
                            buyer: { type: [string, "null"] }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      operationId: updateAccessCode
      tags: [Access]
      summary: Change a code, except its name
      description: >-
        Requires `discounts.manage`. The code itself is not editable: it has been emailed to a
        mailing list by now, and renaming it would break every copy of that email at once. Pausing
        is how a code is stopped.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessCodeInput" }
      responses:
        "200":
          description: The code as it now stands
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessCode" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

    delete:
      operationId: deleteAccessCode
      tags: [Access]
      summary: Delete a code that has never opened anything
      description: >-
        Requires `discounts.manage`. Refused once the code has let somebody in: the booking has to
        keep pointing at why it was allowed, so pausing is the way to stop one that has been used.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The code has been used, and is paused rather than deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /baskets:
    get:
      operationId: listUnfinishedBaskets
      tags: [Baskets]
      summary: Purchases somebody started and did not finish
      description: |
        Requires `orders.view` — this is what it is: bookings that did not happen, listed by buyer.

        A row exists here only for somebody who **submitted the checkout**: who gave their address
        in order to buy tickets and whose payment then never came back. Nothing is ever recorded
        for an address that was merely typed into a box, and nothing for an order registered over
        the integration API, where the shop owns its own basket and its own emails.

        `summary.rate` counts only the people actually written to. Counting the baskets nobody has
        been written to yet would make the recovery rate look worse the better an organiser's
        checkout got, which is exactly backwards.
      parameters:
        - name: event_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [waiting, sent, recovered, declined, expired] }
        - name: q
          in: query
          description: Part of a name or an email address.
          schema: { type: string }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: The unfinished baskets, and what came of writing to them
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/BasketRecovery" }
                  summary: { $ref: "#/components/schemas/BasketSummary" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /baskets/{basketRecovery}/send:
    parameters:
      - name: basketRecovery
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: sendBasketRecovery
      tags: [Baskets]
      summary: Write to one buyer now, rather than waiting for the hourly pass
      description: >-
        Requires `messages.send` as well as `orders.view`: the list is a report, and writing to
        somebody is not. Refused for a basket that has already been written to — this is a way of
        not waiting an hour, not a way of writing twice, and being written to twice about the same
        abandoned cart is how a buyer unsubscribes.
      responses:
        "200":
          description: The recovery as it now stands
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BasketRecovery" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: This buyer has already been written to about this basket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /series/{series}/renewals:
    parameters:
      - name: series
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The run being offered — next season, not last.
    get:
      operationId: listRenewalRounds
      tags: [Seasons]
      summary: Renewals opened on this run
      description: |
        Requires `events.view`. The box office is asked "has Mrs Dehghani renewed?" all day and
        should not need the permission that sets prices in order to answer it.
      responses:
        "200":
          description: Every round on this run, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RenewalRound" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      operationId: openRenewalRound
      tags: [Seasons]
      summary: Offer next season to last season's subscribers
      description: |
        Requires `pricing.manage`, beside the channel quotas: both decide who may buy what.

        Everybody who held seats on the nights of `from_series_id` is offered the same chairs in
        this run, and nobody else can buy them until `deadline`. Nothing is charged and no
        allocation is made: they are offers. The chairs stop being kept **on the stroke of the
        deadline**, read live rather than swept, so a round nobody closed still releases its seats
        on time.

        The answer counts what could not be carried over as well as what could — a chair that is
        not in the new run's plan, or one two bookings somehow both claim. An organiser told "412
        offered" and not told about the 38 that vanished will hear about them from the subscribers
        who used to sit there.

        One open round per run: a second would offer the same chair to two people.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_series_id, season_pass_id, deadline, name]
              properties:
                from_series_id:
                  type: string
                  format: uuid
                  description: Last season — whoever held seats on its nights is offered them again.
                season_pass_id:
                  type: string
                  format: uuid
                  description: >-
                    How the new run is priced for them. A renewal is a season ticket, so it is sold
                    on a season pass like any other; there is no second kind of subscription.
                deadline: { type: string, format: date-time }
                name: { type: string, maxLength: 160 }
      responses:
        "201":
          description: The round, and what came of building it
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/RenewalRound" }
                  offered: { type: integer, description: "How many subscribers were offered seats." }
                  seats: { type: integer, description: "How many chairs are being kept in total." }
                  skipped:
                    type: object
                    description: What could not be carried over, by reason.
                    properties:
                      no_such_seat:
                        type: integer
                        description: "The chair is not in the new run's plan."
                      already_claimed:
                        type: integer
                        description: "Two bookings claimed it; the earlier one won."
                      no_email:
                        type: integer
                        description: "A booking with no address on it."
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /renewals/{round}:
    parameters:
      - name: round
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getRenewalRound
      tags: [Seasons]
      summary: One renewal, and everybody in it
      description: Requires `events.view`.
      responses:
        "200":
          description: The round, its counts and its offers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/RenewalRound" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /renewals/{round}/invite:
    parameters:
      - name: round
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: inviteRenewalRound
      tags: [Seasons]
      summary: Write to everybody who has not been told yet
      description: |
        Requires `messages.send`: writing to several hundred subscribers is its own question,
        answered separately from who may set prices.

        Sent as a message about seats they hold rather than as an announcement, and therefore not
        gated on marketing consent. A subscriber who asked never to hear about next season's
        programme is still entitled to be told that their own chairs are being kept for them and
        that they will lose them if they do not answer; withholding that would be using somebody's
        privacy choice to take their seats away.

        Idempotent: only offers never written to are sent, so pressing it twice writes to nobody
        twice.
      responses:
        "200":
          description: How many were written to
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /renewals/{round}/close:
    parameters:
      - name: round
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: closeRenewalRound
      tags: [Seasons]
      summary: Close a renewal and record who never answered
      description: |
        Requires `pricing.manage`. The chairs were back on general sale at the deadline whether or
        not anybody pressed this — availability reads the date live. What this writes down is the
        difference between "said no" and "never replied", which is a question the box office is
        asked in October.
      responses:
        "200":
          description: The round, now closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/RenewalRound" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /season-passes:
    get:
      operationId: listSeasonPasses
      tags: [Seasons]
      summary: What a whole run costs, bought at once
      description: |
        Requires `discounts.manage`, with the other decisions of the same shape: what a buyer pays
        and what a promise costs the account. A season pass takes no seats out of sale and reserves
        nothing, so it does not belong with the seat map or the box office.

        A pass carries no price of its own. Every night is still priced by the event it belongs to
        — a Tuesday that costs less costs less on a season ticket too — and the pass says only what
        comes off the sum. `nights_on_sale` is what it would actually sell today: published, mapped
        and still ahead. A pass whose run has been and gone reports `live: false`.
      parameters:
        - name: series_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [active, paused] }
        - name: q
          in: query
          schema: { type: string }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: The passes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/SeasonPass" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      operationId: createSeasonPass
      tags: [Seasons]
      summary: Offer a season ticket for a run
      description: >-
        Requires `discounts.manage`. `kind: all` is every published night still ahead; `kind:
        choose` is the flexible pass and must say `nights`, the fewest the buyer may take. A pass
        for fewer than two nights is a ticket, not a season, and is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeasonPassInput" }
      responses:
        "201":
          description: The pass
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonPass" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: That run already has a pass of that name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /season-passes/series:
    get:
      operationId: listSubscribableSeries
      tags: [Seasons]
      summary: The runs a season ticket could be sold for
      description: >-
        Requires `discounts.manage`. Only runs of more than one published night: a "season" of one
        night is a night, and a saving on it is a discount code wearing a different hat.
      responses:
        "200":
          description: The runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        slug: { type: string }
                        nights: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

  /season-passes/{seasonPass}:
    parameters:
      - name: seasonPass
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getSeasonPass
      tags: [Seasons]
      summary: One pass, and who has subscribed to it
      description: >-
        Requires `discounts.manage`. The subscribers are the answer to the only question an
        organiser asks about a pass after making one.
      responses:
        "200":
          description: The pass
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SeasonPass"
                  - type: object
                    properties:
                      bookings:
                        type: array
                        items: { $ref: "#/components/schemas/SeasonBooking" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      operationId: updateSeasonPass
      tags: [Seasons]
      summary: Change a pass, except which run it is for
      description: >-
        Requires `discounts.manage`. The run is not editable: a pass moved to another series would
        leave its subscribers holding nights it no longer covers, which is a lie nobody could
        untangle afterwards. Pausing is how a pass is stopped.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeasonPassInput" }
      responses:
        "200":
          description: The pass as it now stands
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonPass" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

    delete:
      operationId: deleteSeasonPass
      tags: [Seasons]
      summary: Delete a pass nobody has bought
      description: >-
        Requires `discounts.manage`. Refused once somebody has subscribed: those bookings have to
        keep pointing at why they cost what they cost, so pausing is the way to stop one.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Somebody has subscribed, and the pass is paused rather than deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /vouchers:
    get:
      operationId: listVouchers
      tags: [Vouchers]
      summary: Gift vouchers and account credit
      description: |
        Requires `vouchers.manage` — not `discounts.manage`. The two are different powers: inventing
        a half-price code costs a margin, issuing a voucher hands somebody money.

        `balance` is derived on every read, as the sum of the movements. There is no balance column
        to read it off, because a stored balance is a read-modify-write and two tabs spending the
        same gift card in the same second would both succeed against it.
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [gift, credit] }
        - name: status
          in: query
          schema: { type: string, enum: [active, void] }
        - name: q
          in: query
          description: Part of the code, the address, the recipient, or the note.
          schema: { type: string }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: The vouchers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Voucher" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      operationId: createVoucher
      tags: [Vouchers]
      summary: Issue a voucher
      description: |
        Requires `vouchers.manage`. Issuing writes the voucher and its `issue` movement in one
        transaction — a voucher with no issue row is worth nothing, and a movement with no voucher
        is money from nowhere — and is audited without exception, because a voucher issued against
        no payment is an organiser giving money away.

        Exactly one identifying field is kept. A `gift` carries a code and is bearer; a `credit`
        carries an email address and is not. Sending both stores only the one its kind allows.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoucherInput" }
      responses:
        "201":
          description: The voucher
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Voucher" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A gift voucher with that code already exists on this account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /vouchers/suggest:
    get:
      operationId: suggestVoucherCode
      tags: [Vouchers]
      summary: A code nobody has to invent
      description: >-
        Requires `vouchers.manage`. Sixteen characters in four groups, from an alphabet with no O
        against 0 and no I against 1 — longer than a presale code because this one is worth money,
        and a short bearer code is a code worth guessing. Not reserved: it is a suggestion.
      responses:
        "200":
          description: A code that is free on this account
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: KMPT-4X9B-RJH2-WNDF }
        "403": { $ref: "#/components/responses/Forbidden" }

  /vouchers/{voucher}:
    parameters:
      - name: voucher
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getVoucher
      tags: [Vouchers]
      summary: One voucher, and every movement of its money
      description: >-
        Requires `vouchers.manage`. The movements are the working behind the balance: "why does this
        say forty euros" is what an organiser is asked at the counter, and a number with nothing
        under it cannot answer.
      responses:
        "200":
          description: The voucher
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Voucher"
                  - type: object
                    properties:
                      movements:
                        type: array
                        items: { $ref: "#/components/schemas/VoucherMovement" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /vouchers/{voucher}/void:
    parameters:
      - name: voucher
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: voidVoucher
      tags: [Vouchers]
      summary: Stop a voucher and write off what is left
      description: |
        Requires `vouchers.manage`. A POST rather than a DELETE, because nothing is deleted: the row
        stays, the ledger stays, and one more movement takes the remaining balance to zero.

        There is no update and no delete anywhere on this resource, and that is the design. A
        voucher's amount is its `issue` movement; editing it afterwards would leave a balance that
        disagrees with the ledger under it, and deleting one that has paid for a booking would leave
        that booking claiming it was settled out of nothing.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 200 }
      responses:
        "200":
          description: The voucher as it now stands
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Voucher" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /wallet:
    get:
      operationId: getWalletSettings
      tags: [Wallet]
      summary: Whether this account can put a ticket in a phone
      description: |
        Requires `account.manage`. What is stored behind this endpoint can mint passes in the
        organiser's name — the same class of secret as an API key — so it is not a thing a box
        office clerk reaches.

        No secret is ever returned. The response says whether each half is configured and whether
        the two together can actually sign; a screen that displayed a private key would be a screen
        that leaked one.

        `ready` is the field that matters. `enabled` is a switch somebody flicked; `ready` is
        whether flicking it can sign anything, and only `ready` puts a button in front of a buyer.
      responses:
        "200":
          description: The settings, without the secrets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletSettings" }
        "403": { $ref: "#/components/responses/Forbidden" }

    put:
      operationId: updateWalletSettings
      tags: [Wallet]
      summary: Store the organiser's own wallet credentials
      description: |
        Requires `account.manage`. The credentials are the organiser's, always: an Apple pass is
        signed with a certificate issued to a named Apple Developer account and a Google pass with
        a service account belonging to a named issuer. This platform cannot issue either on
        anybody's behalf, and a pass it signed would say it sold the ticket.

        A secret field left out of the body keeps what is stored; sent as an empty string, it is
        removed. The distinction exists so that changing a colour does not mean pasting a
        certificate again.

        Everything secret is encrypted at rest and never comes back out.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WalletSettingsInput" }
      responses:
        "200":
          description: The settings as they now stand
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletSettings" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /wallet/test:
    post:
      operationId: testWalletCredentials
      tags: [Wallet]
      summary: Sign a throwaway pass and see
      description: |
        Requires `account.manage`. A certificate that cannot sign is indistinguishable from one
        that can until a buyer presses a button, so this presses it: a pass for nobody, built and
        signed and thrown away. No ticket is involved and nothing is stored.

        A failure answers with the real reason rather than "it did not work". These are somebody
        else's certificates, and the difference between a wrong password and a wrong file is the
        whole of the debugging.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform]
              properties:
                platform: { type: string, enum: [apple, google] }
      responses:
        "200":
          description: Whether it signed, and why not
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  reason:
                    type: string
                    description: >-
                      Absent when it signed. One of no_site, apple_wallet_not_set_up,
                      apple_certificate_unreadable, apple_key_unreadable, apple_signing_failed,
                      pass_not_written, google_wallet_not_set_up,
                      google_service_account_unreadable or google_signing_failed.
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /events/{event}/translations:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: getEventTranslations
      tags: [Events]
      summary: What this event is called, in each of the six languages
      description: |
        Requires `events.view`. The panel, the site's furniture, the door app and the WordPress
        plugin have spoken six languages since ADR-0005; the one thing that did not is what an
        organiser actually types. An event called "Opening night" read "Opening night" to somebody
        reading the rest of the page in Persian, which is the most visible untranslated thing on a
        site claiming six languages.

        `original` is what the event was created with — the fallback, and always present.
      responses:
        "200":
          description: The translations
          content:
            application/json:
              schema:
                type: object
                properties:
                  original:
                    type: object
                    properties:
                      name: { type: string }
                      description: { type: [string, "null"] }
                      category: { type: [string, "null"] }
                  locales:
                    type: array
                    items: { type: string }
                  data:
                    type: object
                    description: "Locale code to written fields. Absent locales fall back."
                    additionalProperties:
                      type: object
                      properties:
                        name: { type: string }
                        description: { type: string }
                        category: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: replaceEventTranslations
      tags: [Events]
      summary: Replace the whole set
      description: |
        Requires `events.manage`. Its own endpoint rather than a field on the event: these are
        written a language at a time, often weeks later and often by somebody else, and folding
        them into the general update would mean every save of a start time carried every
        translation with it.

        A language blank in both fields is a language deliberately not written and is dropped
        rather than stored — an empty string would render as nothing where a fallback belongs. A
        locale this platform does not speak is ignored. The fallback is field by field, not all or
        nothing: a Persian name with no Persian description uses the original description.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [translations]
              properties:
                translations:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      name: { type: [string, "null"], maxLength: 200 }
                      description: { type: [string, "null"], maxLength: 5000 }
                      category: { type: [string, "null"], maxLength: 60 }
      responses:
        "200":
          description: The translations, as saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /events/{event}/cancel:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    post:
      operationId: cancelEvent
      tags: [Events]
      summary: Call a night off
      description: |
        Requires `events.manage` **and** `orders.refund`. Cancelling stops an event selling, which
        is the first, and hands back everything already taken, which is the second — and somebody
        who may do one is not automatically somebody who may do the other.

        `confirm` must carry the event's own name. This is the one action on the platform that
        cannot be undone by pressing something else: the tickets are void and the money has gone
        back, and a mis-click on a list of twelve dates would be a disaster with no way out of it.

        Two halves. The sale stops inside the request — nothing may be sold for a cancelled night,
        not for the second it takes to answer, and carts in flight are released rather than left to
        their own expiry. Refunding and telling people is the long half, and runs as a job: an
        arena is twenty thousand bookings, and a cancellation that times out halfway through the
        refunds is worse than one that never started. One booking that will not settle is logged
        and counted rather than allowed to stop the rest.

        `refund: false` for money taken somewhere this platform cannot reach, which the organiser
        will hand back themselves. The seats are released and the tickets voided either way: a
        valid ticket to a cancelled event is a person at a locked door.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, confirm]
              properties:
                reason:
                  type: string
                  maxLength: 300
                  description: >-
                    The organiser's own sentence. It goes in the message and on the event page:
                    "cancelled" alone starts an argument rather than ending one.
                confirm:
                  type: string
                  description: "The event's name, exactly."
                refund: { type: boolean, default: true }
                notify: { type: boolean, default: true }
      responses:
        "200":
          description: The event, now cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /events/{event}/reschedule:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    post:
      operationId: rescheduleEvent
      tags: [Events]
      summary: Move it to another night
      description: |
        Requires `events.manage` alone: nothing is refunded and nothing is voided. Every ticket
        already sold stays sold and stays valid, which is the whole difference from a cancellation
        and the first thing the message says — the commonest reaction to "your event has changed"
        is to assume the ticket has not survived it.

        Arrival windows shift by exactly the same interval the event did. A timetable of half-hours
        from ten in the morning is the same timetable on the new day; leaving them on the old one
        would print tickets for a date that has passed.

        `rescheduled_from` keeps the original date rather than overwriting it, because that is the
        answer to the only question anybody asks afterwards.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starts_at]
              properties:
                starts_at: { type: string, format: date-time }
                ends_at:
                  type: [string, "null"]
                  format: date-time
                  description: "Omit to keep the run's current length."
                reason: { type: [string, "null"], maxLength: 300 }
                notify: { type: boolean, default: true }
      responses:
        "200":
          description: The event, on its new date
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Event" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A cancelled event cannot be moved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /events/{event}/best-available:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: suggestBestAvailable
      tags: [Box office]
      summary: Four together, at the window
      description: |
        Requires `orders.sell`. A suggestion rather than a hold: the person at the counter is
        looking at a buyer, not at a clock, and a hold taken on their behalf is a hold they have to
        remember to release when the conversation goes another way. The website's own path holds
        atomically instead — see `best_available` on the hold endpoints.

        The same arithmetic answers both. Together means physically adjacent; "best" means the
        organiser's own price list; a wheelchair space is never offered.
      parameters:
        - name: quantity
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: max_amount
          in: query
          description: "The most to pay per seat, in minor units."
          schema: { type: integer, minimum: 0 }
        - name: zone_key
          in: query
          schema: { type: string, maxLength: 60 }
        - name: section_key
          in: query
          schema: { type: string, maxLength: 60 }
        - name: prefer
          in: query
          schema: { type: string, enum: [best, cheapest], default: best }
      responses:
        "200":
          description: The seats, named so they can be read out. Empty when there is no such run.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        seat_id: { type: string, format: uuid }
                        section: { type: string }
                        row: { type: string }
                        label: { type: string }
                        amount: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /events/{event}/entry-slots:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: listEntrySlots
      tags: [Events]
      summary: When people may come in
      description: |
        Requires `events.view`. An empty list is an event that does not sell timed entry, which is
        not a state to fix: nothing in the picker, the checkout or the ticket then mentions an
        arrival time at all. Whether an event *is* timed entry is answered by whether it has any
        open window — there is no separate switch to leave in the wrong position.

        `capacity` is how many people may come in during the window. Null is a window that limits
        nothing, which is different from a window with no room left: some runs stagger arrivals for
        the queue's sake and have one hall behind it.

        `sold` counts places already sold into each window. It is the reason a row cannot be
        removed, said on the row rather than in an error afterwards.
      responses:
        "200":
          description: The windows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EntrySlot" }
                  timezone:
                    type: [string, "null"]
                    description: "The event's own zone, which is the clock its windows are read in."
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: replaceEntrySlots
      tags: [Events]
      summary: Replace the whole timetable
      description: |
        Requires `events.manage`. Saved as a whole list, like the ticket types and the questions: a
        day's timetable is one decision about the event, and editing it a window at a time is how a
        Saturday ends up with a gap in it.

        Windows may not overlap. The whole point of timed entry is that a limit means something,
        and two overlapping hundreds would put two hundred people in a hall that holds one.

        A window somebody has been sold into cannot be left out of the list: their ticket says to
        arrive between ten and half past, and removing the row would leave the door with an arrival
        time it cannot look up. Close it instead — that stops it being sold and leaves what was
        sold intact.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slots]
              properties:
                slots:
                  type: array
                  maxItems: 96
                  items: { $ref: "#/components/schemas/EntrySlotWrite" }
      responses:
        "200":
          description: The windows, as saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EntrySlot" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A window that has been sold was left out of the list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /events/{event}/entry-slots/generate:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    post:
      operationId: generateEntrySlots
      tags: [Events]
      summary: Fill a day with windows of one length
      description: |
        Requires `events.manage`. Nothing is saved: this hands back rows for the caller to show,
        change and then PUT, so an organiser sees the timetable they are about to create before
        anything exists. A generator that wrote straight to the database would be a generator
        nobody dares press twice.

        A window that would run past `ends_at` is not made — an organiser who says the last entry
        is at four means four, not four twenty — and at most 96 come back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starts_at, ends_at, minutes]
              properties:
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
                minutes: { type: integer, minimum: 5, maximum: 720 }
                capacity: { type: [integer, "null"], minimum: 1 }
      responses:
        "200":
          description: The windows this would create
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EntrySlotWrite" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /events/{event}/ticket-types:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: listTicketTypes
      tags: [Events]
      summary: Who this event sells tickets to
      description: |
        Requires `events.view`. An empty list is an event that sells one kind of ticket, which is
        not a state to fix: nothing in the picker, the checkout or the ticket then mentions a type
        at all.

        `sold` counts tickets already issued at each type. It is the reason a row cannot be
        removed, said on the row rather than in an error afterwards.
      responses:
        "200":
          description: The types
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TicketType" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: replaceTicketTypes
      tags: [Events]
      summary: Replace the whole set of ticket types
      description: |
        Requires `pricing.manage`. Saved as a whole list, like the price zones it sits beside: a
        concession set is one decision about the event, and editing a row at a time is how an event
        ends up with a child rate from last season and a student rate from this one.

        A type is an adjustment to the seat's own price — `percent_off`, `amount_off`, or `fixed`
        for the flat rate that genuinely is one — so re-pricing a section re-prices every
        concession in it. `standard` is full price and ignores `value`.

        Exactly one type is the default whatever the caller sends: it is what a seat costs before
        the buyer chooses anything, and what an integration that has never heard of concessions
        sells at. A type that has sold a ticket cannot be left out of the list; hide it instead,
        or the order it paid for would describe a ticket nobody can explain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [types]
              properties:
                types:
                  type: array
                  maxItems: 20
                  items: { $ref: "#/components/schemas/TicketTypeWrite" }
      responses:
        "200":
          description: The types, as saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/TicketType" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A type that has been sold was left out of the list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/login:
    post:
      operationId: consoleLogin
      tags: [Console]
      summary: Sign in to the platform console
      security: []
      description: >
        A route of its own rather than a flag on the panel's login: the panel's asks which
        organiser somebody is a member of, and an operator is a member of none. One message for all
        three failures — no such user, wrong password, not an operator — so this cannot be used to
        find out who runs the platform. Signing in is itself recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Signed in, with a token that expires in four hours
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  level: { type: string, enum: [support, operator] }
                  name: { type: string }

  /admin/overview:
    get:
      operationId: consoleOverview
      tags: [Console]
      summary: The platform, in numbers
      description: >
        Takings are grouped by currency rather than added up. A platform serving Tehran and Berlin
        has no single number, and inventing one by summing rials into euros is worse than two rows.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenants: { type: object, additionalProperties: true }
                  sites: { type: object, additionalProperties: true }
                  selling: { type: object, additionalProperties: true }
                  takings_this_month:
                    type: array
                    items:
                      type: object
                      properties:
                        currency: { type: string }
                        total: { type: integer }
                        orders: { type: integer }

  /admin/tenants:
    get:
      operationId: consoleListTenants
      tags: [Console]
      summary: Every organiser on the platform
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, suspended, cancelled] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ConsoleTenant" }

  /admin/tenants/{tenant}:
    parameters:
      - name: tenant
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: consoleGetTenant
      tags: [Console]
      summary: One organiser, with its people and websites
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ConsoleTenant"
                  - type: object
                    properties:
                      members:
                        type: array
                        items: { type: object, additionalProperties: true }
                      websites:
                        type: array
                        items: { type: object, additionalProperties: true }
                      events: { type: integer }
                      tickets: { type: integer }
    patch:
      operationId: consoleUpdateTenant
      tags: [Console]
      summary: Suspend, reinstate, or move an organiser to another plan
      description: >
        An operator's power, not support's. Suspension is not a flag on a screen: the panel refuses
        the account and its websites stop serving.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [active, suspended, cancelled] }
                plan: { type: string }
                reason: { type: [string, 'null'], maxLength: 200 }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsoleTenant" }
        "403":
          description: A support account tried to change something
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/tenants/{tenant}/impersonate:
    parameters:
      - name: tenant
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: consoleImpersonate
      tags: [Console]
      summary: A token that acts as an organiser's owner, for an hour
      description: >
        Support needs to see what a customer sees; nobody should be able to do that quietly. The
        token expires by itself, and the fact is written to the platform's log *and* to the
        organiser's own audit log — it is their account that was entered.
      responses:
        "200":
          description: A time-boxed token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
                  as: { type: object, additionalProperties: true }
                  tenant: { type: object, additionalProperties: true }

  /admin/sites:
    get:
      operationId: consoleListSites
      tags: [Console]
      summary: Every website this platform serves
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }

  /admin/audit:
    get:
      operationId: consoleAudit
      tags: [Console]
      summary: What the people who run the platform did inside other people's accounts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }

  /admin/plans:
    get:
      operationId: consoleListPlans
      tags: [Console]
      summary: The tariffs, with how many organisers are on each
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ConsolePlan" }
                  limit_keys:
                    type: array
                    description: The limits the platform actually enforces.
                    items: { type: string }
    post:
      operationId: consoleCreatePlan
      tags: [Console]
      summary: Add a tariff
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsolePlan" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsolePlan" }

  /admin/plans/{plan}:
    parameters:
      - name: plan
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: consoleUpdatePlan
      tags: [Console]
      summary: Change a tariff
      description: >
        The key cannot be changed: a subscription points at it. Both the old and the new price are
        written to the operator log, because changing a price changes what existing subscribers pay
        at renewal.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsolePlan" }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsolePlan" }
    delete:
      operationId: consoleDeletePlan
      tags: [Console]
      summary: Delete a tariff nobody is on
      description: >
        A plan with subscribers is deactivated, not deleted — that takes it off the signup screen
        and leaves every organiser on it where they were.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        "409":
          description: Organisers are on it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /plans:
    get:
      operationId: listPlans
      tags: [Signup]
      summary: What somebody choosing a plan is choosing between
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        name: { type: string }
                        price_amount: { type: integer, description: In the currency's minor unit. }
                        currency: { type: string }
                        interval: { type: string, examples: [month, year] }
                        limits: { type: object, additionalProperties: true }

  /signup:
    post:
      operationId: signUp
      tags: [Signup]
      summary: Create an account
      security: []
      description: >
        One request makes the four things that have to exist before a venue can do anything: a
        person, an organiser, a subscription and a website. Four requests would be four ways to end
        up half signed up.


        The address is verified afterwards. An unverified account can build everything and cannot
        put a site on the public internet, which is the one thing an unverified address could be
        used to abuse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, organisation, email, password]
              properties:
                name: { type: string, maxLength: 120 }
                organisation: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
                locale: { type: string }
                timezone: { type: string }
                plan: { type: string }
      responses:
        "201":
          description: Created, with a token that already works
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  tenant: { type: object, additionalProperties: true }
                  role: { type: string }
                  site_id: { type: string, format: uuid }
                  email_verified: { type: boolean }
                  plan: { type: string }
        "409":
          description: That address already has an account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /signup/verify:
    post:
      operationId: verifyEmail
      tags: [Signup]
      summary: Type the code from the email
      security: []
      description: >
        Six digits, hashed at rest, good for a day, and capped at six attempts — the cap is what
        makes six digits not guessable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string }
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  email_verified: { type: boolean }
        "422":
          description: Wrong or expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /signup/resend:
    post:
      operationId: resendVerification
      tags: [Signup]
      summary: Send the code again
      security: []
      description: >
        Answers the same way whether or not the address has an account: this endpoint must not be
        usable to find out who has one, and it is throttled hard because it sends email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: boolean }

  /shifts:
    get:
      operationId: listShifts
      tags: [Box office]
      summary: Tills, newest first
      description: |
        Requires `orders.sell`. Somebody who works a window sees their own shifts; a holder of
        `reports.orders.view` sees everybody's. The narrowing is applied to the query rather than
        to the answer, because a filter applied afterwards is a filter somebody eventually forgets.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Shift" }
                  methods:
                    type: array
                    items: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: openShift
      tags: [Box office]
      summary: Open a till
      description: >
        Requires `orders.sell`. One open till per person, enforced by a partial unique index as
        well as here: opening a second one is what a double-clicked button does, and two open
        shifts would divide one evening's takings between them at random.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency]
              properties:
                currency: { type: string, minLength: 3, maxLength: 3 }
                opening_float:
                  type: integer
                  minimum: 0
                  description: What is in the drawer before anybody has sold anything, in minor units.
                event_id:
                  type: [string, "null"]
                  format: uuid
                  description: The night this desk is selling for, where the venue works that way.
      responses:
        "201":
          description: Open
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shift" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: This person already has a till open (`till_already_open`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /shifts/current:
    get:
      operationId: currentShift
      tags: [Box office]
      summary: This person's own open till, or null
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/Shift"
                      - type: "null"
        "403": { $ref: "#/components/responses/Forbidden" }

  /shifts/{shift}:
    parameters:
      - name: shift
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getShift
      tags: [Box office]
      summary: One till, with what it took and what it should hold
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shift" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /shifts/{shift}/movements:
    parameters:
      - name: shift
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: moveTillCash
      tags: [Box office]
      summary: Cash in or out of the drawer for a reason that is not a sale
      description: >
        A taxi paid for out of the drawer, twenty put in to make change. These are the only cash
        movements written down: what was sold and what was handed back are already orders, and a
        second copy of them here would be a second number to disagree with the first. The reason is
        required — a movement without one is the thing an audit asks about first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, amount, reason]
              properties:
                kind: { type: string, enum: [in, out] }
                amount: { type: integer, minimum: 1 }
                reason: { type: string, maxLength: 200 }
      responses:
        "201":
          description: The till as it now stands
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shift" }
        "403":
          description: Somebody else's till (`not_your_till`), which the reports permission does not open.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: That till is closed (`till_closed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /shifts/{shift}/close:
    parameters:
      - name: shift
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: closeShift
      tags: [Box office]
      summary: Count the drawer and close
      description: |
        The difference is not an error to be corrected: it is the finding. A till four over is as
        interesting as one four short, and neither is fixed by changing a number afterwards — which
        is why nothing here reopens or recounts a closed shift.

        Both what was counted and what was expected are written down at this moment. A refund
        granted the next morning changes what the till *would* now be expected to have held, and it
        must not silently rewrite last night's discrepancy into agreement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [counted_cash]
              properties:
                counted_cash: { type: integer, minimum: 0 }
                note: { type: [string, "null"], maxLength: 300 }
      responses:
        "200":
          description: Closed, with the difference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shift" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: That till is closed already (`till_closed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /segments:
    get:
      operationId: listSegments
      tags: [Messaging]
      summary: Saved audiences
      description: |
        Requires `messages.send`. A segment is what a message is addressed to, and there is nothing
        else on this platform you can do with one — which is why it lives with messaging rather than
        with the customer directory.

        It says how many people it reaches and never who they are. A segment is not a second
        customer directory: the addresses it resolves to are used in exactly one place, the delivery
        log of a send in progress, and an endpoint that listed them would be a way to walk out of
        the building with an account's mailing list.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Segment" }
                  clauses:
                    type: array
                    description: The vocabulary this version understands, so a screen builds its controls from it rather than from a copy that drifts.
                    items: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createSegment
      tags: [Messaging]
      summary: Save an audience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                description: { type: [string, "null"], maxLength: 300 }
                rules: { $ref: "#/components/schemas/SegmentRules" }
      responses:
        "201":
          description: Saved, with how many people it reaches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Segment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /segments/preview:
    post:
      operationId: previewSegment
      tags: [Messaging]
      summary: How many people a set of rules describes
      description: >
        Counted without saving anything, so a set of clauses can be a number before it is a list.
        A count only — see `GET /segments` for why there is no endpoint that returns the people.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rules]
              properties:
                rules: { $ref: "#/components/schemas/SegmentRules" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  people: { type: integer }
                  rules:
                    type: object
                    description: The rules read back in names rather than identifiers.
                    additionalProperties: true
        "403": { $ref: "#/components/responses/Forbidden" }

  /segments/{segment}:
    parameters:
      - name: segment
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getSegment
      tags: [Messaging]
      summary: One saved audience, with how many people it reaches
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Segment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateSegment
      tags: [Messaging]
      summary: Change a saved audience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                description: { type: [string, "null"], maxLength: 300 }
                rules: { $ref: "#/components/schemas/SegmentRules" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Segment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      operationId: deleteSegment
      tags: [Messaging]
      summary: Delete a saved audience
      description: >
        The list goes; the announcements sent to it stay, with their own record of what they
        reached. Their reference is nulled rather than the history being deleted with the list.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /customers/{customer}/consent:
    parameters:
      - name: customer
        in: path
        required: true
        description: The SHA-256 of the buyer's address — an email in a path is an email in an access log.
        schema: { type: string }
    put:
      operationId: recordCustomerConsent
      tags: [Customers]
      summary: Write down an answer given where this system could not see it
      description: |
        Requires `messages.send` — this is about who may be written to, not about who bought.

        A venue with a paper sign-up sheet at the interval is a real venue, and refusing to let them
        record it would only send them to a spreadsheet where nobody can check anything. So it is
        allowed, and it asks where the answer came from in a required note: that is the question an
        audit asks a year later, and the one thing a bought list cannot answer. The member of staff
        who typed it is recorded against it.

        The note is required in both directions — "somebody telephoned to be taken off" is as much
        worth knowing as where a yes came from.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, note]
              properties:
                state: { type: string, enum: [in, out] }
                note: { type: string, maxLength: 200 }
      responses:
        "200":
          description: The answer as it now stands, with its history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketingConsent" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /messaging/announcements:
    get:
      operationId: listAnnouncements
      tags: [Messaging]
      summary: What has been said to buyers, and how it went
      description: |
        Requires `messages.send` — writing to everybody who bought is a different act from
        configuring the platform, so a manager who runs the programme can do it without also being
        able to change the account's settings.

        `sent`, `failed` and `total` are counted from the deliveries themselves rather than kept on
        the announcement: there is one record of whether a message arrived, and it is the delivery
        log.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Announcement" }
                  channels:
                    type: array
                    items: { $ref: "#/components/schemas/MessageChannel" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: sendAnnouncement
      tags: [Messaging]
      summary: Say something to everybody who bought
      description: |
        The audience is resolved once, into queued deliveries, at the moment this is called —
        orders keep arriving while an announcement is going out, and re-resolving "everybody who
        bought" on each batch would send some people two copies and skip others.

        One message per person per channel, deduplicated by address: a buyer with four orders gets
        one email. Only orders where money actually arrived count. The first batch is sent inline,
        so a small announcement is finished by the time this responds; anything larger is finished
        by `messages:announce`, through the same code.

        `{buyer}`, `{event}` and `{site}` in the subject or body are substituted per recipient.

        **Service or news.** An announcement to the buyers of one event is about a booking they
        hold — the doors have moved, bring a coat — and is part of having sold them the ticket, so
        it reaches everybody who bought. An announcement to everybody, or to a saved audience, is
        about something they have not bought: it reaches only the people who have said they want to
        hear from this organiser, and it carries a link at the bottom that lets them stop it without
        signing in to anything. Silence is not consent — somebody nobody has asked is not written
        to — and there is no setting that changes that.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels, body]
              properties:
                event_id:
                  type: [string, "null"]
                  format: uuid
                  description: Buyers of one event. Omit for everybody who has bought.
                segment_id:
                  type: [string, "null"]
                  format: uuid
                  description: >-
                    A saved audience, which answers the whole question and is therefore used
                    *instead of* `event_id` rather than beside it: "came last season and has not
                    booked this one" narrowed to "bought this one" is the empty set. An id that
                    does not resolve is refused with `unknown_segment` rather than falling back to
                    everybody — that is the one wrong answer that cannot be unsent.
                channels:
                  type: array
                  minItems: 1
                  items: { type: string }
                subject: { type: [string, "null"], maxLength: 200 }
                body: { type: string, maxLength: 2000 }
                locale: { type: string, maxLength: 12 }
      responses:
        "201":
          description: On its way
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Announcement" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /messaging/announcements/audience:
    get:
      operationId: announcementAudience
      tags: [Messaging]
      summary: How many people an announcement would reach
      description: >
        Counted without sending anything, so "everybody who bought" can be a number before it is a
        decision. `people` counts humans; `messages` counts what would actually be sent, which is
        higher when more than one channel is chosen and lower when people have no address for one.
      parameters:
        - name: event_id
          in: query
          schema: { type: string, format: uuid }
        - name: segment_id
          in: query
          description: A saved audience, used instead of `event_id` rather than beside it.
          schema: { type: string, format: uuid }
        - name: channels
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  people: { type: integer }
                  messages: { type: integer }
                  unreachable:
                    type: integer
                    description: >-
                      People this would match but may not be sent to, because nobody has asked them
                      whether they want to hear from this organiser — or they said no. Counted and
                      returned rather than quietly dropped: "this reaches 900 of your 4,000 buyers"
                      is the sentence that sends somebody to go and ask the other 3,100. Always
                      nought on a message about one event's own buyers, which needs no permission.
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /notifications:
    get:
      operationId: listNotifications
      tags: [Notifications]
      summary: What the platform is telling this account
      description: |
        Refunds, messages a channel refused, announcements that finished, addresses that verified,
        nights that sold out. Each kind is governed by the permission that governs the thing it is
        about — a refund by `orders.view`, a failed message by `account.manage` — and that is
        applied on the way out rather than when the row was written, because roles change.

        `title` and `body` are composed here in the reader's own language from facts stored on the
        row. A notification stored as prose is a notification a colleague reads in a language they
        do not have.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
                  unread: { type: integer }

  /notifications/read:
    post:
      operationId: readNotifications
      tags: [Notifications]
      summary: Mark what this person can see as read
      description: >
        Everything currently visible to the caller, and nothing else: marking as read what somebody
        was never shown is how a notice disappears before anybody reads it. Read marks are per
        person — one colleague reading a notice does not read it for the rest of the account.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread: { type: integer }

  /messaging:
    get:
      operationId: getMessagingSettings
      tags: [Messaging]
      summary: What this account tells buyers, and on what
      description: >
        Every kind of message, the channels each goes out on, the languages available, and any
        wording the organiser has written. A kind with no template of its own uses the platform's,
        translated — so an account that has configured nothing still sends real messages.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  kinds:
                    type: array
                    items: { $ref: "#/components/schemas/MessageKind" }
                  channels:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, examples: [email, sms.kavenegar, telegram] }
                        name: { type: string }
                        address_kind: { type: string, enum: [email, phone, handle] }

  /messaging/log:
    get:
      operationId: listMessageDeliveries
      tags: [Messaging]
      summary: What was sent, and what happened to it
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [queued, sent, refused, unavailable] }
        - name: kind
          in: query
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MessageDelivery" }

  /messaging/test:
    post:
      operationId: sendTestMessage
      tags: [Messaging]
      summary: Send the wording to somebody, with example values
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, channel, locale, to]
              properties:
                kind: { type: string }
                channel: { type: string }
                locale: { type: string }
                to: { type: string }
      responses:
        "200":
          description: Attempted — the status says whether it went
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [queued, sent, refused, unavailable] }
                  reason: { type: [string, 'null'] }
                  preview: { type: [string, 'null'] }

  /messaging/{kind}/channels/{channel}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string }
      - name: channel
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: setMessageChannel
      tags: [Messaging]
      summary: Turn a channel on or off for one kind of message
      description: >
        A buyer is entitled to be told their order was confirmed, so email cannot be switched off
        for the messages that are not optional. An organiser chooses how a buyer is told, not
        whether.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
        "422":
          description: That message cannot be switched off
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /messaging/{kind}/{channel}/{locale}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string }
      - name: channel
        in: path
        required: true
        schema: { type: string }
      - name: locale
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getMessageTemplate
      tags: [Messaging]
      summary: The wording that would be used right now
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageTemplate" }
    put:
      operationId: saveMessageTemplate
      tags: [Messaging]
      summary: Replace the wording
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                subject: { type: [string, 'null'], maxLength: 200 }
                body: { type: string, maxLength: 4000 }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
    delete:
      operationId: resetMessageTemplate
      tags: [Messaging]
      summary: Put the platform's wording back
      responses:
        "200":
          description: Reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  reset: { type: boolean }

  /reports/sources:
    get:
      operationId: listReportSources
      tags: [Reports]
      summary: The datasets you may build a report from
      description: >
        Each source declares its dimensions, measures and filters. The builder composes a query
        from identifiers the source declared — never from user text — which is why there is no
        query box and will not be one (ADR-0006). Only sources the caller's role may read are
        listed: `reports.orders.view` is not `reports.attendance.view`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ReportSource" }
                  max_rows: { type: integer }
                  max_export_rows: { type: integer }

  /reports/run:
    post:
      operationId: runReportDefinition
      tags: [Reports]
      summary: Run a definition that has not been saved
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, definition]
              properties:
                source: { type: string }
                definition: { $ref: "#/components/schemas/ReportDefinition" }
      responses:
        "200":
          description: Rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportResult" }
        "422":
          description: A field the source never declared, or nothing to measure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /reports:
    get:
      operationId: listReports
      tags: [Reports]
      summary: Saved report definitions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Report" }
    post:
      operationId: createReport
      tags: [Reports]
      summary: Save a definition
      description: The definition is validated against its source before it is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, source, definition]
              properties:
                name: { type: string, maxLength: 120 }
                source: { type: string }
                definition: { $ref: "#/components/schemas/ReportDefinition" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }

  /reports/{report}:
    parameters:
      - name: report
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getReport
      tags: [Reports]
      summary: One saved report
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
    patch:
      operationId: updateReport
      tags: [Reports]
      summary: Rename a report or change its definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                definition: { $ref: "#/components/schemas/ReportDefinition" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
    delete:
      operationId: deleteReport
      tags: [Reports]
      summary: Delete a saved report
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }

  /reports/{report}/run:
    parameters:
      - name: report
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: runReport
      tags: [Reports]
      summary: Run a saved report
      description: >
        Re-run on read, never a stored result — so a report cannot go stale and cannot become a
        copy of numbers that have since been corrected.
      responses:
        "200":
          description: Rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportResult" }

  /reports/{report}/export:
    parameters:
      - name: report
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: exportReport
      tags: [Reports]
      summary: The same definition, as a CSV
      description: >
        Streamed, with a higher row cap than the screen. The same runner and the same definition:
        two implementations of what a report means is how an export and its screen start
        disagreeing.
      responses:
        "200":
          description: A CSV file
          content:
            text/csv:
              schema: { type: string }

  /report-pages:
    get:
      operationId: listReportPages
      tags: [Reports]
      summary: Pages of report widgets
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ReportPage" }
    post:
      operationId: createReportPage
      tags: [Reports]
      summary: Create a page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                widgets:
                  type: array
                  items: { $ref: "#/components/schemas/ReportWidget" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportPage" }

  /report-pages/{page}:
    parameters:
      - name: page
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getReportPage
      tags: [Reports]
      summary: The page, with every widget already run
      description: >
        Each widget runs through its own report's source permission, so a page cannot become a way
        to see a report you may not read. A widget that is out of reach comes back with an `error`
        in place of its rows, so the rest of the page still renders.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  slug: { type: string }
                  widgets:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/ReportWidget"
                        - type: object
                          properties:
                            error: { type: string }
                            columns:
                              type: array
                              items: { $ref: "#/components/schemas/ReportColumn" }
                            rows:
                              type: array
                              items: { type: object, additionalProperties: true }
    patch:
      operationId: updateReportPage
      tags: [Reports]
      summary: Rename a page or rearrange its widgets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                widgets:
                  type: array
                  items: { $ref: "#/components/schemas/ReportWidget" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportPage" }
    delete:
      operationId: deleteReportPage
      tags: [Reports]
      summary: Delete a page
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }

  /themes:
    get:
      operationId: listCustomThemes
      tags: [Sites]
      summary: The themes available to this account
      description: >
        Ours, this account's own, and the token vocabulary the panel draws its controls from. A
        theme is tokens and a stylesheet, never code (ADR-0003), so nothing here can run.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/CustomTheme" }
                  built_in:
                    type: array
                    items: { $ref: "#/components/schemas/SiteTheme" }
                  tokens:
                    type: array
                    description: Token definitions, including each choice's CSS value.
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        kind: { type: string, enum: [colour, choice] }
                        group: { type: string }
                        var: { type: string }
                        default: { type: string }
                  max_css_bytes: { type: integer }
    post:
      operationId: createSiteTheme
      tags: [Sites]
      summary: Start a theme from one of ours
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, base_key]
              properties:
                name: { type: string, maxLength: 80 }
                base_key:
                  type: string
                  description: The first-party theme to start from; its stylesheet stays linked.
                tokens: { type: object, additionalProperties: { type: string } }
                css: { type: [string, 'null'] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomTheme" }

  /themes/{theme}:
    parameters:
      - name: theme
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getSiteTheme
      tags: [Sites]
      summary: One theme, with its stylesheet and its history
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomTheme" }
    patch:
      operationId: updateSiteTheme
      tags: [Sites]
      summary: Change a theme
      description: >
        Every save keeps what it replaced, because a stylesheet is the one thing an organiser can
        change that breaks every page of a live site at once. `stylesheet_trimmed` says whether
        anything had to be taken out of the CSS — angle brackets, `@import`, `expression(` and the
        other ways a stylesheet was historically persuaded to run script.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                base_key: { type: string }
                tokens: { type: object, additionalProperties: { type: string } }
                css: { type: [string, 'null'] }
                note: { type: [string, 'null'], maxLength: 160 }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomTheme" }
    delete:
      operationId: deleteSiteTheme
      tags: [Sites]
      summary: Delete a theme nobody is wearing
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        "409":
          description: Some sites still wear it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /themes/{theme}/versions/{version}/revert:
    parameters:
      - name: theme
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: version
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: revertSiteTheme
      tags: [Sites]
      summary: Put a theme back the way it was
      responses:
        "200":
          description: Reverted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomTheme" }

  /events/{event}/seat-prices:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: listSeatPrices
      tags: [Events]
      summary: Every seat, with what it costs and why
      description: >
        The chart grouped by section and row — the way a hall is spoken about. Each seat carries
        the amount a buyer would be charged now, whether that amount is the seat's own or its
        zone's, and whether it is blocked or already sold.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  currency: { type: string }
                  zones:
                    type: array
                    items: { $ref: "#/components/schemas/PriceZone" }
                  sections:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        name: { type: string }
                        color: { type: [string, 'null'] }
                        rows:
                          type: array
                          items:
                            type: object
                            properties:
                              key: { type: string }
                              name: { type: string }
                              seats:
                                type: array
                                items: { $ref: "#/components/schemas/SeatPrice" }
    put:
      operationId: updateSeatPrices
      tags: [Events]
      summary: Price, move or block individual seats
      description: >
        Changes the seats named and leaves every other seat alone. A section called VIP is a name,
        not a price, so a seat may carry its own amount; the zone is what it falls back to.


        A seat with no amount, no zone of its own, not blocked and with nothing noted has its
        override deleted rather than stored as a row of nulls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seats]
              properties:
                seats:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items:
                    type: object
                    required: [seat_id, amount, zone_key]
                    properties:
                      seat_id: { type: string, format: uuid }
                      amount:
                        type: [integer, 'null']
                        minimum: 0
                        description: The seat's own price, in the event currency's minor unit.
                      zone_key:
                        type: [string, 'null']
                        description: >
                          Follow this price zone instead of the one the chart put the seat in.
                          Different from copying today's number onto the seat: the seat moves when
                          the zone is repriced.
                      blocked: { type: boolean }
                      held_for:
                        type: [string, "null"]
                        maxLength: 60
                        description: >-
                          Who a blocked seat is being kept for. A blocked seat with a label is a
                          **house seat**: off public sale, and sellable at the counter on the
                          night. Only meaningful on a blocked seat, and the database says so with a
                          CHECK — a label sent for a seat on public sale is dropped rather than
                          stored.
                      note: { type: [string, 'null'], maxLength: 255 }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  changed: { type: integer }
                  cleared: { type: integer }
        "422":
          description: A seat is not in this event's map, or a zone does not exist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /events/{event}/pace:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: getEventPace
      tags: [Events]
      summary: How fast this night is selling, and what happens to the people who look at it
      description: |
        Requires `events.view`. The takings inside the same answer require `reports.orders.view`
        as well, and are **left out entirely** for somebody who does not hold it: `currency` comes
        back null, and neither the curve's days nor the funnel carry an `amount`. Absent rather
        than zero, because a zero is a number somebody goes on to add up.

        Two honesties worth repeating from the source, because a number nobody can explain is worse
        than no number:

        - The curve counts seats that are **still** sold. A refund a fortnight later quietly takes
          a seat back out of the day it was bought on. That is the right way round for "how full is
          this night going to be", which is what the curve is read for.
        - `sells_out_on` and `projected_sold` are arithmetic, not a forecast: they extend the last
          week's rate in a straight line, which is exactly wrong for a run that sells out in its
          final three days. `sells_out_on` is null when the rate is zero and null when the line
          lands after the doors — both of which mean "it will not", and neither of which is a date.

        Every figure but one is derived from rows that already exist. The exception is how many
        people looked, which nothing could reconstruct afterwards and which is counted as it
        happens: per event, per day, per source — never per visitor. There is no cookie, no
        identifier and nothing to erase under a subject access request.
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 180, default: 30 }
          description: How many days of history to answer with, ending today.
      responses:
        "200":
          description: The curve, the rate and the funnel
          content:
            application/json:
              schema:
                type: object
                properties:
                  currency:
                    type: [string, "null"]
                    description: Null where the caller may not see the takings.
                  timezone:
                    type: string
                    description: >-
                      The night's own timezone, which is the frame the days are bucketed in: an
                      organiser comparing Tuesday with Wednesday means their Tuesday.
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  curve:
                    type: array
                    description: One entry per day, with no gaps — a chart missing its quiet days reads as a busier week than it was.
                    items:
                      type: object
                      properties:
                        day: { type: string, format: date }
                        places: { type: integer }
                        sold_so_far:
                          type: integer
                          description: The night's running total, including everything sold before the window opened.
                        views: { type: integer }
                        views_by_source:
                          type: object
                          additionalProperties: { type: integer }
                        amount:
                          type: integer
                          description: Only present with `reports.orders.view`.
                  pace:
                    type: object
                    properties:
                      capacity: { type: integer }
                      sold: { type: integer }
                      remaining: { type: integer }
                      sold_share: { type: number }
                      daily:
                        type: number
                        description: Places a day over the last week, to one decimal place.
                      days_counted: { type: integer }
                      days_to_doors: { type: [integer, "null"] }
                      sells_out_on: { type: [string, "null"], format: date }
                      projected_sold: { type: [integer, "null"] }
                      sold_out: { type: boolean }
                  funnel:
                    type: object
                    description: >-
                      Looked → basket → checkout → bought. The steps are deliberately not the same
                      kind of thing, and nothing follows a person from one to the next: somebody who
                      reloads the page has looked twice.
                    properties:
                      looked: { type: integer }
                      baskets: { type: integer }
                      checkouts: { type: integer }
                      bought: { type: integer }
                      basket_rate: { type: [number, "null"] }
                      checkout_rate: { type: [number, "null"] }
                      buy_rate: { type: [number, "null"] }
                      overall_rate:
                        type: [number, "null"]
                        description: Null rather than zero where the step above it saw nobody — "nobody bought" and "nobody looked" are different things to be told.
                      amount:
                        type: integer
                        description: Only present with `reports.orders.view`.
        "403": { $ref: "#/components/responses/Forbidden" }

  /events/{event}/quotas:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: getEventQuotas
      tags: [Events]
      summary: How much of this night each channel may sell
      description: |
        Requires `pricing.manage`. A channel is an API client — the hosted site has one, a
        WooCommerce shop has one, the box office has one — so a quota hangs off that and nothing new
        has to be invented to name a channel.

        Every channel is listed, including the ones with no limit: an organiser deciding whether to
        promise an agent four hundred needs to see what the website is already doing. `taken` is
        counted on every read — live holds plus live allocations, in **places** rather than rows,
        because a standing area sold four at a time is four places and a quota that counted it as
        one would let an agent sell a stadium.
      responses:
        "200":
          description: Every channel, its promise and its progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ChannelQuota" }
        "403": { $ref: "#/components/responses/Forbidden" }

    put:
      operationId: setEventQuotas
      tags: [Events]
      summary: Promise each channel a share of this night
      description: |
        Requires `pricing.manage`. A PUT of the whole set rather than a patch per channel, for the
        same reason the prices are: partial edits across a set of limits are where "the agent still
        has last season's allocation" comes from.

        A channel sent with `places: null`, or left out of the payload altogether, has no limit any
        more — which is the only way "that allocation is finished with" can be said. A quota against
        a client belonging to another account is ignored rather than obeyed.

        The limit is enforced when a basket is made, inside the hold's own transaction and after the
        advisory lock on the event: checked before it, it would be a suggestion, and two agents'
        baskets would both fit inside the last four places.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quotas]
              properties:
                quotas:
                  type: array
                  items:
                    type: object
                    required: [api_client_id, places]
                    properties:
                      api_client_id: { type: string, format: uuid }
                      places:
                        type: [integer, "null"]
                        minimum: 0
                        description: "Null means no limit, and is stored as no row at all."
                      note: { type: [string, "null"], maxLength: 160 }
      responses:
        "200":
          description: The set as it now stands
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ChannelQuota" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /events/{event}/resale:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: getEventResaleListings
      tags: [Events]
      summary: Seats buyers have offered back to the public
      description: |
        Requires `orders.view`. A listing is a buyer saying "somebody else may have my seat, at what
        I paid for it" — and while it is open the seat is *offered* without being taken away: the
        allocation stays exactly where it is, and the swap happens in one transaction at the moment
        another buyer pays.

        There is no endpoint that creates a listing on somebody's behalf, and there will not be one:
        listing a ticket is the ticket holder's decision about their own property. Nor is there a
        price on it. A seller who could name their own price would make this a touting platform with
        better paperwork.
      responses:
        "200":
          description: Every listing for this night, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  open: { type: integer, description: "How many are on offer right now." }
                  sold: { type: integer, description: "How many have changed hands." }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ResaleListing" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /events/{event}/resale/{listing}:
    parameters:
      - { $ref: "#/components/parameters/EventId" }
      - name: listing
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The listing to take off sale.
    delete:
      operationId: withdrawResaleListing
      tags: [Events]
      summary: Take a listing back off sale
      description: |
        Requires `orders.refund`, which is where undoing something a buyer did to their own booking
        belongs — usually because they have rung up to say they can come after all.

        Nothing is given back and nothing is taken away: the seat was the seller's the whole time it
        sat there, so this only stops it being offered. A listing that has already sold cannot be
        withdrawn, because the seat now belongs to somebody else — and neither can one somebody has
        in a live basket, because taking it back mid-checkout would leave that buyer paying for a
        seat the database will refuse them. Baskets last minutes; the answer is to wait for it.
      responses:
        "200":
          description: The listing, now withdrawn
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      state: { type: string, enum: [withdrawn] }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /events/{event}/queue:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: getEventQueue
      tags: [Events]
      summary: The door on a big sale, live
      description: |
        Requires `events.view`. The room itself is switched on and sized on the event, beside the
        sale times it belongs with; this is the number an organiser watches at ten o'clock on the
        morning of an onsale.

        Reading it **turns the handle**: lapsed admissions are swept and the next people are let in.
        That is deliberate. The alternative is a cron job that leaves the room half empty for
        fifty-nine seconds out of every minute of the busiest hour of the year, and an organiser
        refreshing this is another pair of hands on the door.

        `inside` and `waiting` are counted, never read off a column — the same shape as a seat's
        availability. `guarded` is false on a night with no room, and every other number is zero.
      responses:
        "200":
          description: How the queue stands
          content:
            application/json:
              schema:
                type: object
                properties:
                  guarded: { type: boolean, description: "Whether this night has a door at all." }
                  open:
                    type: boolean
                    description: >-
                      Whether the doors have opened. Before they do, everybody waiting is in a
                      lobby with no place — the order is drawn when the sale starts, so arriving
                      early is worth nothing.
                  waiting: { type: integer }
                  inside: { type: integer }
                  capacity:
                    type: integer
                    description: "How many buyers may be choosing at once. Not how many seats there are."
                  minutes:
                    type: integer
                    description: "How long an admission lasts before the place is given away."
                  opens_at: { type: [string, "null"], format: date-time }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events/{event}/stats:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: getEventStats
      tags: [Events]
      summary: Inventory, sales and check-in counters
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventStats" }

  /events/{event}/checkins:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: listEventCheckins
      tags: [Events]
      summary: Check-in log
      parameters:
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Checkin" }

  /embed/events/{public_id}:
    parameters: [ { $ref: "#/components/parameters/PublicId" } ]
    get:
      operationId: getEmbedEvent
      tags: [Embed]
      summary: Public event descriptor for the widget
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbedEvent" }
        "404": { $ref: "#/components/responses/NotFound" }

  /embed/events/{public_id}/seat-map:
    parameters: [ { $ref: "#/components/parameters/PublicId" } ]
    get:
      operationId: getEmbedSeatMap
      tags: [Embed]
      summary: Geometry of the event's published map version
      description: Cacheable and immutable; keyed by version id. Contains no availability data.
      security: []
      responses:
        "200":
          description: OK
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  seat_map_version_id: { type: string, format: uuid }
                  geometry: { $ref: "#/components/schemas/Geometry" }

  /embed/events/{public_id}/availability:
    parameters: [ { $ref: "#/components/parameters/PublicId" } ]
    get:
      operationId: getEmbedAvailability
      tags: [Embed]
      summary: Seat availability, optionally incremental
      security: []
      parameters:
        - name: since
          in: query
          description: Cursor from a previous response; returns only seats changed since then.
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Availability" }

  /embed/events/{public_id}/holds:
    parameters: [ { $ref: "#/components/parameters/PublicId" } ]
    post:
      operationId: createHold
      tags: [Embed]
      summary: Hold seats for a bounded time
      security: []
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              description: At least one of `seat_ids` or `areas` must be present.
              properties:
                seat_ids:
                  type: array
                  maxItems: 20
                  items: { type: string, format: uuid }
                areas:
                  type: object
                  description: |
                    Standing room and whole tables, asked for by quantity: capacity object id to
                    number of places. Counted against the same per-order limit as named seats.
                  additionalProperties: { type: integer, minimum: 1 }
                seat_types:
                  type: object
                  description: |
                    Who each seat is for: seat id to ticket type id. Seats left out are sold at the
                    event's default type, so a caller that has never heard of concessions keeps
                    selling full-price tickets and does not have to be taught about them.

                    A type belonging to another event, or one that is hidden, is refused before any
                    seat is locked.
                  additionalProperties: { type: string, format: uuid }
                area_types:
                  type: object
                  description: |
                    The same for standing room, where a type is a share of an area's quantity:
                    capacity object id to (ticket type id to number of places). The server re-adds
                    the parts and checks the sum against what the area has left, so a request
                    cannot claim one number and mean another.
                  additionalProperties:
                    type: object
                    additionalProperties: { type: integer, minimum: 1 }
                best_available:
                  type: object
                  description: |
                    "Four together, please" — the commonest thing anybody asks a box office, and a
                    puzzle rather than a purchase on a plan that is three-quarters full. Sent
                    instead of `seat_ids`: the server chooses and holds in one movement, because a
                    suggestion the buyer has to confirm is a suggestion somebody else can take in
                    between.

                    Together means physically adjacent, not merely in the same row. What "best"
                    means is the organiser's own price list — they ranked their seats when they
                    priced them — and nothing is invented on top of it. Wheelchair spaces are never
                    handed out this way: they are a need rather than a preference.

                    Refused with `no_seats_together`, whose details name the largest group that
                    could be had, so a client can offer a number instead of a shrug.
                  required: [quantity]
                  properties:
                    quantity: { type: integer, minimum: 1 }
                    max_amount:
                      type: [integer, "null"]
                      description: "The most the buyer will pay per seat, in minor units."
                    zone_key: { type: [string, "null"] }
                    section_key: { type: [string, "null"] }
                    prefer:
                      type: string
                      enum: [best, cheapest]
                      default: best
                    ticket_type_id:
                      type: [string, "null"]
                      format: uuid
                      description: "One type for the whole group; nobody asks for four together and a concession in the middle."
                entry_slot_id:
                  type: [string, "null"]
                  format: uuid
                  description: |
                    Which arrival window, on an event that sells timed entry. Required there and
                    refused everywhere else: a slot silently dropped would print a ticket with no
                    arrival time on it and nobody would know why.

                    Refused with `entry_slot_required`, `unknown_entry_slot`, `entry_slot_closed`
                    or `entry_slot_full` before any seat is locked, and re-checked under a lock
                    while the booking is made — the second answer is the one that counts.
                session_id:
                  type: string
                  description: Opaque per-browser identifier, used for rate limiting and re-hold.
      responses:
        "201":
          description: Held
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Hold"
                  - type: object
                    properties:
                      cart_url:
                        type: [string, "null"]
                        description: |
                          Where to send the buyer to pay: the organiser's own hosted checkout,
                          carrying this hold's token and nothing else. It is null when the
                          organiser has no site on the internet yet — the seats are still held, and
                          a widget that has nowhere to send anybody says so rather than navigating
                          to nothing. A shop that made this hold has its own cart and ignores it.
        "409":
          description: One or more seats, or an area, are no longer available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeatUnavailableError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /embed/holds/{token}:
    parameters: [ { $ref: "#/components/parameters/HoldToken" } ]
    delete:
      operationId: releaseHold
      tags: [Embed]
      summary: Release a hold
      security: []
      responses:
        "204": { description: Released }
        "404": { $ref: "#/components/responses/NotFound" }

  /embed/holds/{token}/extend:
    parameters: [ { $ref: "#/components/parameters/HoldToken" } ]
    patch:
      operationId: extendHold
      tags: [Embed]
      summary: Extend a hold's TTL
      description: Bounded by `max_extends`; a hold cannot be extended after it has expired.
      security: []
      responses:
        "200":
          description: Extended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hold" }
        "409": { $ref: "#/components/responses/Conflict" }

  /embed/holds/{token}/validate:
    parameters: [ { $ref: "#/components/parameters/HoldToken" } ]
    post:
      operationId: validateHold
      tags: [Embed]
      summary: Re-check a hold before an order is created
      security: []
      responses:
        "200":
          description: Hold state
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  reason:
                    type: [string, "null"]
                    enum: [expired, released, converted, unknown, null]
                  hold: { $ref: "#/components/schemas/Hold" }

  /integrations/woocommerce/orders:
    post:
      operationId: registerOrder
      tags: [WooCommerce]
      summary: Register a WooCommerce order against a hold
      security:
        - apiKeyAuth: []
          hmacSignature: []
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_order_id, hold_token]
              properties:
                external_order_id: { type: string, maxLength: 100 }
                hold_token: { type: string }
                buyer:
                  $ref: "#/components/schemas/Buyer"
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Already registered (idempotent replay)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalOrder" }
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalOrder" }
        "409": { $ref: "#/components/responses/Conflict" }

  /integrations/woocommerce/orders/{external_order_id}:
    parameters: [ { $ref: "#/components/parameters/ExternalOrderId" } ]
    get:
      operationId: getOrder
      tags: [WooCommerce]
      summary: Read the SaaS view of an order (used by reconciliation)
      security:
        - apiKeyAuth: []
          hmacSignature: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalOrder" }
        "404": { $ref: "#/components/responses/NotFound" }

  /integrations/woocommerce/orders/{external_order_id}/confirm:
    parameters: [ { $ref: "#/components/parameters/ExternalOrderId" } ]
    post:
      operationId: confirmOrder
      tags: [WooCommerce]
      summary: Convert the hold into allocations and issue tickets
      description: |
        Exactly-once. Retrying with the same `Idempotency-Key` — or simply calling again for an
        order already confirmed — returns the same allocations and tickets and creates nothing new.
      security:
        - apiKeyAuth: []
          hmacSignature: []
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                paid_at: { type: string, format: date-time }
                buyer: { $ref: "#/components/schemas/Buyer" }
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalOrder" }
        "409":
          description: Hold expired, or the order is in a state that cannot be confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /integrations/woocommerce/orders/{external_order_id}/cancel:
    parameters: [ { $ref: "#/components/parameters/ExternalOrderId" } ]
    post:
      operationId: cancelOrder
      tags: [WooCommerce]
      summary: Release the hold for a failed, cancelled or deleted order
      security:
        - apiKeyAuth: []
          hmacSignature: []
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, enum: [failed, cancelled, deleted, expired] }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalOrder" }

  /integrations/woocommerce/orders/{external_order_id}/refund:
    parameters: [ { $ref: "#/components/parameters/ExternalOrderId" } ]
    post:
      operationId: refundOrder
      tags: [WooCommerce]
      summary: Void tickets and apply the event's seat release policy
      security:
        - apiKeyAuth: []
          hmacSignature: []
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                seat_ids:
                  type: array
                  description: Omit for a full refund.
                  items: { type: string, format: uuid }
                reason: { type: string }
      responses:
        "200":
          description: Refunded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalOrder" }

  /tickets/{ticket}:
    parameters:
      - name: ticket
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getTicket
      tags: [Tickets]
      summary: Read a ticket
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "404": { $ref: "#/components/responses/NotFound" }

  /orders:
    get:
      operationId: listOrders
      tags: [Orders]
      summary: Every booking, however it was bought
      description: |
        The box office's own list. `q` searches the reference, the buyer's name and their email —
        the three things somebody at a window is holding.

        Requires `orders.view`. Refunding was reachable only over the signed integration API before
        this, which is the right answer for a shop that owns the money and no answer at all for an
        organiser selling from their own site.
      parameters:
        - name: event_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, cancelled, refunded, partially_refunded]
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PanelOrder" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /orders/{order}:
    parameters:
      - name: order
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getOrderFromPanel
      tags: [Orders]
      summary: One booking, with its seats and what the buyer was told
      description: >
        The seats and their tickets, and the delivery log for this order — because the question a
        box office is actually asked is "did they get it", and the answer is a row rather than an
        inference about whether a provider was up.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanelOrderDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /orders/{order}/refund:
    parameters:
      - name: order
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: refundOrderFromPanel
      tags: [Orders]
      summary: Refund all of a booking, or the seats named
      description: |
        Requires `orders.refund`. The seats go back on sale (or are held back, per the event's
        refund policy) and the tickets are voided.

        **This does not move money**, and does not pretend to: the organiser refunds where they
        took the payment. A platform that marked an order refunded while the card was never
        credited would be worse than one that says plainly which half it did.

        Omitting `seat_ids` refunds everything, which is also the only way to refund a standing
        place — those have no seat id to name.

        `as_credit` is the one thing here that *does* move money, and it moves it inwards: instead
        of the card, the buyer is given credit to spend on this account, issued for what was
        actually charged — the total less anything a voucher already settled. It needs
        `vouchers.manage` as well, applies only to a whole booking, and the buyer has to have agreed
        to it: credit is not the same as a refund, and it is not the organiser's choice alone.

        Voucher money on a fully refunded booking goes back to the voucher regardless, because it
        was never the organiser's to keep.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                seat_ids:
                  type: array
                  items: { type: string, format: uuid }
                reason: { type: string, maxLength: 200 }
                as_credit:
                  type: boolean
                  description: >-
                    Give the money back as account credit rather than to the card. Whole bookings
                    only; requires `vouchers.manage`.
      responses:
        "200":
          description: Refunded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanelOrder" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Credit was asked for on a booking with no email address to give it to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orders/{order}/cancel:
    parameters:
      - name: order
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelOrderFromPanel
      tags: [Orders]
      summary: Cancel a booking nobody paid for
      description: >
        Requires `orders.refund`. Nothing was paid, so nothing is refunded: the held seats go back
        on sale. Calling it on an order that is already cancelled or refunded answers with its
        current state rather than failing.
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanelOrder" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /orders/{order}/resend:
    parameters:
      - name: order
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: resendOrderTickets
      tags: [Orders]
      summary: Send the buyer their tickets again
      description: |
        Requires `tickets.release`, because it necessarily kills the codes that were emailed — the
        platform keeps a hash of those and cannot hand them back — and that is the same power.

        Every ticket still `issued` gets a new code; used and voided ones are left alone. Audited
        as `order.tickets_resent`.
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: integer }
                  to: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /discounts:
    get:
      operationId: listDiscounts
      tags: [Discounts]
      summary: Every discount code this account has
      description: |
        Requires `discounts.manage`. `live` is computed, not stored: a code whose status says
        `active` but whose end date has passed takes nothing off anything, and reporting it as
        active is how an organiser spends an afternoon wondering why nobody can use it.
      parameters:
        - name: event_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [active, paused] }
        - name: q
          in: query
          description: Matches the code or its description.
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: The codes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/DiscountCode" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createDiscount
      tags: [Discounts]
      summary: Make a code
      description: |
        The code is normalised — trimmed and upper-cased — so `earlybird` and ` EarlyBird ` are one
        code and not three near-misses. A percentage above 100 and a fixed amount without a
        currency are both refused: the first is a payment to the buyer, the second would match
        every currency, and nothing in this system converts one currency into another.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscountCodeWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscountCode" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: An account already has a code with that name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /discounts/suggest:
    get:
      operationId: suggestDiscountCode
      tags: [Discounts]
      summary: A code nobody has to invent
      description: |
        Eight characters from an alphabet with no O and no I, checked against this account's
        existing codes. It is a suggestion, not a reservation: nothing is written.
      responses:
        "200":
          description: A free code
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }

  /discounts/{discount}:
    parameters:
      - name: discount
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getDiscount
      tags: [Discounts]
      summary: One code, and who has used it
      responses:
        "200":
          description: The code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscountCodeDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateDiscount
      tags: [Discounts]
      summary: Change a code, or pause it
      description: |
        `code` is ignored here. Renaming a code would break every poster it is printed on and leave
        its redemptions pointing at a name that never existed, so pausing is the way to stop one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscountCodeWrite" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscountCode" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      operationId: deleteDiscount
      tags: [Discounts]
      summary: Delete a code that has never been used
      description: |
        A code that has paid for an order cannot be deleted — that order would be left at a price
        with no reason beside it. `discount_in_use` says so; pause it instead.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The code has been used
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /customers/{customer}/personal-data:
    parameters:
      - name: customer
        in: path
        required: true
        description: The SHA-256 of the buyer's address, as the directory reports it.
        schema: { type: string }
    get:
      operationId: exportPersonalData
      tags: [Customers]
      summary: Everything held about one person
      description: |
        Requires `account.manage`, not `orders.view`: a box office needs to find a booking, and this
        is every address, answer and message in one document — a different thing to be trusted with.

        Deliberately not a summary. The point of the exercise is that somebody can see what is
        held, so this returns the rows themselves: every order, every seat, every answer they typed,
        every message sent to them and whether it arrived. The export is audited.
      responses:
        "200":
          description: The data
          content:
            application/json:
              schema:
                type: object
                properties:
                  exported_at: { type: string, format: date-time }
                  person: { type: object }
                  orders: { type: array, items: { type: object } }
                  answers: { type: array, items: { type: object } }
                  messages: { type: array, items: { type: object } }
                  waiting_lists: { type: array, items: { type: object } }
                  tickets_given_away: { type: array, items: { type: object } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /customers/{customer}/erase:
    parameters:
      - name: customer
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: erasePerson
      tags: [Customers]
      summary: Take the person out of the record and leave the record
      description: |
        Requires `account.manage`.

        Not deletion. The name, the address, the phone number, the invoice details and everything
        they typed at a checkout are removed; the amounts, the dates, the seats and the tickets
        stay, attached to nobody. An organiser still has to be able to tell a tax authority what
        last March came to, and "somebody asked us to delete it" is not an answer a tax authority
        takes.

        The address is nulled rather than replaced with a placeholder, so an erased buyer falls out
        of the customer directory instead of becoming one anonymous person who bought forty times.
        `confirm` must be the literal word `erase`: this cannot be undone, and a confirmation
        dialogue is not a decision.

        The audit entry names no address — a log recording who was erased would be a list of
        exactly the people who asked not to be on one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, enum: [erase] }
      responses:
        "200":
          description: What was changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  erased:
                    type: object
                    additionalProperties: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /events/{event}/counter:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: getCounter
      tags: [Box office]
      summary: The hall as somebody at a window needs it
      description: |
        Requires `orders.sell`. Every seat in the published map, with what it costs and whether it
        can be sold right now. Seats already sold or in somebody's cart are returned too, marked as
        such: a clerk asked for "A5" needs to be told it has gone, not left to wonder why it is
        missing from a list.

        This is the one hall that includes house seats. A seat blocked with a label is being kept
        for somebody and the person who hands it over works at this window, so it is reported
        `available` here with `held_for` set. A seat blocked without a label is nobody's to sell.
      responses:
        "200":
          description: The hall
          content:
            application/json:
              schema:
                type: object
                properties:
                  currency: { type: string }
                  sections:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        name: { type: string }
                        rows:
                          type: array
                          items:
                            type: object
                            properties:
                              key: { type: string }
                              name: { type: string }
                              seats:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id: { type: string, format: uuid }
                                    label: { type: string }
                                    accessible: { type: boolean }
                                    state: { type: string }
                                    amount: { type: [integer, "null"] }
                                    held_for:
                                      type: [string, "null"]
                                      description: >-
                                        Who this seat is being kept for. A **house seat** is off
                                        public sale and on sale here, so it comes back
                                        `available` to this endpoint and `blocked` to every
                                        public one. Null on almost every chair.
                  areas:
                    type: array
                    items: { type: object }
                  ticket_types:
                    type: array
                    items: { $ref: "#/components/schemas/TicketType" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /events/{event}/sell:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    post:
      operationId: sellAtCounter
      tags: [Box office]
      summary: Sell, reserve or give away seats at the window
      description: |
        Requires `orders.sell`.

        Not a second order path. The counter makes a hold through the same service — the same
        locking, the same price snapshot, the same refusal when somebody online got there first —
        and confirms it through the same order lifecycle, so a seat sold here is a seat sold, with
        a ticket, a QR code and a row in every report. What differs is only what is written down
        about the money.

        Held and confirmed in one step, because there is nobody to come back later: a window sale
        that left a hold behind would be a seat locked for ten minutes because the clerk was
        interrupted.

        `payment` says which of three things happened. `paid` means the money was taken elsewhere —
        cash, or the venue's own card terminal. `owed` means they will pay on the night, and the
        ticket is issued anyway because it is a reservation. `comp` means it is a gift and the
        order is worth nothing, because a report that counted free seats as revenue would overstate
        the evening by exactly the generosity of the house.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buyer, payment]
              properties:
                seat_ids:
                  type: array
                  items: { type: string, format: uuid }
                areas:
                  type: object
                  additionalProperties: { type: integer, minimum: 1 }
                seat_types:
                  type: object
                  additionalProperties: { type: string, format: uuid }
                area_types:
                  type: object
                  additionalProperties:
                    type: object
                    additionalProperties: { type: integer, minimum: 1 }
                entry_slot_id:
                  type: [string, "null"]
                  format: uuid
                  description: >-
                    Which arrival window. The counter sells timed entry too: somebody walking up at
                    ten past ten still has to be put in a window, and the window still has to have
                    room.
                buyer:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string, maxLength: 120 }
                    email: { type: [string, "null"], format: email }
                    phone: { type: [string, "null"] }
                payment: { type: string, enum: [paid, owed, comp] }
                method:
                  type: [string, "null"]
                  enum: [cash, card, transfer, null]
                  description: >-
                    How it was paid for, which is a different question from whether it was. Only
                    `cash` reaches the drawer, and a till that could not tell a card from a note
                    would report every honest evening several hundred short. Defaults to `cash` on
                    a `paid` sale, because at a window it usually is; ignored on a comp or an
                    invoice, neither of which is paid now.
                note: { type: [string, "null"], maxLength: 200 }
                send_tickets:
                  type: boolean
                  description: Refused without an email address to send them to.
      responses:
        "201":
          description: Sold
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  reference: { type: string }
                  status: { type: string }
                  total_amount: { type: integer }
                  currency: { type: string }
                  payment: { type: string, enum: [paid, owed, comp] }
                  method: { type: [string, "null"], enum: [cash, card, transfer, null] }
                  shift_id:
                    type: [string, "null"]
                    format: uuid
                    description: Which till it was rung into, where the seller had one open.
                  seats: { type: integer }
                  tickets_sent: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Somebody else took one of those seats first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /events/{event}/door-list:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: getDoorList
      tags: [Door]
      summary: Everybody expected tonight
      description: |
        Requires `checkins.view` and returns no money at all: the door needs names and seats, and a
        volunteer on the door does not need to know what the evening took.

        One row per ticket rather than per booking — a family of four arrives one at a time, and a
        list that could only tick off whole bookings would have somebody doing arithmetic at the
        door while a queue formed. Voided tickets are absent: somebody holding one is holding a
        ticket that was cancelled.

        `q` matches a name, an email, a booking reference or a seat like "Stalls A 5", because
        those are the four things somebody at a door is handed.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: state
          in: query
          description: "`out` for those not in yet, `in` for those already through."
          schema: { type: string, enum: [in, out] }
        - name: entry_slot_id
          in: query
          description: >-
            One arrival window, on a timed-entry event. The ten o'clock queue is one list and the
            eleven o'clock is another, which is how a door actually works.
          schema: { type: string, format: uuid }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 10, maximum: 200, default: 50 }
      responses:
        "200":
          description: The list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/DoorListRow" }
                  meta:
                    type: object
                    properties:
                      page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
                      last_page: { type: integer }
                      expected: { type: integer, description: "Tickets for tonight, whatever the filter." }
                      arrived: { type: integer }
                  event:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                      starts_at: { type: [string, "null"], format: date-time }
                  entry_slots:
                    type: array
                    description: >-
                      The windows to read the night by. Empty on an event that has none, and the
                      screen then offers no filter rather than an empty one.
                    items: { $ref: "#/components/schemas/EntrySlot" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /events/{event}/door-list/export:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: exportDoorList
      tags: [Door]
      summary: The same list as a file
      description: |
        Requires `checkins.view`. Not paginated — a door list that stops at fifty is a door list
        that turns people away — and streamed in chunks, because a sold-out arena is twenty
        thousand rows and holding them in memory to write a file is how an export becomes an
        outage. The export is audited.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: state
          in: query
          schema: { type: string, enum: [in, out] }
        - name: entry_slot_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: CSV, with a byte-order mark so a spreadsheet opens Persian headings as text
          content:
            text/csv:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }

  /settlement:
    get:
      operationId: getSettlement
      tags: [Settlement]
      summary: What the organiser is owed, and what the platform kept
      description: |
        Requires `reports.orders.view` — the same permission as every other screen that shows
        money, so a volunteer given the door list still cannot see the takings.

        Nothing here is recomputed from a live event. The arithmetic of a booking was frozen onto
        the order at the moment it was paid, and this reads that back: an organiser who raises
        their booking fee in March must not find that February settles differently than it did in
        February.

        Rows are per event and totals are per currency. Events carry their own currency, and a
        column that added rial to euro would be a number nobody could bank.

        Two ways to cut a period, and they answer different questions. `paid` is the bank's view —
        when the money moved — and settles a payout. `event` is the venue's view, which nights the
        takings belong to, and settles a run.

        A full refund returns everything the buyer paid, the fee and the tax with it. A part refund
        returns the seats named and nothing else: whether a booking fee survives a partial refund
        is the organiser's own refund policy, and the platform does not invent an answer to it.
        Commission is charged on what the organiser keeps, never on the tax — that money is
        collected on behalf of a tax authority and is not theirs to share.
      parameters:
        - { $ref: "#/components/parameters/SettlementFrom" }
        - { $ref: "#/components/parameters/SettlementTo" }
        - { $ref: "#/components/parameters/SettlementEvent" }
        - { $ref: "#/components/parameters/SettlementBasis" }
      responses:
        "200":
          description: The settlement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settlement" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /settlement/export:
    get:
      operationId: exportSettlement
      tags: [Settlement]
      summary: The settlement as a spreadsheet
      description: |
        Requires `reports.orders.view`. One row per event, with amounts as decimals and a full
        stop rather than in minor units or in the reader's own numerals: this file is opened by
        accounting software, and a localised amount is text rather than a number. The export is
        audited.
      parameters:
        - { $ref: "#/components/parameters/SettlementFrom" }
        - { $ref: "#/components/parameters/SettlementTo" }
        - { $ref: "#/components/parameters/SettlementEvent" }
        - { $ref: "#/components/parameters/SettlementBasis" }
      responses:
        "200":
          description: CSV, with a byte-order mark so a spreadsheet opens Persian headings as text
          content:
            text/csv:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }

  /settlement/statement:
    get:
      operationId: printSettlementStatement
      tags: [Settlement]
      summary: The statement a venue is sent
      description: |
        Requires `reports.orders.view`. The same figures as the screen, as a document that stands
        on its own — the period it covers, every event in it, and the arithmetic that reaches the
        figure at the bottom, in the reader's language and currency. Printing it is audited.
      parameters:
        - { $ref: "#/components/parameters/SettlementFrom" }
        - { $ref: "#/components/parameters/SettlementTo" }
        - { $ref: "#/components/parameters/SettlementEvent" }
        - { $ref: "#/components/parameters/SettlementBasis" }
      responses:
        "200":
          description: A PDF statement
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Forbidden" }

  /events/{event}/waiting-list:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: getWaitingList
      tags: [Waiting list]
      summary: Who is waiting for a sold-out night
      description: |
        Requires `orders.view` — these are names and addresses of people who have bought nothing
        yet, which is customer data.

        `summary.free_places` is asked of the same code the site asks, so the number here and the
        number a buyer sees cannot disagree. `waiting_places` is what those people actually want,
        which is not the same as how many of them there are: eleven people wanting twenty-three
        places is the sentence an organiser is trying to form.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [waiting, notified, converted, left] }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 10, maximum: 200, default: 50 }
      responses:
        "200":
          description: The queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WaitingListEntry" }
                  meta:
                    type: object
                    properties:
                      page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
                      last_page: { type: integer }
                  summary:
                    type: object
                    properties:
                      waiting: { type: integer }
                      waiting_places: { type: integer }
                      notified: { type: integer }
                      left: { type: integer }
                      free_places: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

  /events/{event}/waiting-list/notify:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    post:
      operationId: notifyWaitingList
      tags: [Waiting list]
      summary: Tell the next people in line now
      description: |
        Requires `messages.send`, because it writes to people. For the organiser who has just
        released a block of house seats and does not want to wait for the scheduled round.

        Nobody is held a seat. The message says the sale is open again and it is first come first
        served — holding seats for somebody who may never open the email is how a sold-out night
        ends up half empty. Places already promised to somebody whose window is still open are
        subtracted first, so one returned seat is not offered to the whole queue at once.
      responses:
        "200":
          description: How many were told
          content:
            application/json:
              schema:
                type: object
                properties:
                  told: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: The account has no live website for the message to link to
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /customers:
    get:
      operationId: listCustomers
      tags: [Customers]
      summary: Who has bought, and how much
      description: |
        Derived from the orders rather than from a customers table, so the list cannot drift from
        what was actually sold. A person is one email address, lowercased and trimmed; `id` is the
        SHA-256 of that address, because an email in a path is an email in an access log.

        Orders with no email address belong to nobody and are not listed. `meta.without_email`
        counts them, so a screen can say so instead of quietly disagreeing with the orders report.

        `spend` is every currency this person has paid in — there is no rate to add them with.
        `spend_in_currency` is the same figure in `meta.currency` alone, and it is what `sort=spend`
        orders by. Both count only orders where money arrived: confirmed and partly refunded.

        Requires `orders.view`.
      parameters:
        - name: q
          in: query
          description: Matches the buyer's name, email or phone, or the order reference.
          schema: { type: string, maxLength: 120 }
        - name: event_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, cancelled, refunded, partially_refunded]
        - name: currency
          in: query
          description: Which currency the sortable spend column is counted in.
          schema: { type: string, minLength: 3, maxLength: 3 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [recent, oldest, orders, spend, name]
            default: recent
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Customer" }
                  meta:
                    type: object
                    properties:
                      page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
                      last_page: { type: integer }
                      currency: { type: [string, "null"] }
                      currencies:
                        type: array
                        items: { type: string }
                      without_email: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /customers/export:
    get:
      operationId: exportCustomers
      tags: [Customers]
      summary: The customer list as a CSV
      description: |
        The same filters as the list, streamed as a file and capped at twenty thousand people.
        Audited as `customers.exported`: this is the one request that takes every buyer's address
        out of the platform at once, and who did that is a question an organiser may have to answer
        to somebody else.

        Requires `orders.view`.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: event_id
          in: query
          schema: { type: string, format: uuid }
        - name: currency
          in: query
          schema: { type: string, minLength: 3, maxLength: 3 }
      responses:
        "200":
          description: OK
          content:
            text/csv:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }

  /customers/{customer}:
    parameters:
      - name: customer
        in: path
        required: true
        description: The SHA-256 of the buyer's normalised email address.
        schema: { type: string, pattern: "^[0-9a-f]{64}$" }
    get:
      operationId: getCustomer
      tags: [Customers]
      summary: One buyer, and every order they placed
      description: |
        Their name, address and phone as of the most recent order that filled each one in, and up
        to five hundred orders with the seats or places on each. `checked_in` counts the allocations
        on that order whose ticket has been scanned.

        Requires `orders.view`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerProfile" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tickets:
    get:
      operationId: listTickets
      tags: [Tickets]
      summary: Every ticket for one event
      description: |
        The box-office lookup. `q` searches the holder's name, the buyer's name and email, the seat,
        the order reference and the *visible prefix* of the code.

        Searching by a whole ticket token is deliberately not offered: a token is a credential, and
        a search box that accepts one is a search box that logs one.
      parameters:
        - name: event_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: status
          in: query
          schema: { type: string, enum: [issued, used, void] }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Ticket" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /tickets/{ticket}/release:
    parameters:
      - $ref: "#/components/parameters/TicketId"
    post:
      operationId: releaseTicket
      tags: [Tickets]
      summary: Void a ticket and put its seat back on sale
      description: |
        Expressed as a partial refund of the order, because voiding the ticket and freeing the seat
        have to happen together.

        A ticket that has already been scanned cannot be released — the seat is occupied, and
        selling it again would send two people to one chair.
      responses:
        "200":
          description: Released
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ticket" }
        "409":
          description: |
            `already_used` — someone has already come in on this ticket.
            `no_allocation` / `no_order` — the ticket is not attached to a seat or an order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /team:
    get:
      operationId: listTeam
      tags: [Team]
      summary: Who is in this account, who has been invited, and the roles available
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
                  invitations:
                    type: array
                    items: { $ref: "#/components/schemas/Invitation" }
                  roles:
                    type: array
                    items: { $ref: "#/components/schemas/Role" }

  /team/members/{member}:
    parameters:
      - name: member
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateMember
      tags: [Team]
      summary: Change someone's role, or suspend and restore them
      description: |
        Two rules are enforced here and both exist because of a way an account can become unusable:

        - **Nobody changes their own membership.** Without it the permission system is advice —
          anyone with `team.manage` could hand themselves everything.
        - **An account keeps at least one owner who is not suspended.** Otherwise nobody can grant
          anything ever again, and the only way out is a support ticket and a database console.

        Suspension rather than deletion, so somebody who left keeps their name on what they did.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, description: A built-in role key or one this organiser invented. }
                suspended: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "403":
          description: "`cannot_change_own_role`, or the caller lacks `team.manage`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`last_owner`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /team/invitations:
    post:
      operationId: inviteMember
      tags: [Team]
      summary: Invite somebody to this account
      description: |
        The response carries `token` in plaintext **once**, so it can be put in an email or handed
        over in person. It is stored hashed and is never returned again: an invitation link is a way
        into an account, and a leaked database should not be a set of working ones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string }
      responses:
        "201":
          description: Invited
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Invitation"
                  - type: object
                    properties:
                      token:
                        type: string
                        description: Shown on this response and never again.
        "409":
          description: "`already_a_member`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /team/invitations/{invitation}:
    parameters:
      - name: invitation
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeInvitation
      tags: [Team]
      summary: Cancel an invitation
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }

  /roles:
    get:
      operationId: listRoles
      tags: [Team]
      summary: Every role, and the catalogue of permissions they are built from
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Role" }
                  permissions:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, examples: ["orders.view"] }
                        group: { type: string, examples: ["boxoffice"] }
                        label:
                          type: string
                          description: What somebody can *do*, translated — not what the code calls it.
                  groups:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        label: { type: string }
    post:
      operationId: createRole
      tags: [Team]
      summary: Invent a role for a job this venue actually has
      description: |
        Permissions that are not in the catalogue are dropped rather than rejected, so a client
        sending a stale list still gets a working role. Reserved keys are refused outright: a
        custom role called `owner` holding five permissions would be the worst kind of surprise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, name, permissions]
              properties:
                key: { type: string, pattern: "^[a-z][a-z0-9_]*$" }
                name: { type: string, maxLength: 80 }
                permissions: { type: array, items: { type: string } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "409":
          description: "`role_exists`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`reserved_role`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /roles/{role}:
    parameters:
      - name: role
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateRole
      tags: [Team]
      summary: Rename a role or change what it holds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                permissions: { type: array, items: { type: string } }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
    delete:
      operationId: deleteRole
      tags: [Team]
      summary: Delete a role nobody holds
      description: Deleting a role somebody holds would leave them with nothing, silently.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        "409":
          description: "`role_in_use`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /overview:
    get:
      operationId: overview
      tags: [Audit]
      summary: What is selling, what is coming, and what changed
      description: |
        The panel's first screen, in one request: a screen that fanned out to six endpoints would
        settle in six stages.

        It is the only place where numbers governed by four different permissions meet, so each
        part is asked for separately rather than assembled and filtered afterwards. `money` is
        `null` without `reports.orders.view`, `door` without `checkins.view`, `activity` without
        `audit.view`, and `next[].gross_amount` follows `money`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }

  /api-clients:
    get:
      operationId: listApiClients
      tags: [Connections]
      summary: The storefronts connected to this account
      description: |
        Requires `connections.manage`. One client per shop: a WooCommerce store, a bespoke
        integration, whatever signs requests as this organiser.

        Only keys that have not been revoked are listed, and each is shown as an id, a label and a
        hint — never a secret. There is deliberately no endpoint that reads a secret back.
      responses:
        "200":
          description: The connected clients
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ApiClient" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      operationId: createApiClient
      tags: [Connections]
      summary: Connect a storefront, and issue its first key
      description: |
        Requires `connections.manage`. Creating a client issues one key with it, because a client
        with no credential cannot do anything and would only be a second step to forget.

        **The secret is in this response and in no other.** It is stored hashed; losing it means
        rotating, not recovering (threat T5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                site_url: { type: [string, "null"], format: uri, maxLength: 255 }
                allowed_origins:
                  type: array
                  description: >-
                    Origins the browser widget may be embedded on. Empty means the public embed
                    endpoints are open, which is their normal state — they hold seats and read what
                    a venue already shows publicly.
                  items: { type: string, maxLength: 255 }
      responses:
        "201":
          description: The client, with the only copy of its secret
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiClient"
                  - type: object
                    properties:
                      credentials:
                        type: object
                        properties:
                          key_id: { type: string }
                          secret:
                            type: string
                            description: "Shown once. Never retrievable again."
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api-clients/{client}/keys:
    parameters:
      - name: client
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: rotateApiKey
      tags: [Connections]
      summary: Issue another key without withdrawing the last one
      description: >-
        Requires `connections.manage`. The old key stays valid until it is revoked, so a shop can be
        updated and its signing verified before the credential it was using disappears. A rotation
        that cut the old key off at the same moment would be an outage with extra steps.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 120, default: rotated }
      responses:
        "201":
          description: The new credential
          content:
            application/json:
              schema:
                type: object
                properties:
                  key_id: { type: string }
                  secret: { type: string, description: "Shown once." }
                  note: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api-clients/{client}/keys/{keyId}:
    parameters:
      - name: client
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: keyId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: revokeApiKey
      tags: [Connections]
      summary: Withdraw a key
      description: >-
        Requires `connections.manage`. Immediate, and not reversible. Anything still signing with
        this key stops working on the next request, which is the point.
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /i18n:
    get:
      operationId: listLocales
      tags: [Localisation]
      summary: The languages this platform speaks, and which one you are getting
      description: >-
        Public, and the first thing a browser surface asks for. `current` is the language the
        request resolved to — from an explicit header, the signed-in user, the site, or
        Accept-Language, in that order (ADR-0005) — so a client can fetch the right catalogue
        without duplicating that decision.
      responses:
        "200":
          description: The menu
          content:
            application/json:
              schema:
                type: object
                properties:
                  locales:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, example: fa }
                        name: { type: string, description: "The language's name in itself." }
                        dir: { type: string, enum: [ltr, rtl] }
                  current: { type: string }
                  fallback: { type: string }

  /i18n/{locale}:
    parameters:
      - name: locale
        in: path
        required: true
        schema: { type: string, example: fa }
    get:
      operationId: getCatalogue
      tags: [Localisation]
      summary: One language's catalogue, for a browser to render from
      description: |
        Public. The same PHP catalogues the server renders sites and emails from, as JSON — there is
        no second copy in a `.js` file, because two copies of a translation is two translations and
        the wrong one is always the one nobody is looking at.

        Only the namespaces a browser surface needs are included; `mail` and the rest never leave
        the server. Cached for a day and revalidated: catalogues change on deploy, and a stale one
        shows somebody yesterday's wording, which is survivable.
      responses:
        "200":
          description: The catalogue
          content:
            application/json:
              schema:
                type: object
                properties:
                  locale: { type: string }
                  dir: { type: string, enum: [ltr, rtl] }
                  icu: { type: string, description: "The ICU locale for formatting numbers and dates." }
                  messages:
                    type: object
                    additionalProperties: true
                    description: "Namespace to nested keys."
        "404": { $ref: "#/components/responses/NotFound" }

  /audit:
    get:
      operationId: listAudit
      tags: [Audit]
      summary: Who changed what, when, and from where
      description: |
        Read-only, by construction. There is no endpoint that edits or deletes a row here and there
        will not be: an audit trail an administrator can edit is a diary, not a record.

        `changes` names the fields that moved and their before and after. Secrets never reach it —
        redaction walks the whole structure, including the `{from, to}` pair, because checking only
        the leaf would see two innocent words holding a credential.
      parameters:
        - { name: action, in: query, schema: { type: string }, description: Prefix match — `team.` finds every team action. }
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: subject_type, in: query, schema: { type: string } }
        - { name: subject_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AuditEntry" }

  /audit/facets:
    get:
      operationId: auditFacets
      tags: [Audit]
      summary: The actions and people present in this log, so filters offer real values
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions: { type: array, items: { type: string } }
                  actors:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        email: { type: string }

  /modules:
    get:
      operationId: listModules
      tags: [Modules]
      summary: Every module installed on this server, and whether this organiser has it on
      description: |
        Two different questions, and the response answers both. What is **installed** is a property
        of the deployment — an operator decides it by deploying. What is **enabled** is a property
        of this organiser.

        There is no install endpoint and there will not be one: an endpoint that changed which code
        runs would be a remote-code-execution feature (ADR-0004).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Module" }
                  points:
                    type: array
                    description: The extension points that exist. Adding one is a core change.
                    items: { type: string, enum: [payments, messaging, reports, blocks, themes, panel, events] }

  /modules/{key}:
    parameters:
      - $ref: "#/components/parameters/ModuleKey"
    get:
      operationId: getModule
      tags: [Modules]
      summary: One module, with its settings and its health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Module"
                  - type: object
                    properties:
                      health: { $ref: "#/components/schemas/ModuleHealth" }
        "404":
          description: "`module_not_installed` — not installed on this server."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      operationId: updateModule
      tags: [Modules]
      summary: Turn a module on or off, and save what it needs
      description: |
        One endpoint rather than three, because these are one decision: an organiser filling in an
        API key and switching a gateway on has done a single thing. Splitting it produces the state
        nobody wants — enabled and unconfigured, taking bookings it cannot settle.

        **Secrets.** A secret sent as the mask (`••••••••`) or as an empty string means "unchanged",
        so saving a form that displays a stored key does not wipe it. A secret is never returned;
        `values` reports the mask or null.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                settings:
                  type: object
                  additionalProperties: true
                  description: Keys the module's manifest declared. Anything else is ignored.
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Module"
                  - type: object
                    properties:
                      health: { $ref: "#/components/schemas/ModuleHealth" }
        "422":
          description: |
            `module_not_configured` — the module says it is missing something it needs, so it was
            left off rather than switched on and broken. `details.problems` says what.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`module_not_installed`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /site-themes:
    get:
      operationId: listSiteThemes
      tags: [Sites]
      summary: The themes, fonts, corner radii and block types a site can use
      description: |
        Everything the site editor needs to render its choices. The lists are closed: a theme key,
        font or block type that is not here is rejected on the way in.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  themes:
                    type: array
                    items: { $ref: "#/components/schemas/SiteTheme" }
                  fonts: { type: array, items: { type: string } }
                  radii: { type: array, items: { type: string } }
                  blocks:
                    type: array
                    items:
                      type: object
                      properties:
                        type: { type: string, enum: [heading, richText, image, buttons, eventList, eventDetail, faq, venueMap, divider, html] }
                        name: { type: string }
                        icon: { type: string }

  /sites:
    get:
      operationId: listSites
      tags: [Sites]
      summary: The organiser's hosted event sites
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Site" }
    post:
      operationId: createSite
      tags: [Sites]
      summary: Create a site
      description: |
        Creating a site provisions it: a home page, an event page, a "visiting us" page, a primary
        and a footer menu, and — if `SEATMAP_SITES_DOMAIN` is configured — a free subdomain, already
        verified. A new site is `draft` until a verified domain exists.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                theme_key: { type: string, maxLength: 40 }
                locale: { type: string, maxLength: 12 }
                timezone: { type: string }
                currency: { type: string, minLength: 3, maxLength: 3 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDetail" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /sites/{site}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    get:
      operationId: getSite
      tags: [Sites]
      summary: One site with its pages, menus and domains
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateSite
      tags: [Sites]
      summary: Rename, restyle, or publish a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                theme_key: { type: string, maxLength: 40 }
                locale: { type: string, maxLength: 12 }
                timezone: { type: string }
                currency: { type: string, minLength: 3, maxLength: 3 }
                status: { type: string, enum: [draft, live] }
                brand: { $ref: "#/components/schemas/SiteBrand" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDetail" }
        "409":
          description: "`no_verified_domain` — a site cannot go live with no address to visit."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`unknown_theme`, or an invalid field."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sites/{site}/pages:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      operationId: createSitePage
      tags: [Sites]
      summary: Add a page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, slug]
              properties:
                title: { type: string, maxLength: 160 }
                slug:
                  type: string
                  maxLength: 80
                  pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SitePage" }
        "409":
          description: "`slug_taken` — a page already uses that address."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`too_many_pages`, or an invalid slug."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sites/{site}/pages/{page}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/PageId"
    patch:
      operationId: updateSitePage
      tags: [Sites]
      summary: Edit a page's draft
      description: |
        Writes the draft only; the public site keeps showing the last published copy until
        `/publish` is called.

        Blocks are normalised here and nowhere else: unknown types are dropped, every string is
        length-capped, every URL is checked, and `html` blocks are refused unless the organiser has
        `allow_raw_html` turned on. Rendering re-validates nothing, so this is the boundary.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 160 }
                slug: { type: string, maxLength: 80 }
                blocks:
                  type: array
                  items: { $ref: "#/components/schemas/Block" }
                seo_title: { type: [string, "null"], maxLength: 160 }
                seo_description: { type: [string, "null"], maxLength: 320 }
                position: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SitePage" }
        "409":
          description: "`slug_taken`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`home_slug_fixed` — the home page lives at the root and cannot move."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteSitePage
      tags: [Sites]
      summary: Delete a page
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        "422":
          description: "`page_required` — the home and event pages are part of how the site works."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sites/{site}/pages/{page}/translations:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/PageId"
    put:
      operationId: translateSitePage
      tags: [Sites]
      summary: A page's words in another language
      description: |
        Requires `sites.manage`. One locale per call, sent whole: a patch per field across a set of
        translations is where "the Persian page still says last season" comes from.

        A translation is an **overlay**, never a second copy of the page. Only prose fields the
        block actually has are kept — the map lives with the sanitiser, so a translation cannot set
        a colour, a height or an event id in one language and not another, and a page cannot end up
        with two different shapes in two languages. Nested lists (a `buttons` block, the items of an
        `faq`) are deliberately not translatable: an overlay keyed by field cannot address a list
        item without inventing a shape for it, and a venue that needs its FAQ in two languages needs
        two FAQ blocks.

        A field left blank falls back to the original, field by field rather than page by page: a
        half-translated page is a page with some of the original language on it, which is what a
        reader would rather have than a page with holes in it. A locale whose fields are all blank
        is removed rather than stored as a row of nothing, so "is this page written in Persian" stays
        answerable by looking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              properties:
                locale: { type: string, maxLength: 12 }
                title: { type: [string, "null"], maxLength: 160 }
                seo_title: { type: [string, "null"], maxLength: 160 }
                seo_description: { type: [string, "null"], maxLength: 320 }
                blocks:
                  type: object
                  description: Block id → field → the words, for prose fields that block has.
                  additionalProperties:
                    type: object
                    additionalProperties: { type: [string, "null"] }
      responses:
        "200":
          description: The page, with what is now written in which languages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SitePage" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /sites/{site}/pages/{page}/publish:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/PageId"
    post:
      operationId: publishSitePage
      tags: [Sites]
      summary: Copy the draft over the live page
      description: The same draft/published discipline the seat maps have — visitors never see a half-finished edit.
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SitePage" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sites/{site}/menus/{key}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - name: key
        in: path
        required: true
        schema: { type: string, examples: [primary, footer] }
    put:
      operationId: updateSiteMenu
      tags: [Sites]
      summary: Replace a menu's items
      description: |
        The whole menu is sent each time rather than diffed. A menu is short, and sending the
        intended order is the only version where two editors cannot interleave into a mess.

        Items pointing at a page or event that is not this tenant's are dropped, not rejected: a
        menu cannot be aimed at another organiser's event by guessing an id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 60
                  items:
                    type: object
                    required: [label, target_type]
                    properties:
                      label: { type: string, maxLength: 60 }
                      translations:
                        type: object
                        description: >-
                          The same label in the site's other languages, keyed by locale. The words
                          in a header are the first thing a visitor reads, and were the last thing
                          on a hosted site that could not be said in their language.
                        additionalProperties: { type: [string, "null"] }
                      target_type: { type: string, enum: [page, event, url] }
                      site_page_id: { type: [string, "null"], format: uuid }
                      event_id: { type: [string, "null"], format: uuid }
                      url: { type: [string, "null"], maxLength: 400 }
                      new_tab: { type: boolean }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteMenu" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /sites/{site}/domains:
    parameters:
      - $ref: "#/components/parameters/SiteId"
    post:
      operationId: addSiteDomain
      tags: [Sites]
      summary: Point a custom domain at the site
      description: |
        The hostname is claimed but not yet served. It becomes routable only once the TXT record in
        the response is published and verification passes — otherwise anyone could claim a hostname
        they do not own and receive its traffic.

        Uniqueness is checked across every tenant, because a hostname routes globally. The conflict
        never says who holds it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname]
              properties:
                hostname: { type: string, maxLength: 253, examples: ["tickets.northgate.example"] }
      responses:
        "201":
          description: Added, pending verification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDomain" }
        "409":
          description: "`hostname_taken`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`invalid_hostname`, or `too_many_domains`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sites/{site}/domains/{domain}/verify:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/DomainId"
    post:
      operationId: verifySiteDomain
      tags: [Sites]
      summary: Check the TXT record now
      description: Runs the DNS check immediately instead of waiting for the queued one. `last_error` says why a failure failed.
      responses:
        "200":
          description: Checked — read `verified`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDomain" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sites/{site}/domains/{domain}/primary:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/DomainId"
    post:
      operationId: makeSiteDomainPrimary
      tags: [Sites]
      summary: Make this the address the site calls its own
      description: The primary domain is what canonical URLs and ticket emails use. Every other verified domain still serves the site.
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDomain" }
        "409":
          description: "`domain_unverified`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /sites/{site}/domains/{domain}:
    parameters:
      - $ref: "#/components/parameters/SiteId"
      - $ref: "#/components/parameters/DomainId"
    delete:
      operationId: deleteSiteDomain
      tags: [Sites]
      summary: Stop serving the site at this address
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: boolean }
        "409":
          description: "`primary_domain` — make another address the main one first."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /checkin/auth/token:
    post:
      operationId: pairCheckinDevice
      tags: [Check-in]
      summary: Exchange a device pairing code for a scoped scanner token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairing_code, device_name]
              properties:
                pairing_code: { type: string }
                device_name: { type: string }
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  device: { $ref: "#/components/schemas/CheckinDevice" }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/EmbedEvent" }

  /checkin/events:
    get:
      operationId: listCheckinEvents
      tags: [Check-in]
      summary: Events this device may scan
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EmbedEvent" }

  /checkin/scan:
    post:
      operationId: scanTicket
      tags: [Check-in]
      summary: Scan one QR token, atomically
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, event_id]
              properties:
                token: { type: string }
                event_id: { type: string, format: uuid }
                scanned_at: { type: string, format: date-time }
                client_scan_id: { type: string }
      responses:
        "200":
          description: Scan result — the HTTP status is 200 for every outcome; read `result`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScanResult" }

  /checkin/sync:
    post:
      operationId: syncOfflineScans
      tags: [Check-in]
      summary: Upload a batch of offline scans
      description: |
        Idempotent per `(ticket, device, client_scan_id)`. Conflicts resolve to the earliest
        `scanned_at`; later scans of the same ticket come back as `already_used` with the winner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scans]
              properties:
                scans:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [token, event_id, scanned_at, client_scan_id]
                    properties:
                      token: { type: string }
                      event_id: { type: string, format: uuid }
                      scanned_at: { type: string, format: date-time }
                      client_scan_id: { type: string }
      responses:
        "200":
          description: Per-scan results in request order
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/ScanResult" }

  /checkin/events/{event}/stats:
    parameters: [ { $ref: "#/components/parameters/EventId" } ]
    get:
      operationId: getCheckinStats
      tags: [Check-in]
      summary: Live door counters
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventStats" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Seatmap-Key
      description: Public key id of an API key. Never the secret.
    hmacSignature:
      type: apiKey
      in: header
      name: X-Seatmap-Signature
      description: |
        Requires `X-Seatmap-Timestamp` (unix seconds, ±300 s) and `X-Seatmap-Nonce`
        (unique within the window) alongside.

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 255 }
    VenueId:
      name: venue
      in: path
      required: true
      schema: { type: string, format: uuid }
    MapId:
      name: map
      in: path
      required: true
      schema: { type: string, format: uuid }
    SettlementFrom:
      name: from
      in: query
      description: "The first day of the period, inclusive. Omit for everything up to `to`."
      schema: { type: string, format: date }
    SettlementTo:
      name: to
      in: query
      description: "The last day of the period, inclusive."
      schema: { type: string, format: date }
    SettlementEvent:
      name: event_id
      in: query
      description: "One event rather than all of them."
      schema: { type: string, format: uuid }
    SettlementBasis:
      name: basis
      in: query
      description: >-
        Which date the period is cut by: `paid` is when the money moved and settles a payout,
        `event` is which nights the takings belong to and settles a run.
      schema: { type: string, enum: [paid, event], default: paid }
    EventId:
      name: event
      in: path
      required: true
      schema: { type: string, format: uuid }
    PublicId:
      name: public_id
      in: path
      required: true
      schema: { type: string }
    HoldToken:
      name: token
      in: path
      required: true
      schema: { type: string }
    ExternalOrderId:
      name: external_order_id
      in: path
      required: true
      schema: { type: string }
    TicketId:
      name: ticket
      in: path
      required: true
      schema: { type: string, format: uuid }
    SiteId:
      name: site
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageId:
      name: page
      in: path
      required: true
      schema: { type: string, format: uuid }
    DomainId:
      name: domain
      in: path
      required: true
      schema: { type: string, format: uuid }
    ModuleKey:
      name: key
      in: path
      required: true
      description: The module key with its slash written as a dot — `seatmap.offline-payments`. A slash inside a path segment is a fight with every router and proxy in between.
      schema: { type: string, pattern: "^[a-z0-9-]+\\.[a-z0-9-]+$" }

  responses:
    Forbidden:
      description: The caller's role does not carry the permission this needs
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found, or not visible to this tenant
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The request contradicts current state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Invalid payload
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    TicketReceipts:
      type: object
      description: >
        One ticket per entry, each a list of lines in the order they come off the roll. Both
        outputs are built from these, so the bytes and the browser cannot disagree about which
        seat somebody has.
      properties:
        width:
          type: integer
          enum: [58, 80]
          description: The roll width the lines were laid out for, in millimetres.
        data:
          type: array
          items:
            type: object
            properties:
              lines:
                type: array
                items:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum: [title, centre, seat, small, pair, rule, qr]
                      description: >
                        How to set the line. `title` is the event, `seat` the one line worth
                        shouting, `pair` a label and a value on one row, `rule` a dashed divider,
                        `qr` the code itself.
                    text: { type: string }
                    left: { type: string }
                    right: { type: string }
                    image:
                      type: string
                      description: >
                        The QR as an SVG data URI, on `qr` lines only. Present so a print view can
                        draw a code it cannot compute — the plain token is in `text` for anything
                        that renders its own.
    RefundRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, declined] }
        reason:
          type: [string, "null"]
          description: "The buyer's own words, where they gave any."
        outcome_reason:
          type: [string, "null"]
          description: "Why it was granted or refused. Required when refusing."
        asked_at: { type: string, format: date-time }
        decided_at: { type: [string, "null"], format: date-time }
        seats:
          type: [integer, "null"]
          description: "How many seats the request names. Null means the whole booking."
        event:
          type: [object, "null"]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        order:
          type: [object, "null"]
          properties:
            reference: { type: string }
            buyer: { type: [string, "null"] }
            email: { type: [string, "null"] }
            status: { type: string }
            total: { type: string, description: "Formatted in the reader's language." }

    ApiClient:
      type: object
      description: >-
        A connected storefront. Keys are listed as identity and provenance — an id, a label, a hint,
        when it was last used — and never as a secret: there is no endpoint that reads one back.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        site_url: { type: [string, "null"], format: uri }
        allowed_origins:
          type: [array, "null"]
          items: { type: string }
        status: { type: string, enum: [active, disabled] }
        last_seen_at: { type: [string, "null"], format: date-time }
        keys:
          type: array
          items:
            type: object
            properties:
              key_id: { type: string }
              label: { type: [string, "null"] }
              secret_hint:
                type: [string, "null"]
                description: "The last few characters, so a person can tell two keys apart."
              last_used_at: { type: [string, "null"], format: date-time }
              expires_at: { type: [string, "null"], format: date-time }

    Addon:
      type: object
      description: >-
        Something sold beside a ticket. Not an admission: nothing here produces an allocation, a
        ticket or a row on a door list.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        price: { type: integer, description: "Minor units, in the event's currency." }
        currency: { type: string }
        stock:
          type: [integer, "null"]
          description: "How many exist at all. Null means no limit."
        max_per_order: { type: integer }
        per:
          type: string
          enum: [order, ticket]
          description: >-
            `order` — the buyer picks a number. `ticket` — one each, priced per ticket and not
            chosen, which is a compulsory charge that is a thing rather than a fee.
        visible: { type: boolean }
        sold: { type: integer, description: "On live bookings only." }
        remaining:
          type: [integer, "null"]
          description: "Counted, never decremented — a cancelled booking gave its share back."
        shared:
          type: boolean
          description: "True where the whole account offers this, rather than this night alone."

    AddonInput:
      type: object
      required: [name, price]
      properties:
        id:
          type: [string, "null"]
          format: uuid
          description: "Present to keep an existing row; absent to create one."
        name: { type: string, maxLength: 120 }
        description: { type: [string, "null"], maxLength: 400 }
        price: { type: integer, minimum: 0 }
        stock: { type: [integer, "null"], minimum: 0 }
        max_per_order: { type: [integer, "null"], minimum: 1, maximum: 999 }
        per: { type: string, enum: [order, ticket] }
        visible: { type: boolean }

    DonationPrompt:
      type: object
      description: >-
        Whether this event asks for a gift, and what it suggests. A donation carries no booking fee
        and no tax — charging somebody for the privilege of giving you money is not a fee — so it is
        carried outside the subtotal both are computed from.
      properties:
        offered: { type: boolean }
        prompt: { type: [string, "null"] }
        suggested:
          type: [integer, "null"]
          description: "Minor units. Zero is a real choice: ask, but suggest nothing."

    AccessibleSeating:
      type: object
      description: >
        How this event handles the wheelchair spaces and the chairs beside them. Read on the event,
        set on the event; there is no separate endpoint because it is not a separate decision.
      properties:
        accessible_sale:
          type: string
          enum: [always, until, counter]
          description: >
            `always` sells them like any other seat. `until` keeps them off the public plan until
            `accessible_release_hours` before doors, after which they go on general sale because
            the hour arrived — nothing runs to release them. `counter` keeps them off it for good.


            Under `until` and `counter` the box office can sell them throughout: a house that holds
            seats back and then cannot sell them to the person on the telephone has held them back
            for nobody.
        accessible_release_hours:
          type: integer
          minimum: 0
          maximum: 8760
        accessible_releases_at:
          type: [string, "null"]
          format: date-time
          readOnly: true
          description: When they go on general sale, worked out rather than stored.
        ask_access_needs:
          type: boolean
          description: >
            Whether the checkout asks what a buyer needs in order to get in and sit down. The
            answer is free text, reaches the door list, never reaches a segment, and is erased with
            the buyer.

    BlockedBuyer:
      type: object
      required: [reason]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        email: { type: [string, "null"], format: email, maxLength: 190 }
        phone: { type: [string, "null"], maxLength: 40 }
        reason:
          type: string
          maxLength: 500
          description: Required — a block nobody wrote a reason for is one nobody can defend a year later.
        until:
          type: [string, "null"]
          format: date-time
          description: Null means until somebody lifts it. A date lifts it without anybody acting.
        in_force: { type: boolean, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }

    Promoter:
      type: object
      required: [name, code]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 160, example: Maria Ruiz }
        code:
          type: string
          maxLength: 40
          pattern: "^[A-Za-z0-9-]+$"
          description: Goes in their link and is read out over a telephone, so letters, digits and dashes only.
          example: maria
        contact_email: { type: [string, "null"], format: email }
        commission_rate:
          type: integer
          minimum: 0
          maximum: 10000
          description: Basis points — 750 is 7.5%. A percentage with a half in it is one somebody will round wrongly.
        commission_percent: { type: number, readOnly: true }
        active: { type: boolean }
        note: { type: [string, "null"], maxLength: 2000 }
        link_query:
          type: string
          readOnly: true
          description: >
            The query a link carries, e.g. `p=maria`. The host is the organiser's own site, which
            this endpoint deliberately does not choose: an account may have several.

    PriceTier:
      type: object
      required: [name, kind, value]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, maxLength: 120, example: Early bird }
        starts_at:
          type: [string, "null"]
          format: date-time
          description: Null means "from the beginning", which is what an early-bird tier means.
        ends_at:
          type: [string, "null"]
          format: date-time
          description: >
            Null means "until the doors open". Exclusive: a tier ending at nine and one starting
            at nine do not both claim nine o'clock — the second one has it.
        kind:
          type: string
          enum: [percent, amount]
          description: >
            `percent` is a signed whole percentage of the zone price; `amount` is signed minor
            units. Either way the result is never below zero.
        value:
          type: integer
          example: -20
        active:
          type: boolean
          readOnly: true
          description: Whether this window contains the moment the request was answered.

    RenewalRound:
      type: object
      description: >-
        One season offered to last season's subscribers, with a date on it. Until the date the
        chairs belong to the people who sat in them; after it they belong to whoever buys them
        first, with nothing swept in between.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        state:
          type: string
          enum: [open, closed]
        deadline: { type: string, format: date-time }
        live:
          type: boolean
          description: "Open *and* not past its deadline — which is what actually keeps the seats."
        counts:
          type: object
          properties:
            offered: { type: integer }
            accepted: { type: integer }
            declined: { type: integer }
            lapsed: { type: integer }
        data:
          type: array
          items: { $ref: "#/components/schemas/RenewalOffer" }

    RenewalOffer:
      type: object
      description: >-
        One subscriber's first refusal on their own chairs. An offer, never a booking: nothing is
        charged and no seat is allocated until they accept and pay like anybody else.
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: [string, "null"] }
        state:
          type: string
          enum: [offered, accepted, declined, lapsed]
          description: >-
            `lapsed` is written when a round closes. The seats stopped being kept at the deadline
            whether or not anybody wrote it down.
        invited_at: { type: [string, "null"], format: date-time }
        responded_at: { type: [string, "null"], format: date-time }
        seats:
          type: array
          description: The chairs, as a person would say them — section, row and seat.
          items: { type: string }

    ResaleListing:
      type: object
      description: >-
        One seat offered back to the public at what it cost. Face value always: there is no field
        for a price here, and a listing moves no inventory — the seat is merely offered until
        somebody else pays for it.
      properties:
        id: { type: string, format: uuid }
        state:
          type: string
          enum: [open, sold, withdrawn]
          description: "`open` is on offer, `sold` has changed hands, `withdrawn` was taken down."
        seat:
          type: string
          description: "Where it is, as a person would say it — section, row and seat."
        seller:
          type: string
          description: "The seller's name where they gave one, and their address where they did not."
        amount:
          type: integer
          description: "What they paid, in minor units. What the next buyer pays, to the penny."
        currency: { type: string, minLength: 3, maxLength: 3 }
        listed_at: { type: string, format: date-time }
        settled_at:
          type: [string, "null"]
          format: date-time
          description: "When it sold or was taken down. Null while it is still on offer."

    ChannelQuota:
      type: object
      description: >-
        One channel's promise for one night, and how much of it is gone. The promise is stored; the
        progress is counted on every read, because a quota kept in a column is a quota two
        simultaneous baskets both fit inside.
      properties:
        api_client_id: { type: string, format: uuid }
        name: { type: string }
        kind:
          type: string
          description: "What sort of channel it is — `storefront`, `box_office`, an integration."
        places:
          type: [integer, "null"]
          description: "The promise. Null is no limit, which is the ordinary case."
        note: { type: [string, "null"] }
        taken:
          type: integer
          description: >-
            Live holds plus live allocations, in places. A cancelled or refunded booking gives its
            places back: the agent who returns two hundred unsold seats gets the allowance with them.
        left: { type: [integer, "null"], description: "Null where there is no limit." }

    BasketRecovery:
      type: object
      description: >-
        One attempt to bring a buyer back to a purchase they started and did not finish. It holds
        no basket: the basket is on the order it points at, and a copy here would be a second cart
        to drift from the first.
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: [string, "null"] }
        event_id: { type: [string, "null"], format: uuid }
        event_name: { type: [string, "null"] }
        seats: { type: integer }
        total: { type: integer, description: "What the unfinished booking was worth, in minor units." }
        currency: { type: string, minLength: 3, maxLength: 3 }
        status:
          type: string
          enum: [waiting, sent, recovered, declined, expired]
          description: >-
            `waiting` has been noticed and not yet written to. `declined` is somebody who said no
            thank you and is never written to about this basket again. `expired` is a night that
            has been, or a payment that came back refused.
        reference: { type: [string, "null"], description: "The unfinished order." }
        recovered_reference:
          type: [string, "null"]
          description: "The booking they made when they came back, where they came back."
        sent_at: { type: [string, "null"], format: date-time }
        recovered_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    BasketSummary:
      type: object
      description: "Four numbers, and the one that matters: of the people written to, how many came back."
      properties:
        baskets: { type: integer }
        waiting: { type: integer, description: "Noticed, not yet written to." }
        written: { type: integer }
        recovered: { type: integer }
        declined: { type: integer }
        rate:
          type: integer
          description: "Percent of those written to who came back. Zero when nobody has been written to."
        won:
          type: array
          description: "Recovered value, per currency — an account selling in two has two answers."
          items:
            type: object
            properties:
              currency: { type: string }
              amount: { type: integer }
        lost:
          type: array
          items:
            type: object
            properties:
              currency: { type: string }
              amount: { type: integer }

    SeasonPass:
      type: object
      description: >-
        The offer: buy a whole run at once, and here is what that saves. A pass owns no inventory
        and no price of its own — every night is still priced by the event it belongs to.
      properties:
        id: { type: string, format: uuid }
        series_id: { type: string, format: uuid }
        series_name: { type: [string, "null"] }
        name: { type: string }
        description: { type: [string, "null"] }
        kind:
          type: string
          enum: [all, choose]
          description: "`all` is every published night still ahead; `choose` is a flexible pass."
        nights:
          type: [integer, "null"]
          description: "`choose` only: the fewest nights that still count as a season ticket."
        nights_on_sale:
          type: integer
          description: "How many nights it would actually sell today. Not how many the run has had."
        discount_kind: { type: string, enum: [percent, fixed] }
        discount_value:
          type: integer
          description: "A percentage 0–100, or an amount in minor units. Off the whole run, once."
        currency: { type: string, minLength: 3, maxLength: 3 }
        max_seats: { type: integer, description: "Seats one subscription may take." }
        on_sale_at: { type: [string, "null"], format: date-time }
        off_sale_at: { type: [string, "null"], format: date-time }
        status: { type: string, enum: [active, paused] }
        live:
          type: boolean
          description: "Active, inside its dates, and with more than one night left. The honest answer."
        sold: { type: integer, description: "Confirmed subscriptions." }
        position: { type: integer }
        created_at: { type: string, format: date-time }

    SeasonBooking:
      type: object
      description: >-
        One purchase over several nights. It groups orders and charges once; it owns no seats, no
        tickets and no allocations — those belong to the nights' own ordinary orders.
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        buyer: { type: [string, "null"] }
        seats: { type: integer }
        nights: { type: integer }
        total:
          type: integer
          description: "The sum of the nights' orders, which is what the card was charged."
        discount:
          type: integer
          description: "What the pass took off in total. Each night carries its own share of it."
        status: { type: string, enum: [pending, confirmed, cancelled] }
        at: { type: string, format: date-time }

    SeasonPassInput:
      type: object
      properties:
        series_id: { type: string, format: uuid }
        name: { type: string, maxLength: 160 }
        description: { type: [string, "null"], maxLength: 400 }
        kind: { type: string, enum: [all, choose] }
        nights:
          type: [integer, "null"]
          minimum: 2
          description: "Required for `choose`, ignored for `all`."
        discount_kind: { type: string, enum: [percent, fixed] }
        discount_value: { type: integer, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        max_seats: { type: integer, minimum: 1, maximum: 100 }
        on_sale_at: { type: [string, "null"], format: date-time }
        off_sale_at: { type: [string, "null"], format: date-time }
        status: { type: string, enum: [active, paused] }
        position: { type: integer, minimum: 0 }

    Voucher:
      type: object
      description: >-
        Money the organiser owes somebody. Not a discount: a discount changes what a booking costs
        and so changes the fee and the tax computed from it, while a voucher changes how an
        unchanged cost was settled. It is applied last, to the amount payable, after the arithmetic.
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [gift, credit]
          description: >-
            `gift` is bearer — it has a code, and whoever holds the code spends it. `credit` is
            named: it belongs to an email address, usually because a buyer took a refund as credit.
        code:
          type: [string, "null"]
          description: "Set on a gift and never on a credit. Stored upper-cased and trimmed."
        email:
          type: [string, "null"]
          format: email
          description: "Set on a credit and never on a gift. Stored lower-cased."
        amount: { type: integer, description: "What it was worth when issued, in minor units." }
        balance:
          type: integer
          description: "What is left. The sum of the movements, computed on every read."
        spent: { type: integer, description: "`amount` less `balance`." }
        currency: { type: string, minLength: 3, maxLength: 3 }
        note: { type: [string, "null"] }
        recipient:
          type: [string, "null"]
          description: >-
            Who a gift was made out to. Never used to decide whether it may be spent — a gift
            voucher is bearer, and a name on it is a name.
        expires_at: { type: [string, "null"], format: date-time }
        status: { type: string, enum: [active, void] }
        live:
          type: boolean
          description: "Active, in date, and with something left. The honest answer, not the stored one."
        created_at: { type: string, format: date-time }

    VoucherMovement:
      type: object
      description: >-
        One signed movement of a voucher's money. These rows are the balance; nothing here is ever
        edited or deleted, because a ledger that can be rewritten is not a ledger.
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [issue, spend, refund, void]
        amount:
          type: integer
          description: "Signed, in minor units. Negative is money leaving."
        at: { type: string, format: date-time }
        order_id: { type: [string, "null"], description: "The booking it was spent on, where there was one." }
        order_status: { type: [string, "null"] }

    VoucherInput:
      type: object
      required: [kind, amount, currency]
      properties:
        kind: { type: string, enum: [gift, credit] }
        code:
          type: [string, "null"]
          maxLength: 40
          description: "Required for a gift, ignored for a credit. Letters, numbers, dots and dashes."
        email:
          type: [string, "null"]
          format: email
          description: "Required for a credit, ignored for a gift."
        amount: { type: integer, minimum: 1, description: "In minor units." }
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: "It only pays for bookings in this currency. Nothing converts."
        note: { type: [string, "null"], maxLength: 200 }
        recipient: { type: [string, "null"], maxLength: 160 }
        expires_at: { type: [string, "null"], format: date-time }

    AccessCode:
      type: object
      description: >-
        A code that opens a sale, as against a discount code, which changes a price. The two are
        deliberately separate: a leaked discount costs money an organiser can calculate, a leaked
        presale code costs the presale its purpose.
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: "Stored upper-cased and trimmed." }
        label: { type: [string, "null"], description: "The organiser's own note: \"the mailing list\"." }
        event_id: { type: [string, "null"], format: uuid, description: "Null means every event." }
        event_name: { type: [string, "null"] }
        opens:
          type: string
          enum: [presale, always]
          description: >-
            `presale` buys between the presale opening and general sale. `always` buys at any time,
            even before the presale opens — the code an organiser gives their own staff.
        ticket_type_ids:
          type: array
          items: { type: string, format: uuid }
        starts_at: { type: [string, "null"], format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        max_uses: { type: [integer, "null"] }
        max_seats:
          type: [integer, "null"]
          description: "Seats one use may take. Null means whatever the event allows."
        used_count:
          type: integer
          description: "Live uses — a hold still running, or a booking placed. Not presses."
        status: { type: string, enum: [active, paused] }
        live:
          type: boolean
          description: "Switched on, inside its dates, and not used up. The honest answer, not the stored one."
        created_at: { type: string, format: date-time }

    AccessCodeInput:
      type: object
      properties:
        code:
          type: string
          maxLength: 40
          description: "Required on create, ignored on update — a code that has been sent out cannot be renamed."
        label: { type: [string, "null"], maxLength: 160 }
        event_id: { type: [string, "null"], format: uuid }
        opens: { type: string, enum: [presale, always] }
        ticket_type_ids:
          type: [array, "null"]
          items: { type: string, format: uuid }
        starts_at: { type: [string, "null"], format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        max_uses: { type: [integer, "null"], minimum: 1 }
        max_seats: { type: [integer, "null"], minimum: 1, maximum: 999 }
        status: { type: string, enum: [active, paused] }

    WalletSettings:
      type: object
      description: >-
        What is configured, never what is stored. Each `has_*` says a secret is present; `ready`
        says the pieces together can actually sign, which is the only thing that puts a button in
        front of a buyer.
      properties:
        apple:
          type: object
          properties:
            enabled: { type: boolean }
            pass_type_id: { type: [string, "null"] }
            team_id: { type: [string, "null"] }
            has_certificate: { type: boolean }
            has_key: { type: boolean }
            has_wwdr:
              type: boolean
              description: >-
                Apple's intermediate certificate, which has to travel with the signature or a phone
                will refuse the pass whatever it does on a desk.
            ready: { type: boolean }
        google:
          type: object
          properties:
            enabled: { type: boolean }
            issuer_id: { type: [string, "null"] }
            has_service_account: { type: boolean }
            ready: { type: boolean }
        look:
          type: object
          properties:
            background_colour: { type: [string, "null"] }
            text_colour: { type: [string, "null"] }
            logo_text: { type: [string, "null"] }

    WalletSettingsInput:
      type: object
      description: >-
        A secret field omitted keeps what is stored; sent as an empty string it is removed. Nothing
        here is ever read back.
      properties:
        apple_enabled: { type: boolean }
        apple_pass_type_id: { type: [string, "null"], maxLength: 190 }
        apple_team_id: { type: [string, "null"], maxLength: 60 }
        apple_certificate:
          type: [string, "null"]
          maxLength: 20000
          description: "The pass certificate in PEM, including the BEGIN and END lines."
        apple_key: { type: [string, "null"], maxLength: 20000 }
        apple_key_password:
          type: [string, "null"]
          maxLength: 190
          description: "Only where the key is encrypted."
        apple_wwdr: { type: [string, "null"], maxLength: 20000 }
        google_enabled: { type: boolean }
        google_issuer_id: { type: [string, "null"], maxLength: 60 }
        google_service_account:
          type: [string, "null"]
          maxLength: 20000
          description: "The whole service-account JSON file Google issued."
        background_colour: { type: [string, "null"], maxLength: 20 }
        text_colour: { type: [string, "null"], maxLength: 20 }
        logo_text: { type: [string, "null"], maxLength: 60 }

    EntrySlot:
      type: object
      description: >-
        One arrival window of a timed-entry event. The event's timezone is the clock these are read
        in; the instants themselves are absolute.
      properties:
        id: { type: string, format: uuid }
        label:
          type: string
          description: "What to call it — the organiser's own name, or the window's own clock."
        name:
          type: [string, "null"]
          description: "The name as it was actually typed, usually null."
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        capacity:
          type: [integer, "null"]
          description: "How many may come in. Null limits nothing."
        taken: { type: integer, description: "Places held or sold in this window." }
        remaining: { type: [integer, "null"] }
        sold: { type: integer, description: "Places sold — why a window cannot be removed." }
        status: { type: string, enum: [open, closed] }
        sold_out: { type: boolean }

    EntrySlotWrite:
      type: object
      required: [starts_at, ends_at]
      properties:
        id:
          type: [string, "null"]
          format: uuid
          description: "Present to edit a window, absent to create one."
        label: { type: [string, "null"], maxLength: 80 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        capacity: { type: [integer, "null"], minimum: 1 }
        status: { type: string, enum: [open, closed], default: open }

    Settlement:
      type: object
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/SettlementRow" }
        totals:
          type: array
          description: "One entry per currency. Never one entry adding them together."
          items:
            allOf:
              - type: object
                properties:
                  currency: { type: string, minLength: 3, maxLength: 3 }
                  events: { type: integer }
              - $ref: "#/components/schemas/SettlementAmounts"
        period:
          type: object
          properties:
            from: { type: [string, "null"], format: date-time }
            to: { type: [string, "null"], format: date-time }
            basis: { type: string, enum: [paid, event] }
        commission_rate:
          type: integer
          description: "The platform's share in basis points: 250 is 2.5%."

    SettlementRow:
      allOf:
        - type: object
          properties:
            event:
              type: object
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                starts_at: { type: [string, "null"], format: date-time }
            currency: { type: string, minLength: 3, maxLength: 3 }
        - $ref: "#/components/schemas/SettlementAmounts"

    SettlementAmounts:
      type: object
      description: "Every amount is in the row's own currency, in minor units."
      properties:
        orders: { type: integer }
        seats: { type: integer, description: "Seats still sold." }
        seats_refunded: { type: integer }
        tickets: { type: integer, description: "What the seats came to, before any discount." }
        discount: { type: integer }
        fee: { type: integer, description: "Booking fees the organiser charged." }
        tax: { type: integer, description: "Tax charged, before any refund." }
        charged: { type: integer, description: "What the buyers actually paid." }
        voucher:
          type: integer
          description: >-
            The part of `charged` settled out of a gift voucher or account credit rather than
            through a gateway. Inside `charged`, never beside it: that money was taken when the
            voucher was bought, so it is the organiser's — but it reached no bank statement in this
            period, and a settlement that could not say so is one nobody can reconcile.
        refunded: { type: integer }
        kept: { type: integer, description: "`charged` less `refunded`." }
        tax_kept:
          type: integer
          description: >-
            The tax on the money that stayed. A part refund returns seats and the tax on them goes
            with them; nothing records that split, so it is apportioned to what is left.
        commission: { type: integer, description: "Charged on `kept` less `tax_kept`." }
        payable: { type: integer, description: "`kept` less `commission`." }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable identifier.
              examples: [seat_unavailable, capacity_unavailable, hold_expired, invalid_signature, tenant_limit_reached]
            message: { type: string }
            details:
              type: object
              additionalProperties: true
            request_id: { type: string }

    SeatUnavailableError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            error:
              type: object
              properties:
                details:
                  type: object
                  properties:
                    unavailable_seat_ids:
                      type: array
                      items: { type: string, format: uuid }

    Paginated:
      type: object
      properties:
        data: { type: array, items: {} }
        meta:
          type: object
          properties:
            page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            last_page: { type: integer }

    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [active, suspended, cancelled] }
        timezone: { type: string }
        locale: { type: string }

    Venue:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: [string, "null"] }
        city: { type: [string, "null"] }
        country: { type: [string, "null"] }
        timezone: { type: string }
        created_at: { type: string, format: date-time }

    VenueInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 160 }
        address: { type: [string, "null"] }
        city: { type: [string, "null"] }
        country: { type: [string, "null"], maxLength: 2 }
        timezone: { type: string }

    SeatMap:
      type: object
      properties:
        id: { type: string, format: uuid }
        venue_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        published_version:
          oneOf:
            - $ref: "#/components/schemas/SeatMapVersion"
            - type: "null"
        draft_version:
          oneOf:
            - $ref: "#/components/schemas/SeatMapVersion"
            - type: "null"

    SeatMapVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
        seat_map_id: { type: string, format: uuid }
        version: { type: integer }
        status: { type: string, enum: [draft, published] }
        seat_count: { type: integer }
        published_at: { type: [string, "null"], format: date-time }
        geometry: { $ref: "#/components/schemas/Geometry" }

    Geometry:
      type: object
      description: |
        A chart: what a venue looks like. It says nothing about any event — whether a seat is free
        is derived per event from overrides, holds and allocations (ADR-0002).

        **A row does not store seat coordinates.** It stores an anchor, a rotation, a curve and a
        seat spacing, and positions follow from those. That is what makes "Number of seats",
        "Rotation", "Curve" and "Seat spacing" editable fields in the designer rather than
        read-outs. `curve` is the sagitta as a percentage of the row's chord, so the number means
        the same on a six-seat row and a sixty-seat one, and seats are spread evenly along the arc
        rather than by equal angle.

        **Keys are identity; labels are presentation.** Renumbering a row or renaming a section
        changes what is printed and never what a sold ticket points at.
      required: [version, floors]
      properties:
        version: { type: integer, const: 2 }
        name: { type: string }
        focalPoint:
          type: [object, "null"]
          description: The spot the venue faces, usually the middle of the stage. What "best available" sorts towards.
          properties:
            x: { type: number }
            y: { type: number }
        categories:
          type: array
          description: Price tiers. Every bookable object needs one before an event can be priced.
          items:
            type: object
            required: [key, label]
            properties:
              key: { type: string }
              label: { type: string }
              color: { type: string }
              accessible: { type: boolean, default: false }
        floors:
          type: array
          minItems: 1
          items:
            type: object
            required: [key, canvas, objects]
            properties:
              key: { type: string }
              name: { type: string }
              canvas:
                type: object
                properties:
                  width: { type: number, minimum: 100, maximum: 20000 }
                  height: { type: number, minimum: 100, maximum: 20000 }
                  background: { type: [string, "null"] }
              objects:
                type: array
                description: Ordered; the array order is the paint order.
                items: { $ref: "#/components/schemas/ChartObject" }

    ChartObject:
      type: object
      description: |
        One object on a floor, or inside a section. `type` decides which fields apply.

        `row`, `section`, `area`, `table` and `booth` carry bookable places. `shape`, `text`,
        `image` and `icon` are scenery and are placed on one of four layers.
      required: [type, key]
      properties:
        type:
          type: string
          enum: [row, section, area, table, booth, shape, text, image, icon]
        key:
          type: string
          description: Stable for the life of the map. Never reused — a sold seat points at it.
        layer:
          type: string
          enum: [surroundings, background, interactive, foreground]
          default: interactive
        categoryKey: { type: [string, "null"] }
        entrance: { type: [string, "null"] }
        labeling:
          type: object
          description: |
            How the object is labelled. `displayedLabel` overrides what a buyer sees; leave it null
            to show `label` itself. `locked` means the label comes from an automatic scheme.
          properties:
            enabled: { type: boolean }
            label: { type: string }
            displayedLabel: { type: [string, "null"] }
            position:
              type: string
              enum: [both, start, end, none]
              description: Which ends of a row show its label.
            displayedType: { type: string }
            visible: { type: boolean }
            fontSize: { type: number }
            positionX: { type: number }
            positionY: { type: number }
            locked: { type: boolean }
        x: { type: number, description: "row, table, text, icon: the anchor." }
        y: { type: number }
        rotation: { type: number }
        curve:
          type: number
          description: "row: the sagitta as a percentage of the chord. 0 is straight; the sign chooses the direction."
        seatSpacing:
          type: number
          description: "row: the gap between chairs, so the distance between centres is 18 + this."
        seats:
          type: array
          description: "row, table: the chairs, in order along the row or around the table."
          items:
            type: object
            required: [key, label]
            properties:
              key: { type: string }
              label: { type: string }
              type:
                type: string
                enum: [seat, empty]
                default: seat
                description: An `empty` placeholder holds a gap — a pillar, a camera position — without shifting the seats after it.
              categoryKey: { type: [string, "null"] }
              accessible: { type: boolean }
              entrance: { type: [string, "null"] }
              seat_id:
                type: [string, "null"]
                format: uuid
                description: |
                  Present on the embed seat-map response only. The stable id to send when holding
                  this seat, and the key to join availability on — never pair geometry with
                  availability by position.
        polygon:
          type: array
          description: "section: its outline. May be concave."
          items:
            type: array
            items: { type: number }
        objects:
          type: array
          description: "section: what is inside it."
          items: { $ref: "#/components/schemas/ChartObject" }
        shape:
          description: "area, booth: the drawn shape. On a table this is instead the word `round` or `rectangular`."
          oneOf:
            - type: string
              enum: [round, rectangular]
            - type: object
              properties:
                kind: { type: string, enum: [rect, ellipse, polygon] }
                x: { type: number }
                y: { type: number }
                width: { type: number }
                height: { type: number }
                rotation: { type: number }
                cornerRadius: { type: number }
                points:
                  type: [array, "null"]
                  items:
                    type: array
                    items: { type: number }
        capacity:
          type: object
          description: "area, booth: how many people it holds and whether they choose a spot."
          properties:
            type:
              type: string
              enum: [generalAdmission, fixed]
              description: General admission sells any quantity up to `places`; fixed sells the whole object at once.
            places: { type: integer, minimum: 1 }
        bookAs:
          type: string
          enum: [seat, table]
          description: "table: whether a buyer takes one chair or the whole table."
        capacity_object_id:
          type: [string, "null"]
          format: uuid
          description: Present on the embed seat-map response only, for areas, booths and whole tables.
        width: { type: number }
        height: { type: number }
        translucent: { type: boolean }
        scale: { type: number }
        kind: { type: string, description: "shape: stage, aisle, wall, entrance, exit, rect, ellipse, polygon or line." }
        fill: { type: [string, "null"] }
        label: { type: [string, "null"] }
        text: { type: string, description: "text: the words." }
        fontSize: { type: number }
        color: { type: [string, "null"] }
        href: { type: string, description: "image: usually a scanned floor plan being traced over." }
        opacity: { type: number }
        name: { type: string, description: "icon: wheelchair, toilets, bar, food, entrance, exit, stairs or lift." }
        size: { type: number }

    ValidationReport:
      type: object
      properties:
        valid:
          type: boolean
          description: False when there are errors. Warnings never make a chart invalid.
        seat_count:
          type: integer
          description: Named seats only — what the plan limit measures.
        places:
          type: integer
          description: Everything sellable, so seats plus the capacity of every area, booth and whole table.
        checks:
          type: array
          description: The checklist shown in the designer's chart panel.
          items:
            type: object
            properties:
              code:
                type: string
                enum: [no_duplicate_objects, all_labeled, all_categorized, one_category_per_type, focal_point]
              label: { type: string }
              ok: { type: boolean }
        errors:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }
              path: { type: string }
        warnings:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }
              path: { type: string }

    Announcement:
      type: object
      properties:
        id: { type: string, format: uuid }
        audience: { type: string, enum: [event, everyone, segment] }
        event: { type: [string, "null"] }
        segment:
          type: [string, "null"]
          description: >-
            The saved audience it was addressed to, by name. Null on the two simple audiences, and
            null as well when that list has since been deleted — an announcement is a thing that
            happened, and what it reached is written down as its deliveries either way.

        channels:
          type: array
          items: { type: string }
        subject: { type: [string, "null"] }
        body: { type: string }
        status: { type: string, enum: [draft, sending, sent] }
        recipients: { type: integer, description: "People, not messages." }
        sent: { type: integer }
        failed: { type: integer }
        total: { type: integer, description: Messages queued for it in all. }
        created_at: { type: string, format: date-time }

    Segment:
      type: object
      description: >-
        A named question about buyers — "came last season, has not booked this one". It holds rules
        and never people: the audience is worked out again every time it is used, because a stored
        list goes stale the moment somebody buys and a stale audience is a mailing about a show the
        reader already has tickets for. Nothing here, or anywhere else in the API, returns the
        addresses a segment describes.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        description: { type: [string, "null"], maxLength: 300 }
        rules: { $ref: "#/components/schemas/SegmentRules" }
        explained:
          type: object
          description: >-
            The same rules with event ids resolved to names, so a screen can say what a saved
            audience means without fetching every event to find out.
          additionalProperties: true
        people:
          type: integer
          description: How many people it currently reaches. Present on a single segment, not in the list.
        created_at: { type: string, format: date-time }

    SegmentRules:
      type: object
      description: >-
        A closed vocabulary, not a query language. Adding a clause means adding a case to the
        resolver, a rule to the validator, a sentence to six catalogues and a control to the
        screen — which is friction on purpose: a saved query over buyer data is a way to write, by
        accident, both the query that takes an hour and the one that reaches somewhere nobody meant
        to expose. A clause this version does not recognise is dropped on the way in rather than
        stored, so a rule nothing applies cannot quietly widen an audience.
      properties:
        bought_events:
          type: array
          maxItems: 200
          items: { type: string, format: uuid }
          description: Bought a ticket for any of these nights.
        not_bought_events:
          type: array
          maxItems: 200
          items: { type: string, format: uuid }
          description: And none of these — the second half of "has not booked this season".
        categories:
          type: array
          maxItems: 40
          items: { type: string, maxLength: 60 }
        since:
          type: [string, "null"]
          format: date
          description: Bought since this day, counted by when the booking was paid for rather than started.
        until:
          type: [string, "null"]
          format: date
          description: Bought up to and including this whole day.
        min_orders: { type: [integer, "null"], minimum: 1, maximum: 1000 }
        min_spend:
          type: [integer, "null"]
          minimum: 0
          description: >-
            Minor units, and refused without `currency`: an account selling in euros and rials has
            no single number for "spent more than a hundred", and adding the two would produce a
            segment whose whole membership is an arithmetic mistake.
        currency: { type: [string, "null"], minLength: 3, maxLength: 3 }
        attended:
          type: boolean
          description: Actually turned up and was scanned in, which is not the same as having bought.

    Shift:
      type: object
      description: >-
        One person, one drawer, between two times. What the till should hold is counted on every
        read while it is open — there is no column to take it off — and written down once at the
        close, beside the physical count it was compared against.
      properties:
        id: { type: string, format: uuid }
        user: { type: [string, "null"] }
        event: { type: [string, "null"] }
        currency: { type: string }
        opening_float: { type: integer }
        opened_at: { type: string, format: date-time }
        closed_at: { type: [string, "null"], format: date-time }
        open: { type: boolean }
        takings:
          type: object
          description: >-
            Split by how each sale was paid for. A sale later refunded still counts as cash taken,
            with the refund counted beside it: the money went into the drawer and then came out
            again, and nought against both would hide an evening of handing money back.
          properties:
            orders: { type: integer }
            cash: { type: integer }
            card: { type: integer }
            transfer: { type: integer }
            owed:
              type: integer
              description: Invoiced, and not in the drawer tonight.
            comp:
              type: integer
              description: Given away — a count of orders, not an amount.
            cash_refunded: { type: integer }
        movements:
          type: object
          properties:
            in: { type: integer }
            out: { type: integer }
        expected_cash:
          type: integer
          description: Float + cash taken − cash handed back + movements in − movements out.
        counted_cash:
          type: [integer, "null"]
          description: Null while the till is open — a drawer nobody has counted has no count.
        difference:
          type: [integer, "null"]
          description: >-
            Counted minus expected, so a positive number is an over and a negative one a short, the
            way a person says it. Null while the till is open: a zero there would read as
            "it balanced".
        note: { type: [string, "null"] }

    MarketingConsent:
      type: object
      description: >-
        One person's current answer to "may we write to you about things you have not bought?",
        with the log it was folded from. Consent is given to an organiser and never to this
        platform: agreeing to hear from a theatre in Berlin is not agreeing to hear from a promoter
        in Tehran who uses the same software, so nothing here is shared between accounts.
      properties:
        state:
          type: string
          enum: [in, out, unasked]
          description: >-
            Three states, not two. `unasked` is where most people are, and showing it as a refusal
            would suggest somebody had said no — which is exactly the mistake this table exists to
            prevent.
        source:
          type: [string, "null"]
          enum: [checkout, link, panel, import, erasure, null]
        decided_at: { type: [string, "null"], format: date-time }
        history:
          type: array
          description: >-
            Append-only. A year later the question is not what the answer is but when it was given
            and what the person was shown, and only a log answers that.
          items:
            type: object
            properties:
              action: { type: string, enum: [in, out] }
              source: { type: string }
              note: { type: [string, "null"] }
              at: { type: string, format: date-time }


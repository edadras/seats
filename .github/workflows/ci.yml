name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    # PostgreSQL is not optional: the seat-exclusivity guarantees live in partial unique indexes
    # and SELECT ... FOR UPDATE. Running these tests on SQLite would test a different system.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seatmap
          POSTGRES_PASSWORD: seatmap
          POSTGRES_DB: seatmap_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, redis, intl, zip, gd
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: api/vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('api/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan seatmap:generate-signing-key

      - name: Migrate
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: seatmap_test
          DB_USERNAME: seatmap
          DB_PASSWORD: seatmap
        run: php artisan migrate --force

      - name: Verify the integrity indexes exist
        env:
          PGPASSWORD: seatmap
        run: |
          # These indexes are what make double-selling impossible. If a migration ever drops one,
          # the concurrency tests would still pass by luck on a quiet runner — so assert directly.
          for index in allocations_one_active_per_seat \
                       allocations_unique_per_external_order_seat \
                       hold_items_one_active_per_seat \
                       hold_items_capacity_active \
                       allocations_capacity_active; do
            psql -h 127.0.0.1 -U seatmap -d seatmap_test -tAc \
              "SELECT 1 FROM pg_indexes WHERE indexname = '$index'" | grep -q 1 \
              || { echo "::error::Missing integrity index $index"; exit 1; }
            echo "  present: $index"
          done

          # Capacity objects are guarded by a check constraint rather than a unique index: a hold
          # or allocation must be a named seat or a quantity, never both and never neither.
          for constraint in hold_items_seat_xor_capacity allocations_seat_xor_capacity; do
            psql -h 127.0.0.1 -U seatmap -d seatmap_test -tAc \
              "SELECT 1 FROM pg_constraint WHERE conname = '$constraint'" | grep -q 1 \
              || { echo "::error::Missing integrity constraint $constraint"; exit 1; }
            echo "  present: $constraint"
          done

      - name: Unit and feature tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: seatmap_test
          DB_USERNAME: seatmap
          DB_PASSWORD: seatmap
          REDIS_HOST: 127.0.0.1
        run: ./vendor/bin/phpunit

  editor:
    name: Chart model
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: node --test tests/js/chart.test.cjs

  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate the specification
        run: npx --yes @redocly/cli@latest lint docs/openapi.yaml --format stylish

  languages:
    name: Six languages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Every first-party module names its strings in the catalogue
        run: |
          # A module whose name renders as `modules.acme.thing.name` is a module nobody translated.
          for manifest in modules/*/*/module.json; do
            key=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['key'])" "$manifest")
            path="modules.$(echo "$key" | tr '/-' '._')"
            for field in name description; do
              php -r '
                $c = require "api/lang/en/modules.php";
                $parts = explode(".", $argv[1]);
                array_shift($parts);
                $parts[] = $argv[2];
                foreach ($parts as $part) {
                    if (! is_array($c) || ! isset($c[$part])) { exit(1); }
                    $c = $c[$part];
                }
              ' "$path" "$field" || { echo "::error::$key has no $field in api/lang/en/modules.php"; exit 1; }
            done
            echo "  named: $key"
          done

      - name: No locale may fall behind English
        run: |
          # Missing keys, stale keys left by a rename, and placeholders that differ between
          # translations of the same string — a translation that silently drops :max tells a buyer
          # they may select up to seats. See ADR-0005 §2.
          node tools/i18n-check.mjs

      - name: The panel and its catalogue agree, in both directions
        run: |
          # t() never throws: a mistyped key renders its own last segment on the screen, and a
          # catalogue entry nobody looks up is six translations of a string that is never shown.
          # Neither shows up in the check above, because both locales agree with each other.
          node tools/panel-strings-check.mjs

  plugin:
    name: WordPress plugin
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: cs2pr

      - name: Lint every PHP file against the minimum supported version
        run: |
          # WordPress hosts run older PHP than the API does; syntax that is fine in 8.4 may not be.
          find wordpress-plugin -name '*.php' -print0 | xargs -0 -n1 php -l

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: One seat picker, not two
        run: |
          # Both consumers ship a copy of shared/seat-picker. If either has been edited directly,
          # syncing produces a diff — and the two would otherwise fork in silence.
          tools/sync-seat-picker.sh
          git diff --exit-code wordpress-plugin/seatmap-connect/assets api/public/site

      - name: Every string the picker asks for is provided by every host
        run: node tools/picker-strings-check.mjs

      - name: The plugin's six languages are still the platform's six languages
        run: |
          # The .po and .mo files are generated from api/lang, not typed: a change to a msgid in the
          # plugin, or to a word in the catalogue, has to be carried across or the plugin ships a
          # translation for a string it no longer says. The tool also fails outright on any msgid
          # with no translation, so a new string cannot reach a shop untranslated.
          node tools/sync-wordpress-strings.mjs
          git diff --exit-code wordpress-plugin/seatmap-connect/languages

      - name: Check plugin JavaScript parses
        run: |
          node --check wordpress-plugin/seatmap-connect/assets/js/widget.js
          node --check wordpress-plugin/seatmap-connect/blocks/editor.js

      - name: Check designer JavaScript parses
        run: |
          for file in api/public/editor/js/*.js; do node --check "$file"; done

      - name: Modules must parse on the oldest PHP the API supports
        run: |
          # A module is deployed by an operator, not installed by composer, so nothing else would
          # catch a syntax error in one before it took a tenant's checkout down.
          find modules -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: The PHP and JavaScript seat maths must agree
        run: |
          # Regenerate the golden fixture from the JavaScript and fail if it differs from the one
          # committed — the PHP unit tests assert against that file, so a silent drift between the
          # two implementations would otherwise go unnoticed until seats moved.
          cd api && node tests/js/generate-golden.cjs
          git diff --exit-code tests/Fixtures/row-geometry-golden.json

  scanner:
    name: Door scanner
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: checkin-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl
          coverage: none

      - name: The scanner's copy of the catalogue is still the catalogue
        working-directory: .
        run: |
          # The door is the one place on the platform that carries a second copy of a translation,
          # because it has to work with no network (ADR-0005). The copy is generated, so a change to
          # api/lang/*/checkin.php that was not synced is a scanner shipping yesterday's words.
          node tools/sync-checkin-strings.mjs
          git diff --exit-code checkin-app/lib/l10n/strings.g.dart checkin-app/web/index.html

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build for the web, exactly as build.sh does
        run: flutter build web --release --base-href=/checkin/ --no-web-resources-cdn

      - name: Nothing the door needs may come from a CDN
        run: |
          # A scanner is used on venue wifi that is captive, filtered, or simply bad. Every one of
          # these was a runtime fetch to gstatic.com or jsdelivr.net before it was pinned local, and
          # each one, missing, is a scanner that cannot read a ticket.
          test -f build/web/canvaskit/canvaskit.wasm
          test -f build/web/assets/fonts/Roboto-Regular.ttf
          test -f build/web/zxing/index.js
          test -f build/web/zxing/zxing_reader.wasm

          # Arabic script. Roboto has none, and the engine's answer to a glyph it lacks is to fetch
          # a fallback from gstatic — switched off here and blocked at a venue anyway. Without this
          # the Persian and Arabic doors render every word as an empty box.
          test -f build/web/assets/fonts/Vazirmatn-Regular.ttf

          # And the flag that makes the loader prefer the local copy is actually set. The gstatic
          # URL still appears in the loader's other branch, so its absence is not what to assert.
          grep -q '"useLocalCanvasKit":true' build/web/flutter_bootstrap.js

          # The decoder must be ours, not the package's CDN default.
          grep -q 'id="mobile-scanner-zxing-wasm"' build/web/index.html
